spring.datasource.url=jdbc:mysql://127.0.0.1:3306/teste_java?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.default_schema=teste_java
spring.jpa.properties.hibernate.default_catalog=teste_java
spring.datasource.username=root
spring.datasource.password=masterkey
spring.jpa.database=mysql
spring.data.jpa.repositories.enabled=true
spring.datasource.hikari.auto-commit=true

# Explicitly declare the dialect if auto-detection still fails
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

logging.level.org.springframework.web=DEBUG
management.endpoints.web.exposure.include=*