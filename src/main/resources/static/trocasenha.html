<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0 - Trocar Senha</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="container">
    <h1>Troca senha - TaskController 1.0</h1>

    <div id="apresentacao" style="margin-bottom: 15px; font-weight: bold; color: #475569;"></div>

    <div class="text">
        <label>Senha Atual</label>
        <input type="password" id="senhaAtual" required>
    </div>
    <div class="text">
        <label>Nova Senha</label>
        <input type="password"  id="novaSenha" required>
    </div>
    <div class="text">
        <label>Confirmar Nova Senha</label>
        <input type="password" id="confirmarSenha" required>
    </div>

    <div class="btn-group">
        <button type="button" class="btn" onclick="trocarSenha()"> Salvar </button>
        <button type="button" class="btn" onclick="history.back()">Cancelar </button>
    </div>
    <div id="resultado" style="margin-top: 15px; font-weight: 500;"></div>
</div>

<script>
    const API_LOGIN = 'http://localhost:8080/login';

    // 🌟 Reconstruindo o objeto lendo as chaves separadas que você gravou no login
    const usuarioLogado = {
        nome: sessionStorage.getItem("usuarioNome"),
        idusuario: sessionStorage.getItem("usuarioIdUsuario") || sessionStorage.getItem("usuarioidusuario"),
        login: sessionStorage.getItem("usuarioLogin"),
        senha: sessionStorage.getItem("usuarioSenha")
    };

    // Exibe o nome do usuário na tela ao carregar
    document.addEventListener('DOMContentLoaded', () => {
        const divApresentacao = document.getElementById("apresentacao");

        // Verifica se a variável do nome existe e não está vazia
        if (usuarioLogado.nome) {
            divApresentacao.textContent = "Usuário: " + usuarioLogado.nome;
        } else {
            divApresentacao.textContent = "Usuário não identificado.";
        }
    });

    async function trocarSenha() {
        const senhaAtualDigitada = document.getElementById("senhaAtual").value;
        const novaSenha = document.getElementById("novaSenha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        // 1. Validações de Campos Obrigatórios
         if (!senhaAtualDigitada || !novaSenha || !confirmarSenha) {
             mostrarMensagemNaTela("Por favor, preencha todos os campos.", "red");
             return;
         }

        // 2. Valida se a nova senha coincide com a confirmação
         if (novaSenha !== confirmarSenha) {
             mostrarMensagemNaTela("A nova senha e a confirmação não conferem.", "red");
             return;
         }

        // 3. Monta o objeto com os dados certos para enviar ao Back-end
        const dadosTroca = {
            idusuario: usuarioLogado.idusuario, // Identifica quem está mudando
            login: usuarioLogado.login,
            senhaNova: novaSenha
        };

        try {
            const response = await fetch(`${API_LOGIN}/trocarsenha`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosTroca) // Envia o objeto correto
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            // Atualiza a senha no armazenamento local para o usuário não ser deslogado por inconsistência
            usuarioLogado.senha = novaSenha;
            sessionStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));

            mostrarMensagemNaTela("Senha alterada com sucesso! Redirecionando...", "green");

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

        } catch (error) {
            mostrarMensagemNaTela("Erro ao trocar senha: " + error.message, "red");
        }
    }

    // Melhorei a função de mensagem para aceitar cores dinâmicas (Verde para sucesso, Vermelho para erro)
    function mostrarMensagemNaTela(mensagem, cor) {
        const container = document.getElementById("resultado");
        if (container) {
            container.textContent = mensaje = mensagem;
            container.style.color = cor;
        } else {
            alert(mensagem);
        }
    }
</script>
</body>
</html>
