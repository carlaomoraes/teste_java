<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/status.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<script src="js/utils/mensagens.js"></script>
<div class="container">
    <h1>Status - TaskController 1.0</h1>
    <div id="Status" >
        <div class="col-md-12 mb-12">
            <label class="form-label">
                Empreendimento *
            </label>

            <select id="comboEmpreendimento"
                    class="form-select"
                    required>
            </select>
        </div>
        <div class="col-md-12 mb-12">
            <label for="idstatus" class="form-label">ID do status</label>
            <input type="number" onblur="buscarPorLinha(document.getElementById('idstatus').value)" name="idstatus" id="idstatus" placeholder="ID do status (Deixe vazio para novo)">
            <label for="descstatus" class="form-label">Descrição</label>
            <input type="text" id="descstatus" placeholder="Descrição do status" oninput="converterMaiusculo(this)">
        </div>
        <div class="col-md-12 mb-12">
            <label class="form-label">
                Aplicável a:
            </label>

            <select id="comboTipo"
                    class="form-select"
                    required>
            </select>
        </div>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label for="txtOrdem" class="form-label">Ordem *</label>
                <input type="text" id="txtOrdem" maxlength="10">
            </div>
            <div class="col-md-3 mb-3">
                <label for="cor">Cor do Status</label>
                <input type="color" id="cor" value="#2196F3">
            </div>
        </div>
        <label class="checkbox-group">
            <input type="checkbox" id="ativo" value="1">Ativo
            <input type="checkbox" id="inicial" value="0">Status inicial
            <input type="checkbox" id="finalizado" value="0">Status finalizado
            <input type="checkbox" id="cancelado" value="0">Status cancelado
        </label>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-add"  onclick="criarTipostatus()">Novo</button>
            <button type="button" class="btn btn-salvar"  onclick="salvarTipostatus()">Salvar</button>
            <button type="button" class="btn btn-listar" onclick="listarTipostatus()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>
</div>

<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API = 'http://localhost:8080/status_entidades';
    const API_EMPREENDIMENTO ='http://localhost:8080/empreendimento';

    // ==============================================================
    // CARREGAR COMBOS
    // ==============================================================
    async function carregarEmpreendimento() {
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/montaComboEmpreendimento`);
            const empreendimentos = await resposta.json();
            comboEmpreendimento.innerHTML = '<option value="">Selecione...</option>';
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimento.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela( "resultadogeral",MSG.erroCarregar("EMPREENDIMENTO"), "error");
        }
    }
    async function carregarTipoTarefa() {
        const comboTipo = document.getElementById("comboTipo");
        try {
            const resposta = await fetch(`${API}/DTO/montaComboTipoEntidades`);
            const tipos = await resposta.json();
            comboTipo.innerHTML = '<option value="">Selecione...</option>';
            tipos.forEach(t => {
                const opcao = document.createElement('option');
                opcao.value = t.idtipo_entidade;
                opcao.textContent = t.desctipo_entidade;
                comboTipo.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado", MSG.erroCarregar("TIPO ENTIDADES"), "error");
        }
    }

    // ==============================================================
    // INICIALIZAÇÃO
    // ==============================================================
    document.addEventListener('DOMContentLoaded',() => {
            carregarEmpreendimento();
            carregarTipoTarefa();
            habilitaCampos("C");
        }
    );
    // ==============================================================
    // ALTERAÇÃO DO EMPREENDIMENTO
    // ==============================================================
    document.getElementById('comboEmpreendimento').addEventListener('change',() => {
            listarTipostatus();
            habilitaCampos("C");
        }
    );
    document.getElementById('comboTipo').addEventListener('change',() => {
        buscaMaiorOrdem(document.getElementById('comboEmpreendimento').value,
                                                                    document.getElementById('comboTipo').value);
        }
    );
    async function buscaMaiorOrdem(idEmpreendimento, idStatus) {
        if (idEmpreendimento === "") {
            mostrarMensagemNaTela("resultadogeral", "Selecione um empreendimento!", "warning");
            return false;
        }
        if (idStatus === "") {
            mostrarMensagemNaTela("resultadogeral", "Selecione um objeto!", "warning");
            return false;
        }
        try {
            const linha =`${API}/proximaordem?idEmpreendimento=${idEmpreendimento}&idStatusEntidade=${idStatus}`;
            const response = await fetch(linha);
            if (!response.ok) {
                const msg = await response.text();
                mostrarMensagemNaTela("resultadogeral",msg || "Erro ao buscar ordem!","error");
                return false;
            }
            const ordem = await response.json();
            document.getElementById("txtOrdem").value = ordem;
        } catch (error) {
            mostrarMensagemNaTela(
                "resultadogeral",
                error.message || "Erro ao buscar ordem",
                "error"
            );
            return false;
        }
    }

    async function criarTipostatus() {
        if (Number(document.getElementById('comboEmpreendimento').value) === 0) {
            mostrarMensagemNaTela("resultado", "Selecione um empreendimento!", "warnning");
            return;
        }
        habilitaCampos("E");
    }

    async function salvarTipostatus() {
        if (Number(document.getElementById('comboEmpreendimento').value) === 0) {
            mostrarMensagemNaTela("resultado", "Selecione um empreendimento!", "warnning");
            return;
        }
        const idempreendimento = document.getElementById('comboEmpreendimento').value;
        const idtipoentidade = document.getElementById('comboTipo').value;
        const idstatus = Number(document.getElementById("idstatus").value);
        const descstatus = document.getElementById('descstatus').value;
        const inicial = document.getElementById('inicial').checked;
        const ativo = document.getElementById('ativo').checked;
        const cancelado = document.getElementById('cancelado').checked;
        const finalizado = document.getElementById('finalizado').checked;
        if(corHexValida(document.getElementById('cor').value)) {
            cor = document.getElementById('cor').value;
        } else {
            cor = "6c757d";
        }
        const ordem = document.getElementById('txtOrdem').value;

        const Tipostatus = {
            idstatus: idstatus || null,
            descstatus: descstatus || null,
            idtipoentidade: idtipoentidade || null,
            ativo: ativo || false,
            cancelado: cancelado || false,
            finalizado: finalizado || false,
            inicial: inicial || false,
            cor: cor || "6c757d",
            ordem: ordem || 1,
            idempreendimento: idempreendimento || null
        };
        try {
            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(Tipostatus)
            });
            if (!response.ok) {
                const erro = await response.text();
                console.error(erro);
                mostrarMensagemNaTela("resultado",MSG.erroSalvar("status"),"error");
                throw new Error(`Erro HTTP: ${response.status}`);

            }
            const data = await response.json();
            mostrarMensagemNaTela("resultado", MSG.salvo("status"), "success");
            setTimeout(() => {
                limparFormulario();
                listarTipostatus();
                habilitaCampos("C");
            }, 1000);

        } catch (error) {
             //mostrarMensagemNaTela("resultado",MSG.erroSalvar("status"),"error");
            mostrarMensagemNaTela("resultado",error.message,"error");
        }
    }
    async function limparFormulario() {
        document.getElementById("idstatus").value = "";
        document.getElementById('descstatus').value = "";
        document.getElementById('inicial').checked = false;
        document.getElementById('ativo').checked = false;
        document.getElementById('cancelado').checked = false;
        document.getElementById('finalizado').checked = false;
        mostrarMensagemNaTela("resultado", "", "error");
    }
    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API}/DTO/${id}`);
            if (!response.ok) {
                mostrarMensagemNaTela("resultado", MSG.erroCarregar("TIPO DE status"), "error");
                return;
            }
            const Tipostatus = await response.json();
          //  if((Tipostatus.finalizado === 0) || (Tipostatus.cancelado === 0))  {
                document.getElementById("idstatus").value = Tipostatus.idstatus;
                document.getElementById('descstatus').value = Tipostatus.descstatus;
                document.getElementById('inicial').checked = Tipostatus.inicial && 1;
                document.getElementById('finalizado').checked = Tipostatus.finalizado && 1;
                document.getElementById('cancelado').checked = Tipostatus.cancelado && 1;
                document.getElementById('ativo').checked = Tipostatus.ativo && 1;
                document.getElementById('cor').value = corHexValida(Tipostatus.cor) ? Tipostatus.cor : "#6c757d";
                document.getElementById('txtOrdem').value = Tipostatus.ordem;
                document.getElementById('comboTipo').value = Tipostatus.idtipo_entidade;
                mostrarMensagemNaTela("resultado", "status selecionado: " +  Tipostatus.descstatus, "success");
           /* } else if (Tipostatus.finalizado === 1)  {
                mostrarMensagemNaTela("resultado", "status: " +  Tipostatus.descstatus + "finalizado!", "success");
            } else if (Tipostatus.cancelado === 1)  {
                mostrarMensagemNaTela("resultado", "status: " +  Tipostatus.descstatus + "cancelado!", "success");
            }*/

        } catch (error) {
            //mostrarMensagemNaTela("resultado", MSG.erroCarregar("status"), "error");
            mostrarMensagemNaTela("resultado", error.value, "error");
        }
    }
    async function listarTipostatus() {
        if (Number(document.getElementById('comboEmpreendimento').value) === 0) {
            mostrarMensagemNaTela("resultado", "Selecione um empreendimento!", "warnning");
            return;
        }
        try {
            const idempreendimento = Number(document.getElementById('comboEmpreendimento').value);
            const response = await fetch(`${API}/listar/${idempreendimento}`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">Ordem</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Inicial</th>
                        <th class="table-header">Finalizado</th>
                        <th class="table-header">Cancelado</th>
                        <th class="table-header">Ativo</th>
                        <th class="table-header">Aplicável à</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(Tipostatus => {
                const cor = corHexValida(Tipostatus.cor) ? Tipostatus.cor : "#6c757d";
                tabela += `<tr onclick="buscarPorLinha(${Tipostatus.idstatus})"
                                style="cursor:pointer;">
                                <td style="border-left:8px solid ${cor};">
                              ${Tipostatus.ordem}</td>
                                <td>${Tipostatus.descstatus}</td>
                                <td>${Tipostatus.inicial ? '<i class="bi bi-check-circle-fill text-success" title="Sim"></i>':'<i class="bi bi-x-circle-fill text-danger" title="Não"></i>'}</td>
                                <td>${Tipostatus.finalizado ? '<i class="bi bi-check-circle-fill text-success" title="Sim"></i>':'<i class="bi bi-x-circle-fill text-danger" title="Não"></i>'}</td>
                                <td>${Tipostatus.cancelado ? '<i class="bi bi-check-circle-fill text-success" title="Sim"></i>':'<i class="bi bi-x-circle-fill text-danger" title="Não"></i>'}</td>
                                <td>${Tipostatus.ativo ? '<i class="bi bi-check-circle-fill text-success" title="Sim"></i>':'<i class="bi bi-x-circle-fill text-danger" title="Não"></i>'}</td>
                                <td>${Tipostatus.desctipo_entidade}</td>
                            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado", MSG.errolistar("status"), "error");
        }
    }
    function habilitaCampos(operacao) {
        if (operacao === "C") {
            // document.getElementById('comboEmpreendimento').disabled = false;
            // document.getElementById('comboTipo').disabled = true;
            // document.getElementById('descstatus').disabled = true;
            // document.getElementById('inicial').disabled = true;
            // document.getElementById('ativo').disabled = true;
            // document.getElementById('cancelado').disabled = true;
            // document.getElementById('finalizado').disabled = true;
            // document.getElementById('cor').disabled = true;
        } else if (operacao === "E") {
            // document.getElementById('comboEmpreendimento').disabled = true;
            // document.getElementById('comboTipo').disabled = false;
            // document.getElementById('descstatus').disabled = false;
            // document.getElementById('inicial').disabled = false;
            // document.getElementById('ativo').disabled = false;
            // document.getElementById('cancelado').disabled = false;
            // document.getElementById('finalizado').disabled = true;
            // document.getElementById('cor').disabled = true;
        }
    }
</script>
</body>
</html>
