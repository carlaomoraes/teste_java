<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papel - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/Papel.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<script src="js/utils/mensagens.js"></script>
<div class="container">
    <h1>Papel- TaskController 1.0</h1>
    <div id="TipoPapel" >
        <input type="number" onblur="buscarPorLinha(document.getElementById('idPapel').value)" name="idPapel" id="idPapel" placeholder="ID do tipo de ausência (Deixe vazio para novo)">
        <input type="text" id="descpapel" placeholder="Descrição do papel" oninput="converterMaiusculo(this)">
        <label>Valor hora:</label>
        <div class="input-group">
            <span class="input-group-text">R$</span>

            <input type="number"
                   class="form-control"
                   id="valorhora"
                   step="0.01"
                   min="0"
                   placeholder="0,00">
        </div>
        <label class="checkbox-group">
            <input type="checkbox" id="ativo" value="1"> Papel Ativo
        </label>
        <div class="mb-3">
            <label class="form-label">Tipo do Papel</label>
            <select class="form-select" id="cmbtipoPapel">
                <option value="0">Administrativo</option>
                <option value="1">Operacional</option>
            </select>

        </div>

        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-salvar"  onclick="salvarTipoPapel()">Salvar</button>
            <button type="button" class="btn btn-listar" onclick="listarTipoPapel()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>
</div>

<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_PAPEL = 'http://localhost:8080/papel';
    const formatarMoeda = (valor) => {
        return new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        }).format(valor);
    };

    async function salvarTipoPapel() {
        const idpapel = Number(document.getElementById("idPapel").value);
        const descpapel = document.getElementById('descpapel').value;
        const valorhora = document.getElementById('valorhora').value;
        const tipopapel = document.getElementById('cmbtipoPapel').value;
        const ativo = document.getElementById('ativo').checked;

        const TipoPapel = {
            idpapel: idpapel || null,
            descpapel: descpapel || null,
            valorhora: Number(valorhora) || 0,
            tipopapel: tipopapel,
            ativo: ativo || false
        };

        console.log(TipoPapel);

        try {

            const response = await fetch(`${API_PAPEL}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(TipoPapel)
            });

            if (!response.ok) {
                const erro = await response.text();
                console.error(erro);
                throw new Error(`Erro HTTP: ${response.status}`);
            }

            const data = await response.json();

            mostrarMensagemNaTela(
                "resultado",
                MSG.salvo("PAPEL"),
                "success"
            );

            setTimeout(() => {
                limparFormulario();
                listarTipoPapel();
            }, 1000);

        } catch (error) {

            console.error("Erro ao salvar papel:", error);

            mostrarMensagemNaTela(
                "resultado",
                MSG.erroSalvar("PAPEL"),
                "error"
            );
        }
    }
    async function limparFormulario() {
        document.getElementById("idPapel").value = "";
        document.getElementById('descpapel').value = "";
        document.getElementById('valorhora').value = 0;
        document.getElementById('ativo').checked = false;
        document.getElementById('cmbtipoPapel').value = 0;
        mostrarMensagemNaTela("resultado", "", "error");
    }
    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API_PAPEL}/DTO/${id}`);
            if (!response.ok) {
                mostrarMensagemNaTela("resultado", MSG.erroCarregar("TIPO DE PAPEL"), "error");
                return;
            }
            const TipoPapel = await response.json();

            document.getElementById("idPapel").value = TipoPapel.idpapel;
            document.getElementById('descpapel').value = TipoPapel.descpapel;
            document.getElementById('valorhora').value = TipoPapel.valorhora;
            document.getElementById('ativo').checked = TipoPapel.ativo || true;
            document.getElementById('cmbtipoPapel').value = TipoPapel.tipopapel;
            mostrarMensagemNaTela("resultado", "Papel selecionado: " +  TipoPapel.descpapel, "success");

        } catch (error) {
            mostrarMensagemNaTela("resultado", MSG.erroCarregar("PAPEL"), "error");
        }
    }
    async function listarTipoPapel() {
        try {
            const response = await fetch(`${API_PAPEL}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Valor Hora</th>
                        <th class="table-header">Ativo</th>
                        <th class="table-header">Tipo de papel</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(TipoPapel => {
                tabela += `<tr onclick="buscarPorLinha(${TipoPapel.idpapel})"
                                style="cursor:pointer;">
                                <td style="border-left:8px">${TipoPapel.idpapel}</td>
                                <td>${TipoPapel.descpapel}</td>
                                <td>${formatarMoeda(TipoPapel.valorhora)}</td>
                               <td>${TipoPapel.ativo ? '<i class="bi bi-check-circle-fill text-success" title="Sim"></i>':'<i class="bi bi-x-circle-fill text-danger" title="Não"></i>'}</td>
                                <td>${TipoPapel.desctipopapel}</td>
                            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado", MSG.errolistar("PAPEL"), "error");
        }
    }
</script>
</body>
</html>
