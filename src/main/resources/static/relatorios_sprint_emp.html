<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/relatorios.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>

<body>
<script src="js/funcoes.js"></script>
<script src="js/mensagens.js"></script>

<div class="card shadow-sm mb-3">
    <div class="card-header bg-secondary text-white">
        <strong>Relatórios Gerenciais - Empreendimento X Sprints</strong>
    </div>

    <div class="card-body">
        <div class="row g-3 align-items-end">

            <!-- EMPREENDIMENTO -->
            <div class="col-md-7">
                <label for="comboEmpreendimento" class="form-label fw-semibold">
                    Empreendimento *
                </label>

                <!-- Removido o onchange inline daqui para evitar conflito -->
                <select id="comboEmpreendimento" class="form-select">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <!-- SPRINTS -->
            <div class="col-md-7">
                <label class="form-label fw-semibold">
                    Sprints *
                </label>

                <div class="dropdown">
                    <button id="btnSelecionarSprints"
                            class="btn btn-outline-secondary dropdown-toggle w-100 text-start"
                            type="button"
                            data-bs-toggle="dropdown"
                            data-bs-auto-close="outside"
                            aria-expanded="false">
                        Selecione as Sprints...
                    </button>

                    <div id="listaSprints"
                         class="dropdown-menu p-3 w-100"
                         style="max-height: 260px; overflow-y: auto;">
                        <span class="text-muted">
                            Selecione um empreendimento.
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div class="btn-group mt-3" data-toggle="buttons-radio">
            <button type="button" class="btn btn-salvar" onclick="filtrarRelatorio()">Filtrar</button>
            <button type="button" class="btn btn-listar" onclick="imprimirSprints()">Imprimir</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
    </div>
</div>

<div id="resultadoRelatorio"></div>

<script>
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';
    const API_SPRINT = 'http://localhost:8080/sprints';

    // ==============================================================
    // CARREGAR COMBOS
    // ==============================================================
    async function carregarEmpreendimento() {
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/montaComboEmpreendimento`);
            const empreendimentos = await resposta.json();
            comboEmpreendimento.innerHTML = '<option value="">Selecione...</option>';
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimento.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultadoRelatorio", MSG.erroCarregar("EMPREENDIMENTO"), "error");
        }
    }

    // ==============================================================
    // INICIALIZAÇÃO
    // ==============================================================
    document.addEventListener('DOMContentLoaded', () => {
        carregarEmpreendimento();

        // Configuração única do evento de mudança do combo
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        comboEmpreendimento.addEventListener('change', (event) => {
            const selectedValue = event.target.value;
            carregarSprintsRelatorio(selectedValue);
        });
    });

    async function carregarSprintsRelatorio(idEmpreendimento) {
        const lista = document.getElementById("listaSprints");

        if (!idEmpreendimento) {
            lista.innerHTML = `<span class="text-muted">Selecione um empreendimento.</span>`;
            atualizarSelecaoSprints();
            return;
        }

        lista.innerHTML = `<span class="text-muted">Carregando sprints...</span>`;

        try {
            const linha = `${API_SPRINT}/listar/DTO/${idEmpreendimento}`;
            const response = await fetch(linha);

            if (!response.ok) {
                throw new Error(`Erro ao carregar Sprints: ${response.status}`);
            }

            const dados = await response.json();

            if (!dados || dados.length === 0) {
                lista.innerHTML = `<span class="text-muted">Nenhuma Sprint encontrada.</span>`;
                atualizarSelecaoSprints();
                return;
            }

            await montarTabelaRelatorio(dados, "listaSprints");

            lista.querySelectorAll(".sprint-check").forEach(checkbox => {
                checkbox.addEventListener("change", atualizarSelecaoSprints);
            });
        } catch (error) {
            console.error("Erro no carregamento:", error);
            lista.innerHTML = `<span class="text-danger">Não foi possível carregar as Sprints.</span>`;
            atualizarSelecaoSprints();
            mostrarMensagemNaTela("resultadoRelatorio", error.message, "error");
        }
    }

    async function montarTabelaRelatorio(dados, containerId = "listaSprints") {
        const container = document.getElementById(containerId);
        if (!container) {
            console.error(`Container com ID "${containerId}" não foi encontrado.`);
            return;
        }

        container.innerHTML = "";
        const fragment = document.createDocumentFragment();

        dados.forEach(sprint => {
            const div = document.createElement("div");
            div.className = "form-check mb-3";

            const input = document.createElement("input");
            input.className = "form-check-input sprint-check";
            input.type = "checkbox";
            input.id = `sprint_${sprint.idsprint}`;
            input.value = sprint.idsprint;

            const label = document.createElement("label");
            label.className = "form-check-label";
            label.setAttribute("for", `sprint_${sprint.idsprint}`);

            const strong = document.createElement("strong");
            strong.textContent = sprint.descsprint;

            const smallDatas = document.createElement("small");
            smallDatas.className = "d-block text-muted";
            smallDatas.textContent = `${formatarData(sprint.dtiniciosprint)} até ${formatarData(sprint.dtfinalsprint)}`;

            const smallStatus = document.createElement("small");
            smallStatus.style.color = sprint.cor || '#6c757d';
            smallStatus.textContent = sprint.descstatus;

            label.appendChild(strong);
            label.appendChild(smallDatas);
            label.appendChild(smallStatus);

            div.appendChild(input);
            div.appendChild(label);

            fragment.appendChild(div);
        });

        container.appendChild(fragment);
    }

    function atualizarSelecaoSprints() {
        const selecionadas = document.querySelectorAll(".sprint-check:checked");
        const botao = document.getElementById("btnSelecionarSprints");
        const quantidade = selecionadas.length;

        botao.textContent = quantidade === 0
            ? "Selecione as Sprints..."
            : `${quantidade} Sprint${quantidade > 1 ? "s" : ""} selecionada${quantidade > 1 ? "s" : ""}`;
    }

    function filtrarRelatorio() {
        // Função do botão Filtrar (captura os IDs selecionados se necessário)
        const idsSelecionados = Array.from(document.querySelectorAll(".sprint-check:checked")).map(cb => cb.value);
        console.log("Sprints selecionadas para filtro:", idsSelecionados);
    }
</script>
</body>
</html>
