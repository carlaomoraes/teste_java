<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Usuários</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="container">
    <h1>CRUD Usuário - Spring Boot</h1>

    <input type="number" id="idusuario" placeholder="ID do usuário">

    <input type="text" id="nome" placeholder="Nome">

    <input type="text" id="login" placeholder="Login">

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="senha" placeholder="Senha">

    <button class="salvar" onclick="salvarUsuario()">Salvar</button>

    <button class="listar" onclick="listarUsuarios()">Listar</button>

    <button class="buscar" onclick="buscarUsuario()">Buscar por ID</button>

    <button class="voltar" onclick="history.back()">Voltar</button>

    <div id="resultado"></div>
</div>

<script>
    const API = 'http://localhost:8080/usuarios';
    async function salvarUsuario() {
        const idusuario = document.getElementById('idusuario').value;
        const nome = document.getElementById('nome').value;
        const login = document.getElementById('login').value;
        const senha = document.getElementById('senha').value;
        const email = document.getElementById('email').value;

        const usuario = {
            idusuario: idusuario || null,
            nome: nome || null,
            login: login || null,
            senha: senha || null,
            email: email || null
        };

        try {

            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuario)
            });

            const data = await response.json();

            document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);
            limpaFormulario();
            listarUsuarios();

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }

    async function buscarPorLinha(id) {

        try {

            const response = await fetch(`${API}/${id}`);

            const usuario = await response.json();

            document.getElementById('idusuario').value = usuario.idusuario;
            document.getElementById('nome').value = usuario.nome;
            document.getElementById('login').value = usuario.login;
            document.getElementById('email').value = usuario.email;
            document.getElementById('senha').value = usuario.senha;

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }

    async function listarUsuarios() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();
            let tabela = `
            <table border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Email</th>
                        <th>Senha</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;

            data.forEach(usuario => {

                tabela += `<tr onclick="buscarPorLinha(${usuario.idusuario})"
                                style="cursor:pointer;">
                                <td>${usuario.idusuario}</td>
                                <td>${usuario.nome}</td>
                                <td>${usuario.login}</td>
                                <td>${usuario.email}</td>
                                <td>${usuario.senha}</td>
                                <td> <button class="excluir" onclick="excluirUsuario(${usuario.idusuario})">Excluir</button></td>

            </tr>`;});
            tabela += `</tbody></table>`;

            document.getElementById('resultado').innerHTML = tabela;

        } catch (error) {

            document.getElementById('resultado').innerHTML =
                `<p style="color:red;">Erro ao listar usuários</p>`;
        }
    }


    async function buscarUsuario() {

        const idusuario = document.getElementById('idusuario').value;

        try {

            const response = await fetch(`${API}/${idusuario}`);

            const data = await response.json();

            document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }

    async function excluirUsuario(idusuario) {
        try {

            const response = await fetch(`${API}/excluir/${idusuario}`, {
                method: 'DELETE'
            });

            const texto = await response.text();

            document.getElementById('resultado').innerText = texto || 'Usuário excluído com sucesso';
             } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }

    async function limpaFormulario() {
        document.getElementById('idusuario').value = "";
        document.getElementById('nome').value = "";
        document.getElementById('login').value = "";
        document.getElementById('email').value = "";
        document.getElementById('senha').value = "";
    }

</script>

</body>
</html>
