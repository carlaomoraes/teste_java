<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Usuário</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2" align="center">

    <h3>Lista de usuário</h3>
    <a th:href="@{/salvar}" class="btn btn-primary btn-sm mb-3" >Novo usuário</a>
    <table style="width:80%" border="1">
           class = "table table-striped table-responsive-md">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Login</th>
            <th>Senha</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario:${allemplist}">
            <td th:text="${usuario.nome}"></td>
            <td th:text="${usuario.login}"></td>
            <td th:text="${usuario.senha}"></td>
            <td th:text="${usuario.email}"></td>
            <td> <a th:href="@{/showFormForUpdate/{idusuario}(idusuario=${usuario.idusuario})}"
                    class="btn btn-primary">Update</a>
                <a th:href="@{/excluir/{id}(id=${usuario.idusuario})}"
                   class="btn btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
