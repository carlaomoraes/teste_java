<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="container">
    <h1>Usuário - TaskController 1.0</h1>

    <input type="number" id="idusuario" placeholder="ID do usuário (Deixe vazio para novo)">

    <input type="text" id="nome" placeholder="Nome">

    <input type="text" id="login" placeholder="Login">

    <input type="text" id="email" placeholder="Email">

    <input type="password" id="senha" placeholder="Senha"><br>

    <input type="checkbox" id ="alterasenha"> Trocar a senha no próximo login

    <div class="btn-group" data-toggle="buttons-radio">
        <button type="button" class="btn"  onclick="salvarUsuario()">Salvar</button>
        <button type="button" class="btn" onclick="listarUsuarios()">Listar</button>
        <button type="button" class="btn" onclick="buscarUsuario()">Buscar por ID</button>
        <button type="button" class="btn" onclick="history.back()">Voltar</button>
    </div>
    <div id="resultado"></div>
</div>

<script>
    const API = 'http://localhost:8080/usuarios';

    async function salvarUsuario(event) {
        event.preventDefault();

        const idusuario = document.getElementById('idusuario').value;
        const nome = document.getElementById('nome').value;
        const login = document.getElementById('login').value;
        const senha = document.getElementById('senha').value;
        const email = document.getElementById('email').value;
        alert(document.getElementById('alterasenha').value);
        if(document.getElementById('alterasenha').value === 1)
            alterasenha = 1;
        else alterasenha = 0;

        const usuario = {
            idusuario: idusuario || null,
            nome: nome || null,
            login: login || null,
            senha: senha || null,
            email: email || null,
            alterasenha: alterasenha,
        };
        try {
            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuario)
            });

            const data = await response.json();

            document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);
            limpaFormulario();

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }

    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API}/${id}`);
            const usuario = await response.json();
            document.getElementById('idusuario').value = usuario.idusuario;
            document.getElementById('nome').value = usuario.nome;
            document.getElementById('login').value = usuario.login;
            document.getElementById('email').value = usuario.email;
            document.getElementById('senha').value = usuario.senha;
            document.getElementById('trocarSenha').checked = usuario.alterarSenha === 0;

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }

    async function listarUsuarios() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header">Login</th>
                        <th class="table-header">Email</th>
                        <th class="table-header" style="width: 80px">Senha</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;

            data.forEach(usuario => {

                tabela += `<tr onclick="buscarPorLinha(${usuario.idusuario})"
                                style="cursor:pointer;">
                                <td>${usuario.idusuario}</td>
                                <td>${usuario.nome}</td>
                                <td>${usuario.login}</td>
                                <td>${usuario.email}</td>
                                <td style="width: 30px">${usuario.senha ? '•'.repeat(30) : ''}</td>
                                <td> <button type="button" class="btn" onclick="excluirUsuario(${usuario.idusuario})">Excluir</button></td>

            </tr>`;});
            tabela += `</tbody></table>`;

            document.getElementById('resultado').innerHTML = tabela;

        } catch (error) {
            document.getElementById('resultado').innerHTML =
                `<p style="color:red;">Erro ao listar usuários</p>`;
        }
    }


    async function excluirUsuario(idusuario) {
        try {
            const response = await fetch(`${API}/excluir/${idusuario}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            document.getElementById('resultado').innerHTML = texto || 'Usuário excluído com sucesso';
             } catch (error) {
            document.getElementById('resultado').innerHTML = error;
        }
    }

    async function buscarUsuario() {
        const idUsuario = document.getElementById('idusuario').value;
        const response = await fetch(`${API}/${idUsuario}`);
        const data = await response.json();
        if(!response.ok) {
            const messageError = await response.text();
            mostrarMensagemNaTela(messageError);
        }
        else  {
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Email</th>
                        <th>Senha</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>`;
            data.forEach(usuario => {
                tabela += `<tr onclick="buscarPorLinha(${usuario.idusuario})"
                                style="cursor:pointer;">
                                <td>${usuario.idusuario}</td>
                                <td>${usuario.nome}</td>
                                <td>${usuario.login}</td>
                                <td>${usuario.email}</td>
                                <td style="width: 30px">${usuario.senha ? '•'.repeat(30) : ''}</td>
                                <td> <button type="button" class="btn" onclick="event.stopPropagation(); excluirUsuario(${usuario.idusuario})">Excluir</button></td>

            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        }
    }
    async function limpaFormulario() {
        document.getElementById('idusuario').value = "";
        document.getElementById('nome').value = "";
        document.getElementById('login').value = "";
        document.getElementById('email').value = "";
        document.getElementById('senha').value = "";
    }
    // Função de exemplo para injetar a mensagem no HTML
    function mostrarMensagemNaTela(mensagem) {
        const container = document.getElementById("resultado");
        if (container) {
            container.textContent = mensagem;
            container.style.color = "red"; // Deixa o texto vermelho
        } else {
            alert(mensagem); // Feedback visual simples caso não tenha o container
        }
    }
</script>
</body>
</html>
