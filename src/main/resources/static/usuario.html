<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/usuario.css">
</head>
<body>
<div class="container">
    <h1>Usuários - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'usuarios')">Usuários</button>
        <button class="aba-botao" onclick="alternarAba(event, 'ausencias')">Ausências programadas</button>
    </div>
    <div id="usuarios" class="conteudo-aba ativo">
        <input type="number" name="idusuario" id="idusuario" placeholder="ID do usuário (Deixe vazio para novo)">
        <input type="text" id="nome" placeholder="Nome do usuário" oninput="converterMaiusculo(this)">
        <input type="text" id="login" placeholder="Login" oninput="converterMaiusculo(this)">
        <input type="text" id="email" placeholder="E-mail" oninput="converterMaiusculo(this)">
        <input type="password" id="senha" placeholder="Senha"><br>
        <select id="comboPapel" name="comboPapel">
            <option value="">-- Selecione o papel do usuário --</option>
        </select>
        <label class="checkbox-group">
            <input type="checkbox" id="alterasenha" value="0">Altera senha no próximo login ?
            <input type="checkbox" id="ativo" value="1"> Usuário Ativo
        </label>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn"  onclick="salvarUsuario()">Salvar</button>
            <button type="button" class="btn" onclick="listarUsuarios()">Listar</button>
            <button type="button" class="btn" onclick="buscarUsuario(document.getElementById('idusuario').value)">Buscar por ID</button>
            <button type="button" class="btn" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>

    <div id="ausencias" class="conteudo-aba">
        <h3>Ausências programadas</h3>
        <label for="datainicial">Data início:</label> <input type="date" id="datainicial" name="datainicial">
        <label for="datafinal">Data Final:</label> <input type="date" id="datafinal" name="datafinal">
        <label for="combotipo">Tipo de ausência:</label>
        <select id="combotipo">
            <option value="">-- Selecione um tipo de ausência --</option>
        </select>
        <label for="observacao">Observação:</label> <input type="text" id="observacao">
        <label class="checkbox-group">
            <input type="checkbox" id="status" value="0">Ativa ?
        </label>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn"  onclick="salvarAusencias(sessionStorage.getItem('idusuario'));">Salvar</button>
            <button type="button" class="btn" onclick="cancelarAusencia(sessionStorage.getItem('idusuario'));">Cancelar</button>
        </div>
        <div id="resultadoAusencias"></div>
    </div>
</div>

<script>
    //--------------------- MANIPULAÇÃO DOS DADOS USUARIOS
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_AUSENCIAS = 'http://localhost:8080/ausencias';
    const API_PAPEL = 'http://localhost:8080/papel';
    const API_TIPO_AUSENCIAS = 'http://localhost:8080/tipo_ausencia';

    function converterMaiusculo(campo) {
        campo.value = campo.value.toUpperCase();
    }

    function formatarData(data) {
        if (!data) return "";

        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
    }


    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }
    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    // FUNÇÕES DA ABA AUSENCIAS
    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarTipoAusencia() {
        const combotipo = document.getElementById("combotipo");
        try {
            const resposta = await fetch(`${API_TIPO_AUSENCIAS}/listar`);
            const ausencias = await resposta.json();
            ausencias.forEach(ausencia => {
                const opcao = document.createElement('option');
                opcao.value = ausencia.id_tipo_ausencia;
                opcao.textContent = ausencia.desc_tipo_ausencia;
                combotipo.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }
    async function carregarPapel() {
        const comboPapel = document.getElementById("comboPapel");
        try {
            const resposta = await fetch(`${API_PAPEL}/listar`);
            const papel = await resposta.json();
            papel.forEach(u => {
                // Cria opção para o combo papel
                const opt1 = document.createElement('option');
                opt1.value = u.idpapel;
                opt1.textContent = u.descpapel;
                comboPapel.appendChild(opt1);
            });
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarTipoAusencia();
        carregarPapel();
    });
    async function salvarUsuario() {
        const idusuario = document.getElementById("idusuario").value;
        const nome = document.getElementById('nome').value;
        const login = document.getElementById('login').value;
        const senha = document.getElementById('senha').value;
        const email = document.getElementById('email').value;
        const alterasenha = document.getElementById('alterasenha').checked;
        const ativo = document.getElementById('ativo').checked
        const usuario = {
            idusuario: idusuario || null,
            nome: nome || null,
            login: login || null,
            senha: senha || null,
            email: email || null,
            alterasenha: alterasenha,
            ativo: ativo,
            papel: {
                idpapel: document.getElementById('comboPapel').value || null,
            }
        };
        try {
            const response = await fetch(`${API_USUARIOS}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuario)
            });
            const data = await response.json();
            mostrarMensagemNaTela("Gravado com sucesso!");
            setTimeout(() => {
                limparCampos();
                listarUsuarios();
            }, 1000);
        } catch (error) {
            mostrarMensagemNaTela(error.message, 1);
        }
    }
    async function buscarUsuarioPorLinha(id) {
        try {
            const response = await fetch(`${API_USUARIOS}/${id}`);
            const usuario = await response.json();
            document.getElementById('idusuario').value = usuario.idusuario;
            document.getElementById('nome').value = usuario.nome;
            document.getElementById('login').value = usuario.login;
            document.getElementById('email').value = usuario.email;
            document.getElementById('senha').value = usuario.senha;
            document.getElementById('alterasenha').checked = usuario.alterasenha;
            document.getElementById('ativo').checked = usuario.ativo;
            document.getElementById('comboPapel').value = usuario.papel.idpapel;
            sessionStorage.setItem('idusuario',usuario.idusuario);
            listarAusencias(sessionStorage.getItem('idusuario'));
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }
    async function listarUsuarios() {
        try {
            const response = await fetch(`${API_USUARIOS}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header">Login</th>
                        <th class="table-header" width: "30px">Email</th>
                        <th class="table-header" width: "30px">Senha</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(usuario => {
                tabela += `<tr onclick="buscarUsuarioPorLinha(${usuario.idusuario})"
                                style="cursor:pointer;">
                                <td>${usuario.idusuario}</td>
                                <td>${usuario.nome}</td>
                                <td>${usuario.login}</td>
                                <td>${usuario.email}</td>
                                <td style="width: 30px">${usuario.senha ? '•'.repeat(10) : ''}</td>
                                <td> <button type="button" class="btn" onclick="event.stopPropagation();excluirUsuario(${usuario.idusuario})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao listar usuários",1);
        }
    }
    async function excluirUsuario(idusuario) {
        try {
            const response = await fetch(`${API_USUARIOS}/excluir/${idusuario}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            mostrarMensagemNaTela(texto || 'Usuário excluído com sucesso',1);
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }

    async function buscarUsuario(idUsuario) {
        const response = await fetch(`${API_USUARIOS}/${idUsuario}`);
        const data = await response.json();
        if(!response.ok) {
            const messageError = await response.text();
            mostrarMensagemNaTela(messageError,1);
        }
        else  {
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header">Login</th>
                        <th class="table-header">Email</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>`;
            data.forEach(usuario => {
                tabela += `<tr onclick="buscarUsuarioPorLinha(${usuario.idusuario})"
                                style="cursor:pointer;">
                                <td>${usuario.idusuario}</td>
                                <td>${usuario.nome}</td>
                                <td>${usuario.login}</td>
                                <td>${usuario.email}</td>
                                <td> <button type="button" class="btn" onclick="event.stopPropagation(); excluirUsuario(${usuario.idusuario})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        }
    }
    // Função para injetar a mensagem no HTML
    function mostrarMensagemNaTela(mensagem, aba) {
        if(aba == 1){
            container = document.getElementById("resultado");
        } else {
            container = document.getElementById("resultadoAusencias");
        }
        if (container) {
            container.textContent = mensagem;
            container.style.color = "red"; // Deixa o texto vermelho
        } else {
            alert(mensagem); // Feedback visual simples caso não tenha o container
        }
    }
    async function salvarAusencias(idUsuario) {
        const dataAtual = new Date();
        if(validaEntrada(2)) {
            const idtipoausencia = parseInt(document.getElementById("combotipo").value);
            const datainicial = document.getElementById('datainicial').value;
            const datafinal = document.getElementById('datafinal').value;
            const observacao = document.getElementById('observacao').value;
            const status = document.getElementById('status').checked;
            const ausencias = {
                data_inicio: datainicial || dataAtual.toISOString().split("T")[0],
                data_fim: datafinal || dataAtual.toISOString().split("T")[0],
                observacao: observacao || "N/A",
                status: status || "",
                idusuario: {
                    idusuario: idUsuario,
                },
                tipoausencia: {
                    id_tipo_ausencia: idtipoausencia,
                },
            };
            try {
                const response = await fetch(`${API_AUSENCIAS}/salvar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(ausencias)
                });
                const data = await response.json();
                mostrarMensagemNaTela("Gravado com sucesso!");
                setTimeout(() => {
                    listarAusencias(idUsuario);
                }, 1000);
            } catch (error) {
                mostrarMensagemNaTela(error.message, 2);
            }
        }
    }
    async function listarAusencias(idUsuario) {
         const container = document.getElementById("resultadoAusencias");
         try {
             const response = await fetch(`${API_AUSENCIAS}/usuario/${idUsuario}`);
              if (!response.ok) {
                  const msg = await response.text();
                  mostrarMensagemNaTela(msg || "Erro ao listar ausências!", 2);
                  return;
              }
              const data = await response.json();
                // Se não houver registros
                if (!data || data.length === 0) {
                    container.innerHTML = `<table class="table">
                    <thead>
                        <tr>
                            <th>Data inicial</th>
                            <th>Data final</th>
                            <th>Tipo ausência</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align:center;">
                                Nenhuma ausência cadastrada
                            </td>
                        </tr>
                    </tbody>
                </table>
            `;
                    return;
                }

                // Monta tabela com dados
                let tabela = `
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data inicial</th>
                        <th>Data final</th>
                        <th>Tipo ausência</th>
                        <th>Observação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
        `;

                data.forEach(a => {
                    tabela += `
                <tr onclick="buscarAusenciaPorLinha(${a.idausencia})" style="cursor:pointer;">
                    <td>${a.idausencia}</td>
                    <td>${formatarData(a.data_inicio)}</td>
                    <td>${formatarData(a.data_fim)}</td>
                    <td>${a.tipoausencia?.desc_tipo_ausencia ?? ''}</td>
                    <td>${a.observacao ?? ''}</td>
                    <td>
                        <button type="button"
                            class="btn"
                            onclick="event.stopPropagation(); excluirAusencia(${a.idausencia})">
                            Excluir
                        </button>
                    </td>
                </tr>
            `;
                });

                tabela += `
                </tbody>
            </table>
        `;
        container.innerHTML = tabela;
      } catch (error) {
                mostrarMensagemNaTela(error.message || "Erro inesperado ao listar ausências",2);
      }
    }
    async function excluirAusencia(idausencia) {
        try {
            const response = await fetch(`${API_AUSENCIAS}/excluir/${idausencia}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            mostrarMensagemNaTela(texto || 'Ausência programada excluída com sucesso',2);
        } catch (error) {
            mostrarMensagemNaTela(error, 2);
        }
    }
    async function cancelarAusencia(idUsuario) {
        listarAusencias(idUsuario);
        document.getElementById('combotipo').value = "";
        document.getElementById('datainicial').value = "";
        document.getElementById('datafinal').value = "";
        document.getElementById('observacao').value = "";
        document.getElementById('status').checked = true;
    }
    async function validaEntrada(aba) {
        if (aba == 1) {
            const invalido =
                document.getElementById('nome').value === "" ||
                document.getElementById('login').value === "" ||
                document.getElementById('email').value === "" ||
                document.getElementById('senha').value === "" ||
                document.getElementById('comboPapel').value === "";
            if (invalido) {
                mostrarMensagemNaTela("Todos os campos devem estar preenchidos", 1);
                return false;
            }
        } else {
            const invalido =
                document.getElementById('combotipo').value === "" ||
                document.getElementById('datainicial').value === "" ||
                document.getElementById('datafinal').value === "" ||
                document.getElementById('observacao').value.trim() === "" ||
                !document.getElementById('status').checked;
            if (invalido) {
                mostrarMensagemNaTela("Todos os campos devem estar preenchidos", 1);
                return false;
            }
            // validação adicional das datas
            const datainicial = document.getElementById('datainicial').value;
            const datafinal = document.getElementById('datafinal').value;
            if (new Date(datafinal) < new Date(datainicial)) {
                mostrarMensagemNaTela("Data final não pode ser menor que a data inicial", 1);
                return false;
            }
        }
        return true;
    }
</script>
</body>
</html>
