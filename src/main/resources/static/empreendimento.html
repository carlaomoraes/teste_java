<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empreendimento - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/empreendimento.css">
</head>
<body>
<div class="container">
    <h1>Empreendimento - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'empreendimento')">Empreendimento</button>
        <button class="aba-botao" onclick="alternarAba(event, 'equipes')">Equipes</button>
    </div>
    <div id="empreendimento" class="conteudo-aba ativo">
        <input type="number" name="idempreendimento" id="idempreendimento" placeholder="ID do empreendimento (Deixe vazio para novo)">
        <div class="form-grid">
            <div>
                <label>Nome</label>
                <input type="text" id="descempreendimento" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Sigla</label>
                <input type="text" id="siglaempreendimento" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Data início</label>
                <input type="date" id="data_inicio">
            </div>
            <div>
                <label>Data fim</label>
                <input type="date" id="data_fim">
            </div>
            <div>
                <label>Status</label>
                <select id="comboStatus"></select>
            </div>
            <div>
                <label>Gestor</label>
                <select id="comboGestor"></select>
            </div>
            <div>
                <label for="cor">Cor de identificação do empreendimeto:</label>
                <input type="color" id="cor" value="#2196F3">
            </div>

        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn"  onclick="salvarEmpreendimento();">Salvar</button>
            <button type="button" class="btn" onclick="listarEmpreendimentos()">Listar</button>
            <button type="button" class="btn" onclick="buscarEmpreendimentoPorLinha(document.getElementById('idempreendimento').value)">Buscar por ID</button>
            <button type="button" class="btn" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>
    <div id="equipes" class="conteudo-aba">
        <div class="membros-container">
            <div class="membros-coluna">
                <h2>Equipes disponíveis</h2>
                <div id="equipesDisponiveis"  class="membros-lista-custom"></div>
            </div>

            <div class="membros-acoes">
                <button type="button" class="btn btn-add" onclick="adicionarMembro()">
                    Adicionar <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button type="button" class="btn btn-remove" onclick="removerMembro()">
                    <i class="fa-solid fa-arrow-left"></i> Remover
                </button>
            </div>

            <div class="membros-coluna">
                <h2>Equipes vinculadas</h2>
                <div id="equipesVinculadas" class="membros-lista-custom"></div>
            </div>
        </div>
    </div>

</div>
</body>

<script>
    // Variáveis globais para rastreamento dos itens selecionados nos seletores customizados
    let equipeDisponivelSelecionado = null;
    let equipeSelecionado = null;

    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';
    const API_STATUS = 'http://localhost:8080/status_entidades';
    const API_USUARIOS = 'http://localhost:8080/usuarios';

    function formatarData(data) {
        if (!data) return "";

        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
    }
    function converterMaiusculo(campo) {
        campo.value = campo.value.toUpperCase();
    }
    function alternarAba(event, idAbaDestino) {
        document.querySelectorAll('.conteudo-aba') .forEach(c => c.classList.remove('ativo')); document.querySelectorAll('.aba-botao') .forEach(b => b.classList.remove('ativa')); document.getElementById(idAbaDestino).classList.add('ativo'); event.currentTarget.classList.add('ativa');
        // Carrega as equipes quando abrir a aba EQUIPES
        if (idAbaDestino === 'equipes') {
            const idEmpreendimento = document.getElementById("idempreendimento").value;
            if (idEmpreendimento) {
                montaEquipes(idEmpreendimento);
            } else {
                document.getElementById("equipesDisponiveis").innerHTML = '<div style="padding:20px;color:#ef4444;text-align:center;">' + 'Selecione ou salve um empreendimento primeiro.' + '</div>';
                document.getElementById("equipesVinculadas").innerHTML = "";
            }
        }
    }
    // Renderiza a lista customizada mapeando os eventos de clique
    function renderizarListaCustom(containerId, listaEquipes, tipo) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (listaEquipes.length === 0) {
            container.innerHTML = `<div style="padding: 20px; color: #94a3b8; text-align:center; font-size:14px;">Nenhum usuário encontrado</div>`;
            return;
        }

        listaEquipes.forEach(equipe => {
            const item = document.createElement('div');
            item.className = 'membro-item';
            item.dataset.id = equipe.idequipe;

            item.innerHTML = `
                <div class="membro-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="membro-name">${equipe.descequipe.split(' ')[0].toLowerCase()}</div>
                <div class="membro-name">${equipe.nomeequipe}</div>
            `;

            item.addEventListener('click', () => {
                // Remove seleção anterior do escopo específico
                container.querySelectorAll('.membro-item').forEach(el => el.classList.remove('selecionado'));
                item.classList.add('selecionado');

                if (tipo === 'disponivel') {
                    equipeDisponivelSelecionado = equipe.idequipe;
                } else {
                    equipeSelecionado = equipe.idequipe;
                }
            });

            container.appendChild(item);
        });
    }

    // ------- MONTAGEM DAS LISTAS
    async function montaEquipes(idEmpreendimento) {
        try {
            const disponiveis = await fetch(`${API_EMPREENDIMENTO}/${idEmpreendimento}/equipes/disponiveis`).then(r => r.json());
            const membros = await fetch(`${API_EMPREENDIMENTO}/${idEmpreendimento}/equipes`).then(r => r.json());

            renderizarListaCustom("equipesDisponiveis", disponiveis, 'disponivel');
            renderizarListaCustom("equipesVinculadas", membros, 'equipe');

            equipeDisponivelSelecionado = null;
            equipeSelecionado = null;
        } catch(e) {
            await mostrarMensagemNaTela("Erro ao montar colunas de membros: " + e.message);
        }
    }

    async function adicionarMembro(){
        const idEmpreendimento = document.getElementById("idempreendimento").value;
        const equipes =  document.getElementById("equipesDisponiveis").value;
        if(!idEmpreendimento || !equipeDisponivelSelecionado) {
            mostrarMensagemNaTela("Selecione um empreendimento disponível e garanta que a equipe possua um ID válido.");
            return;
        }
        await fetch(`http://localhost:8080/empreendimento/${idEmpreendimento}/equipes/${equipes.value}`,
            {
                method:"POST"
            }
        );
        await montaEquipes(idEmpreendimento);
    }
    async function removerMembro(){
        const idEmpreendimento = document.getElementById("idempreendimento").value;
        if(!idEmpreendimento || !equipeSelecionado)
            return;
        await fetch(`http://localhost:8080/empreendimento/${idEmpreendimento}/equipes/${equipeSelecionado.value}`,
            {
                method:"DELETE"
            }
        );

        montaEquipes(idEmpreendimento);
    }
    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarGestor() {
        const comboGestor = document.getElementById("comboGestor");
        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idusuario;
                opcao.textContent = usuario.nome;
                comboGestor.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }
    async function carregarStatus() {
        const comboStatus = document.getElementById("comboStatus");
        try {
            const resposta = await fetch(`${API_STATUS}/listar`);
            const status = await resposta.json();
            status.forEach(s => {
                const opcao = document.createElement('option');
                opcao.value = s.idstatus;
                opcao.textContent = s.descstatus;
                comboStatus.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela(error.message,1);
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarGestor();
        carregarStatus();
    });
    async function salvarEmpreendimento() {
        if(await validaEntrada()) {
            const empreendimento = {
                idempreendimento: document.getElementById('idempreendimento').value,
                descempreendimento: document.getElementById("descempreendimento").value,
                siglaempreendimento: document.getElementById("siglaempreendimento").value,
                data_inicio: document.getElementById("data_inicio").value,
                data_fim: document.getElementById("data_fim").value,
                cor: document.getElementById("cor").value,
                status: {
                    idstatus: parseInt(document.getElementById("comboStatus").value)
                },
                idgestor: {
                    idusuario: parseInt(document.getElementById("comboGestor").value)
                }
            };
            try {
                const response = await fetch(`${API_EMPREENDIMENTO}/salvar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(empreendimento)
                });
                const data = await response.json();
                mostrarMensagemNaTela("Gravado com sucesso!");
                setTimeout(() => {
                    limparCampos();
                    listarEmpreendimentos();
                }, 1000);
            } catch (error) {
                mostrarMensagemNaTela(error.message, 1);
            }
        }
    }
    async function buscarEmpreendimentoPorLinha(id) {
        const response = await fetch(`${API_EMPREENDIMENTO}/${id}`);
        const data = await response.json();
        if(!response.ok) {
            mostrarMensagemNaTela(data.mensagem);
            return;
        }
        document.getElementById('idempreendimento').value = data.idempreendimento;
        document.getElementById('descempreendimento').value = data.descempreendimento;
        document.getElementById('data_inicio').value = data.data_inicio;
        document.getElementById('data_fim').value = data.data_fim;
        document.getElementById('siglaempreendimento').value = data.siglaempreendimento;
      //  document.getElementById('combostatus').value = data.status.idstatus || "";
      //  document.getElementById('comboGestor').value = data.idgestor.idusuario || "";

        // Limpa mensagens e monta equipe se o usuário mudar de aba depois
        mostrarMensagemNaTela("Equipe selecionada: " + data.descempreendimento, "green");
        montaEquipes(data.idempreendimento);
    }
    async function listarEmpreendimentos() {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Sigla</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(empreendimento => {
                tabela += `
        <tr onclick="buscarEmpreendimentoPorLinha(${empreendimento.idempreendimento})"
            style="cursor:pointer;">
            <td style="border-left:8px solid ${empreendimento.cor};">
                ${empreendimento.idempreendimento}
            </td>
            <td>${empreendimento.descempreendimento}</td>
            <td>${empreendimento.siglaempreendimento}</td>
            <td>${empreendimento.status.descstatus}</td>
            <td>${formatarData(empreendimento.data_inicio)}</td>
            <td>${formatarData(empreendimento.data_fim)}</td>
            <td>
                <button type="button" class="btn"
                    onclick="event.stopPropagation(); excluirEmpreendimento(${empreendimento.idempreendimento})">
                    Excluir
                </button>
            </td>
        </tr>`;
            });
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao listar Empreendimento",1);
        }
    }
    async function excluirEmpreendimento(idEmpreendimento) {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/excluir/${idEmpreendimento}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            mostrarMensagemNaTela(texto || 'Empreendimento excluído com sucesso',1);
        } catch (error) {
            mostrarMensagemNaTela(error.message,1);
        }
    }
    async function limparCampos() {
        document.getElementById('idempreendimento').value = "";
        document.getElementById('descempreendimento').value = "";
        document.getElementById('data_inicio').value = "";
        document.getElementById('data_fim').value = "";
        document.getElementById('siglaempreendimento').value = "";

    }
    async function validaEntrada() {
        // 1. Captura os valores dos elementos
        const desc = document.getElementById('descempreendimento').value.trim();
        const dataInicio = document.getElementById('data_inicio').value;
        const dataFim = document.getElementById('data_fim').value;
        const sigla = document.getElementById('siglaempreendimento').value.trim();

        // Validação: Descrição do Empreendimento
        if (desc === "") {
            mostrarMensagemNaTela("A descrição do empreendimento é obrigatória!");
            return false;
        }
        // Validação: Sigla (Exemplo: obrigatória e com limite de caracteres)
        if (sigla === "") {
            mostrarMensagemNaTela("A sigla do empreendimento é obrigatória!");
            return false;
        } else if (sigla.length > 3) {
            mostrarMensagemNaTela("A sigla deve ter no máximo 3 caracteres.");
            return false;
        }
        // Validação: Datas Obrigatórias
        if (!dataInicio) {
            mostrarMensagemNaTela("A data de início é obrigatória.");
            return false;
        }
        if (!dataFim) {
            mostrarMensagemNaTela("A data de fim é obrigatória.");
            return false;
        }
        // Validação Lógica: Data Fim não pode ser menor que Data Início
        if (dataInicio && dataFim) {
            const dataInicDate = new Date(dataInicio);
            const dataFimDate = new Date(dataFim);
            if (dataFimDate < dataInicDate) {
                mostrarMensagemNaTela("A data de fim não pode ser anterior à data de início.");
                return false;
            }
        }
        return true;
    }
    async function mostrarMensagemNaTela(mensagem) {
        const container = document.getElementById("resultado");
        if (container) {
            container.innerHTML = `<p style="color:red;">${mensagem}</p>`;
        } else {
            alert(mensagem);
        }
    }
</script>
</body>
</html>
