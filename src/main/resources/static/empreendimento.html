<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empreendimentos - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/empreendimento.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<div class="container">
    <h1>Empreendimento - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'geral')">Geral</button>
        <button class="aba-botao" onclick="alternarAba(event, 'equipe')">Equipes</button>
        <button class="aba-botao" onclick="alternarAba(event, 'configuracao')">Configuração</button>
    </div>
    <div id="geral" class="conteudo-aba ativo">
        <div class="form-grid">
            <div>
                <label>I.D.</label>
                <input type="number" onblur="buscarPorLinha(document.getElementById('idempreendimento').value)" name="idempreendimento" id="idempreendimento" placeholder="ID do Empreendimento (Deixe vazio para novo)">
            </div>
            <div>
                <label>Sigla</label>
                <input type="text" id="siglaempreendimento" oninput="converterMaiusculo(this)" maxlength="3">
            </div>
            <div>
                <label>Nome</label>
                <input type="text" id="descempreendimento" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Código</label>
                <input type="text" id="codempreendimento" oninput="converterMaiusculo(this)" maxlength="10">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">
                    Status
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-buildings"></i>
                    </span>
                    <select class="form-select" id="comboStatus">
                        <option value="">-- Selecione status ---</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">
                    Prioridades
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-buildings"></i>
                    </span>
                    <select class="form-select" id="comboPrioridade">
                        <option value="">-- Selecione prioriedade ---</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">
                    Gestor
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-buildings"></i>
                    </span>
                    <select class="form-select" id="comboGestor">
                        <option value="">-- Selecione gestor ---</option>
                    </select>
                </div>
            </div>
            <div>
                <label>Data inicial</label>
                <input type="date" id="data_inicio">
            </div>
            <div>
                <label>Data final prevista</label>
                <input type="date" id="data_fim">
            </div>
            <div>
                <label for="cor">Cor de identificação do Empreendimento</label>
                <input type="color" id="cor" value="#2196F3">
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="bloqueado" value="0"> Empreendimento bloqueado
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-add"  onclick="criarEmpreendimento()">Novo</button>
            <button type="button" class="btn btn-salvar" onclick="salvarEmpreendimento()">Salvar</button>
            <button type="button" class="btn btn-listar"  onclick="listarEmpreendimentos()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>
    <div id="equipe" class="conteudo-aba">
        <div class="membros-container">
            <div class="membros-coluna">
                <h2>Equipes disponíveis</h2>
                <div id="usuariosDisponiveis" class="membros-lista-custom"></div>
            </div>

            <div class="membros-acoes">
                <button type="button" class="btn btn-add" onclick="adicionarMembro()">
                    Adicionar <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button type="button" class="btn btn-remove" onclick="removerMembro()">
                    <i class="fa-solid fa-arrow-left"></i> Remover
                </button>
            </div>

            <div class="membros-coluna">
                <h2>Equipes associadas</h2>
                <div id="usuariosEquipe" class="membros-lista-custom"></div>
            </div>
        </div>
        <div id="resultadoequipe"></div>
    </div>
    <div id="configuracao" class="conteudo-aba">

        <h5 class="mb-3">Planejamento da Sprint</h5>

        <div class="row g-3">

            <div class="col-md-3">
                <label class="form-label">Duração mínima (dias)</label>
                <input type="number" class="form-control"
                       id="duracao_min_sprint" min="1">
            </div>

            <div class="col-md-3">
                <label class="form-label">Duração máxima (dias)</label>
                <input type="number" class="form-control"
                       id="duracao_max_sprint" min="1">
            </div>

            <div class="col-md-3">
                <label class="form-label">Horas de trabalho/dia</label>
                <input type="number" class="form-control"
                       id="horas_Trabalho_Dia" min="1" max="24">
            </div>

        </div>

        <hr>
        <div class="form-check mb-2">
            <input class="form-check-input"
                   type="checkbox"
                   id="permitir_sprint_sobreposta">

            <label class="form-check-label" for="permitir_sprint_sobreposta">
                Permitir Sprint sobreposta
            </label>
        </div>

        <div class="form-check mb-2">
            <input class="form-check-input"
                   type="checkbox"
                   id="permitir_multiplas_sprint_ativas">

            <label class="form-check-label" for="permitir_multiplas_sprint_ativas">
                Permitir múltiplas Sprints ativas
            </label>
        </div>

        <div class="form-check mb-2">
            <input class="form-check-input"
                   type="checkbox"
                   id="considerar_feriados">

            <label class="form-check-label" for="considerar_feriados">
                Considerar ausências no planejamento
            </label>
        </div>
        <hr>

        <div class="form-check mb-2">
            <input class="form-check-input"
                   type="checkbox"
                   id="considerar_valorhoras">

            <label class="form-check-label" for="considerar_valorhoras">
                Mostrar total valores horas
            </label>
        </div>
        <hr>

        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-salvar" onclick="onclick=salvarEmpreendimento()">Salvar configuração</button>
        </div>
        <div id="resultadoconfiguracao"></div>

    </div>
</div>
<script>
    //-----------------CARREGAR CONFIGURAÇÃO
    let configuracaoSprint = {
        idconfiguracao: 0,
        idempreendimento: 1,
        duracao_min_sprint: 0,
        duracao_max_sprint: 0,
        horas_trabalho_dia: 0,
        considerarFeriados: false,
        permitir_sprint_sobreposta: false,
        permitir_multiplas_sprint_ativas: false,
        considerar_feriados: false,
        considerar_valorhoras: false,
        mostrar_valorhoras: false,
    };

    let equipeDisponivelSelecionada = null;
    let equipeSelecionada = null;

    let statusAtual = 1;

    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';
    const API_STATUS = 'http://localhost:8080/status_entidades';
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_PRIORIDADE = 'http://localhost:8080/prioridade';

    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }


    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarGestor() {
        const comboGestor = document.getElementById("comboGestor");
        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idusuario;
                opcao.textContent = usuario.nome;
                comboGestor.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado", "Erro ao carregar gestor: "+error.message,"error");
        }
    }
    async function carregarPrioridade() {
        const comboPrrioriedade = document.getElementById("comboPrioridade");
        try {
            const resposta = await fetch(`${API_PRIORIDADE}/listar`);
            const prioridades = await resposta.json();
            prioridades.forEach(prioridade => {
                const opcao = document.createElement('option');
                opcao.value = prioridade.idprioridade;
                opcao.textContent = prioridade.descprioridade;
                comboPrrioriedade.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado", "Erro ao carregar prioridade: "+error.message,"error");
        }
    }
    async function carregarStatus(idStatusAtual) {
        const comboStatus = document.getElementById("comboStatus");

        try {
            comboStatus.innerHTML = "";

            const resposta = await fetch(
                `${API_STATUS}/${encodeURIComponent(idStatusAtual)}/proximo`
            );

            if (!resposta.ok) {
                throw new Error(`Erro ${resposta.status}`);
            }

            const vetor = await resposta.json();

            const opcaoPadrao = document.createElement("option");
            opcaoPadrao.value = "";
            opcaoPadrao.textContent = "Selecione...";
            comboStatus.appendChild(opcaoPadrao);

            vetor.forEach(status => {
                const opcao = document.createElement("option");
                opcao.value = status.idstatus;
                opcao.textContent = status.descstatus;
                comboStatus.appendChild(opcao);
            });

        } catch (error) {
            mostrarMensagemNaTela(
                "resultado",
                "Erro ao carregar status: " + error.message,
                "error"
            );
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarGestor();
        carregarStatus(statusAtual);
        carregarPrioridade();
    });
    document.addEventListener('visibilitychange', () => {
        const containerTabela = document.getElementById('"resultado"');
        if (!containerTabela) return;

        if (document.hidden) {
            containerTabela.classList.add('tabela-travada');
        } else {
            containerTabela.classList.remove('tabela-travada');
        }
    });
    async function criarEmpreendimento() {
        limpaFormulario();
    }
    async function adicionarMembro() {
        const idEquipe = equipeDisponivelSelecionada;
        const idEmpreendimento = document.getElementById("idempreendimento").value;

        if (!idEmpreendimento || !equipeDisponivelSelecionada) {
            mostrarMensagemNaTela("resultadoequipe","Selecione um empreendimento.", "warning");
            return;
        }

        if (!equipeDisponivelSelecionada) {
            mostrarMensagemNaTela("resultadoequipe","Selecione uma equipe.", "warning");
            return;
        }

        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/${idEmpreendimento}/equipes/adicionar/${idEquipe}`,
                {
                    method: "POST"
                }
            );

            if (!response.ok) {
                throw new Error("Erro ao adicionar equipe ao empreendimento.");
            }

            mostrarMensagemNaTela("resultadoequipe","Equipe adicionada com sucesso.", "success");

            // Atualiza as listas
            montaEquipes(idEmpreendimento);

        } catch (erro) {
            console.error(erro);
            mostrarMensagemNaTela("resultadoequipe","Erro ao adicionar equipe: "+error, "error");
        }
    }
    async function removerMembro() {
        const idEquipe = equipeSelecionada;
        const idEmpreendimento = document.getElementById("idempreendimento").value;

        if (!idEmpreendimento) {
            mostrarMensagemNaTela("resultadoequipe","Selecione um empreendimento.", "warning");
            return;
        }

        if (!idEquipe) {
            mostrarMensagemNaTela("resultadoequipe","Selecione uma equipe.", "warning");
            return;
        }

        try {
            const response = await fetch(
                `${API_EMPREENDIMENTO}/${idEmpreendimento}/equipes/excluir/${idEquipe}`,
                {
                    method: "DELETE"
                }
            );

            if (!response.ok) {
                throw new Error("Erro ao remover equipe do empreendimento.");
            }

            mostrarMensagemNaTela("resultadoequipe","Equipe removida com sucesso.", "success");

            // Atualiza as listas
            montaEquipes(idEmpreendimento);

        } catch (erro) {
            console.error(erro);
            mostrarMensagemNaTela("resultadoequipe","Erro ao remover equipe: "+erro.value, "error");
        }
    }
    // Renderiza a lista customizada mapeando os eventos de clique
    function renderizarListaCustom(containerId, listaEquipes, tipo) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (listaEquipes.length === 0) {
            container.innerHTML = `<div style="padding: 20px; color: #94a3b8; text-align:center; font-size:14px;">Nenhum usuário encontrado</div>`;
            return;
        }

        listaEquipes.forEach(equipe => {
            const item = document.createElement('div');
            item.className = 'membro-item';
            item.dataset.id = equipe.idequipe;

            item.innerHTML = `
                <div class="membro-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="membro-login">${equipe.nomeequipe.split(' ')[0].toLowerCase()}</div>
                <div class="membro-name">${equipe.nomeequipe}</div>
            `;

            item.addEventListener('click', () => {
                // Remove seleção anterior do escopo específico
                container.querySelectorAll('.membro-item').forEach(el => el.classList.remove('selecionado'));
                item.classList.add('selecionado');

                if (tipo === 'disponivel') {
                    equipeDisponivelSelecionada = equipe.idequipe;
                } else {
                    equipeSelecionada = equipe.idequipe;
                }
            });

            container.appendChild(item);
        });
    }
    async function montaEquipes(idEquipe) {
        try {
            const disponiveis = await fetch(`${API_EMPREENDIMENTO}/${idEquipe}/equipes/disponiveis`).then(r => r.json());
            const membros = await fetch(`${API_EMPREENDIMENTO}/${idEquipe}/equipes`).then(r => r.json());

            renderizarListaCustom("usuariosDisponiveis", disponiveis, 'disponivel');
            renderizarListaCustom("usuariosEquipe", membros, 'equipe');

            equipeDisponivelSelecionada = null;
            equipeSelecionada = null;
        } catch(e) {
            mostrarMensagemNaTela("resultado","Erro ao montar colunas de membros: " + e.message);
        }
    }

    async function salvarEmpreendimento() {
        const hoje = new Date();
        var campoBloqueado = 0;

        const idempreendimento = document.getElementById('idempreendimento').value;
        const descempreendimento = document.getElementById('descempreendimento').value;
        const data_inicio = document.getElementById('data_inicio').value;
        const data_fim = document.getElementById('data_fim').value;
        const siglaempreendimento = document.getElementById('descempreendimento').value;
        const cor = corHexValida(document.getElementById('cor').value);
        const codempreendimento = document.getElementById('codempreendimento').value;
        if(document.getElementById('bloqueado').checked) {
            campoBlooqueado = 0;
        }
        else {
            campoBlooqueado = 1;
        }
        const duracao_min_sprint = document.getElementById('duracao_min_sprint').value;
        const duracao_max_sprint = document.getElementById('duracao_max_sprint').value;
        const permitir_sprint_sobreposta = document.getElementById("permitir_sprint_sobreposta").checked;
        const permitir_multiplas_sprint_ativas = document.getElementById("permitir_multiplas_sprint_ativas").checked;
        const horas_Trabalho_Dia  = document.getElementById('horas_Trabalho_Dia').value;
        const considerar_Feriados = document.getElementById('considerar_feriados').checked;
        const considerar_valorhoras = document.getElementById('considerar_valorhoras').checked;

        const Empreendimento = {
            idempreendimento: Number(idempreendimento) || null,
            descempreendimento: descempreendimento || null,
            data_inicio: data_inicio || hoje,
            data_fim: data_fim || hoje,
            bloqueado: campoBloqueado,
            siglaempreendimento: siglaempreendimento || null,
            cor: cor || "6c757d",
            codempreendimento: codempreendimento || null,

            gestor: {
                idgestor: Number(document.getElementById("comboGestor").value) || null
            },

            status: {
                idstatus: Number(document.getElementById("comboStatus").value) || null
            },
            prioridade: {
                idprioridade: Number(document.getElementById("comboPrioridade").value) || null
            },

            duracao_min_sprint: Number(duracao_min_sprint),
            duracao_max_sprint: Number(duracao_max_sprint),
            permitir_sprint_sobreposta: permitir_sprint_sobreposta || false,
            permitir_multiplas_sprint_ativas: permitir_multiplas_sprint_ativas || false,
            considerar_feriados: considerar_Feriados || false,
            horas_trabalho_dia: Number(horas_Trabalho_Dia) || 8,
            considerar_valorhoras: considerar_valorhoras || false
        };
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(Empreendimento)
            });
            const data = await response.json();
            mostrarMensagemNaTela("resultado","Empreendimento salvo com sucesso! ","success");
            setTimeout(() => {
                limpaFormulario();
                listarEmpreendimentos();
            }, 1000);

        } catch (error) {
            mostrarMensagemNaTela("resultado","Erro ao salvar Empreendimento: "+error.message,"error");
        }
    }
    async function listarEmpreendimentos() {
        cor = "6c757d";
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">% Concluído</th>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(emp => {
                const cor = corHexValida(emp.cor) ? emp.cor : "#6c757d";
                tabela += `<tr onclick="buscarPorLinha(${emp.idempreendimento})"
                                style="cursor:pointer;">
                          <td width="10px">${montarProgresso(emp.percentual)}</td>
                           <td style="border-left:8px solid ${cor};">
                              ${emp.idempreendimento}</td>
                                <td>${emp.descempreendimento}</td>
                                <td>${emp.status.descstatus}</td>
                                <td>${formatarData(emp.data_inicio)}</td>
                                <td>${formatarData(emp.data_fim)}</td>
                                <td> <button type="button" class="btn" onclick="excluirEmpreendimento(${emp.idempreendimento})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById("resultado").innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado","Erro ao listar Empreendimentos: " + error.message,"error");
        }
    }
    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/${id}`);
            const Empreendimento = await response.json();
            if(!response.ok) {
                mostrarMensagemNaTela(Empreendimento.mensagem,"error");
            } else {
                document.getElementById('idempreendimento').value = Empreendimento.idempreendimento;
                document.getElementById('descempreendimento').value = Empreendimento.descempreendimento;
                document.getElementById('siglaempreendimento').value = Empreendimento.siglaempreendimento;
                document.getElementById('cor').value = corHexValida(Empreendimento.cor) ? Empreendimento.cor : "#6c757d";
                // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                document.getElementById('bloqueado').checked = Empreendimento.bloqueado || 0;
                // CARREGANDO OS COMBOS
                document.getElementById('comboStatus').value = Empreendimento.status.idstatus || 0;
                document.getElementById('comboPrioridade').value = Empreendimento.prioridade.idprioridade || 0;
                document.getElementById('comboGestor').value = Empreendimento.idgestor || 0;
                document.getElementById('data_inicio').value = Empreendimento.data_inicio;
                document.getElementById('data_fim').value = Empreendimento.data_fim;
                // Limpa mensagens e monta equipe se o empreendimento mudar de aba depois
                mostrarMensagemNaTela("resultado", "Empreendimento selecionado: " +  Empreendimento.descempreendimento, "green");
                montaEquipes(Empreendimento.idempreendimento);
                configuracaoSprint.idconfiguracao = Empreendimento.idconfiguracao;
                configuracaoSprint.idempreendimento = Empreendimento.idempreendimento;
                configuracaoSprint.duracao_min_sprint = Empreendimento.duracao_min_sprint;
                configuracaoSprint.duracao_max_sprint = Empreendimento.duracao_max_sprint;
                configuracaoSprint.horas_trabalho_dias = Empreendimento.horas_trabalho_dias;
                configuracaoSprint.considerar_feriados = Empreendimento.considerar_feriados;
                configuracaoSprint.considerar_valorhoras = Empreendimento.considerar_valorhoras;
                configuracaoSprint.permitir_sprint_sobreposta = Empreendimento.permitir_sprint_sobreposta;
                configuracaoSprint.permitir_multiplas_sprint_ativas = Empreendimento.permitir_multiplas_sprint_ativas;
                document.getElementById("duracao_min_sprint").value = Empreendimento.duracao_min_sprint;
                document.getElementById("duracao_max_sprint").value = Empreendimento.duracao_max_sprint;
                document.getElementById("horas_Trabalho_Dia").value = Empreendimento.horas_trabalho_dia;
                document.getElementById("permitir_sprint_sobreposta").checked =  Empreendimento.permitir_sprint_sobreposta;
                document.getElementById("permitir_multiplas_sprint_ativas").checked = Empreendimento.permitir_multiplas_sprint_ativas;
                document.getElementById("considerar_feriados").checked = Empreendimento.considerar_feriados;
                document.getElementById("considerar_valorhoras").checked = Empreendimento.considerar_valorhoras;
                statusAtual = Empreendimento.status.idstatus;
                await carregarStatus(statusAtual);
            }
        } catch (error) {
            mostrarMensagemNaTela("resultado","Erro ao carregar Empreendimento: "+error.message,"error");
        }
    }
    async function excluirEmpreendimento(idEmpreendimento) {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/excluir/${idEmpreendimento}`, {
                method: 'DELETE'
            });
            mostrarMensagemNaTela("resultado","Empreendimento excluído com sucesso", "success");
            limpaFormulario();
        } catch (error) {
            mostrarMensagemNaTela("resultado","Erro ao excluir: " + error.message, "error");
        }
    }
    function limpaFormulario() {
        document.getElementById('idempreendimento').value = "";
        document.getElementById('descempreendimento').value = "";
        document.getElementById('codempreendimento').value = "";
        document.getElementById('cor').value = "#2196F3";
        document.getElementById('bloqueado').checked = false;
        equipeDisponivelSelecionada = null;
        equipeSelecionada = null;
        mostrarMensagemNaTela("resultado","","success");
    }

    function formatarData(data) {
        if (!data) return "";

        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
    }

    function montarProgresso(percentual) {

        percentual = Number(percentual) || 0;

        const largura = Math.min(percentual, 100);

        let cor = "#dc3545"; // vermelho

        if (percentual >= 100) {
            cor = "#198754";
        } else if (percentual >= 75) {
            cor = "#20c997";
        } else if (percentual >= 50) {
            cor = "#ffc107";
        } else if (percentual >= 25) {
            cor = "#fd7e14";
        }

        return `
        <div class="progresso-grid">
            <div class="barra">
                <div class="preenchimento"
                     style="width:${largura}%; background:${cor};">
                </div>
            </div>
            <span>${percentual}%</span>
        </div>
    `;
    }
    function validaEntrada() {
        if((MultiploDe7(document.getElementById('duracao_min_sprint').value) &&
           MultiploDe7(document.getElementById('duracao_max_sprint').value))) {
            mostrarMensagemNaTela("resultadoconfiguracao","Duração mínima e duração máximo devem ser múltiplo de semana!", "error");
            return false;
        }
        if(Number(document.getElementById('duracao_min_sprint').value) < 7) {
            mostrarMensagemNaTela("resultadoconfiguracao","A sprint deve ter o mínimo de 7 dias!", "error");
            return false;
        }
        if(Number(document.getElementById('duracao_max_sprint').value) > 30) {
            mostrarMensagemNaTela("resultadoconfiguracao","A sprint deve ter o máximo de 30 dias!", "error");
            return false;
        }
        if(Number(document.getElementById('duracao_min_sprint').value) >= Number(document.getElementById('duracao_max_sprint').value)) {
            mostrarMensagemNaTela("resultadoconfiguracao","A duração mínima deve ser menor que a duração máxima!", "error");
            return false;
        }
        if(Number(document.getElementById('horas_Trabalho_Dia').value) > 8) {
            mostrarMensagemNaTela("resultadoconfiguracao","Horas trabalhadas não devem exceder 8 h/dia!", "error");
            return false;
        }
        return true;
    }
    function MultiploDe7(numero) {
        return numero % 7 !== 0;
    }
</script>
