<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empreendimento - TaskController 1.0</title>
    <style>
        /* Reset básico e tipografia */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 1500px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
        }

        /* ==========================================================================
           ESTRUTURA DAS ABAS (CSS)
           ========================================================================== */

        /* Container dos botões das abas */
        .abas-container {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }

        /* Estilo de cada botão de aba */
        .aba-botao {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent; /* Reserva o espaço para a borda ativa */
            margin-bottom: -2px; /* Joga a borda por cima da linha do container */
            transition: all 0.2s ease-in-out;
        }

        .aba-botao:hover {
            color: #1e293b;
            background-color: #f8fafc;
        }

        /* Estado da Aba Ativa (Selecionada) */
        .aba-botao.ativa {
            color: #2563eb; /* Azul padrão do sistema */
            border-bottom: 2px solid #2563eb;
        }

        /* Container do conteúdo */
        .conteudo-aba {
            display: none; /* 🌟 ESCONDE TODAS AS ABAS POR PADRÃO */
            padding: 10px 5px;
            animation: surgir 0.3s ease-in-out; /* Efeito visual suave */
        }

        /* Estado do Conteúdo Ativo */
        .conteudo-aba.ativo {
            display: block; /* 🌟 MOSTRA APENAS A ABA ATIVA */
        }

        /* Pequena animação para o conteúdo aparecer suavemente */
        @keyframes surgir {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           Botões (Grupo)
           ========================================================================== */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap; /* Ajusta em telas menores */
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* Botão Principal (Salvar) */
        .btn-group .btn:nth-child(1) {
            background-color: #2563eb;
            color: white;
        }
        .btn-group .btn:nth-child(1):hover { background-color: #1d4ed8; }

        /* Botão Secundário (Listar) */
        .btn-group .btn:nth-child(2) {
            background-color: #10b981;
            color: white;
        }
        .btn-group .btn:nth-child(2):hover { background-color: #059669; }

        /* Botão Buscar */
        .btn-group .btn:nth-child(3) {
            background-color: #64748b;
            color: white;
        }
        .btn-group .btn:nth-child(3):hover { background-color: #475569; }

        /* Botão Voltar */
        .btn-group .btn:nth-child(4) {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-group .btn:nth-child(4):hover { background-color: #cbd5e1; }

        .btn:active { transform: scale(0.98); }
        /* ==========================================================================
           Tabela de Resultados Dinâmica
           ========================================================================== */
        table.table {
            width: 100%;
            border-collapse: collapse; /* Remove aquelas bordas duplas antigas */
            margin-top: 15px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden; /* Garante o arredondamento dos cantos */
            border: 1px solid #e2e8f0;
        }

        table.table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 2px solid #e2e8f0;
        }

        table.table td {
            padding: 14px 16px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Efeito Zebrado nas linhas da tabela */
        table.table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        /* Efeito de Hover ao passar o mouse na linha */
        table.table tbody tr:hover {
            background-color: #f1f5f9 !important;
        }

        /* Botão de Excluir específico dentro da tabela */
        table.table .btn {
            padding: 6px 12px;
            font-size: 12px;
            background-color: #ef4444;
            color: white;
        }
        table.table .btn:hover { background-color: #dc2626; }
/*********************************/
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            margin-top: 16px;
            text-align: left;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            transition: all 0.2s ease-in-out;
        }
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            transition: all 0.2s ease-in-out;
            margin-bottom: 4px;
        }

        /* Efeito de foco azul nos inputs */
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        select {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            transition: all 0.2s ease-in-out;
            margin-bottom: 12px;
            cursor: pointer;
            appearance: none; /* Remove a seta feia padrão do navegador */
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        /* ==========================================================================
           Checkboxes Alinhados
           ========================================================================== */
        .checkbox-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6; /* Deixa o check azul padrão */
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        /* ==========================================================================
           Botões (Grupo)
           ========================================================================== */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap; /* Ajusta em telas menores */
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Empreendimento - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'usuarios')">Empreendimento</button>
       </div>
    <div id="empreendimento" class="conteudo-aba ativo">
        <input type="number" name="idempreendimento" id="idempreendimento" placeholder="ID do empreendimento (Deixe vazio para novo)">
        <label for="descempreendimento">Nome do empreendimento:</label>
        <input type="text" id="descempreendimento">
        <label for="sigla">Sigla</label>
        <input type="text" id="sigla" maxlength="3">
        <label for="data_inicio">Data início:</label> <input type="date" id="data_inicio" name="datainicial">
        <label for="data_fim">Data Final:</label> <input type="date" id="data_fim" name="datafinal">
        <label for="comboStatus">Status:</label>
        <select id="comboStatus" name="comboStatus">
            <option value="">-- Selecione o status do empreendimento --</option>
        </select>

        <label for="comboGestor">Gestor:</label>
        <select id="comboGestor" name="comboGestor">
            <option value="">-- Selecione o gestor do empreendimento --</option>
        </select>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn"  onclick="salvarEmpreendimento()">Salvar</button>
            <button type="button" class="btn" onclick="listarEmpreendimentos()">Listar</button>
            <button type="button" class="btn" onclick="buscarEmpreendimento(document.getElementById('idempreendimento').value)">Buscar por ID</button>
            <button type="button" class="btn" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>

</div>

<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_STATUS = 'http://localhost:8080/status_entidades';

    function formatarData(data) {
        if (!data) return "";

        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
    }

    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }
    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarGestor() {
        const comboGestor = document.getElementById("comboGestor");
        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idUsuario;
                opcao.textContent = usuario.nome;
                comboGestor.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }
    async function carregarStatus() {
        const comboStatus = document.getElementById("comboStatus");
        try {
            const resposta = await fetch(`${API_STATUS}/listar`);
            const status = await resposta.json();
            status.forEach(s => {
                const opcao = document.createElement('option');
                opcao.value = s.idstatus;
                opcao.textContent = s.descstatus;
                comboStatus.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela(error.message,1);
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarGestor();
        carregarStatus();
    });
    async function salvarEmpreendimento() {
        const descempreendimento = document.getElementById('descempreendimento').value;
        const data_inicio = document.getElementById('data_inicio').value;
        const data_fim = document.getElementById('data_fim').value;
        const sigla = document.getElementById('sigla').value;
        const idStatus = document.getElementById('comboStatus').value;
        const idGestor = document.getElementById('comboGestor').value;
        const empreendimento = {
            descempreendimento: descempreendimento || null,
            data_inicio: data_inicio || null,
            data_fim: data_fim || null,
            sigla: sigla || null,
            status: idStatus ? { idStatus: Number(idStatus) } : null ,
            gestor: idGestor ? { idGestor: Number(idGestor) } : null
        };
        try {
                const response = await fetch(`${API_EMPREENDIMENTO}/salvar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(empreendimento)
                });
                const data = await response.json();
        } catch (error) {
                mostrarMensagemNaTela(error.message,1);
        }
    }
    async function buscarEmpreendimentoPorLinha(id) {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/${id}`);
            const empreendimento = await response.json();
            document.getElementById('idempreendimento').value = empreendimento.idempreendimento;
            document.getElementById('descempreendimento').value = empreendimento.descempreendimento;
            document.getElementById('data_inicio').value = empreendimento.data_inicio;
            document.getElementById('data_fim').value = empreendimento.data_fim;
            document.getElementById('sigla').value = empreendimento.siglaempreendimento;
            document.getElementById('status').value = empreendimento.status;
            document.getElementById('comboGestor').value = empreendimento.idgestor;
        } catch (error) {
            mostrarMensagemNaTela(error.message,1);
        }
    }
    async function listarEmpreendimentos() {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Sigla</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(empreendimento => {
                tabela += `<tr onclick="buscarEmpreendimentoPorLinha(${empreendimento.idempreendimento})"
                                style="cursor:pointer;">
                                <td>${empreendimento.idempreendimento}</td>
                                <td>${empreendimento.descempreendimento}</td>
                                <td>${empreendimento.siglaempreendimento}</td>
                                <td>${empreendimento.descstatus}</td>
                                <td>${formatarData(empreendimento.data_inicio)}</td>
                                <td>${formatarData(empreendimento.data_fim)}</td>
                                <td> <button type="button" class="btn" onclick="event.stopPropagation();excluirEmpreendimento(${empreendimento.idempreendimento})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao listar Empreendimento",1);
        }
    }
    async function excluirEmpreendimento(idEmpreendimento) {
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/excluir/${idEmpreendimento}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            mostrarMensagemNaTela(texto || 'Empreendimento excluído com sucesso',1);
        } catch (error) {
            mostrarMensagemNaTela(error.message,1);
        }
    }

    async function buscarEmpreendimento(idEmpreendimento) {
        const response = await fetch(`${API_EMPREENDIMENTO}/${idEmpreendimento}`);
        if(!response.ok) {
            const messageError = await response.text();
            mostrarMensagemNaTela(messageError,1);
            return;
        }
        const data = await response.json();
        let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Sigla</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(empreendimento => {
                tabela += `<tr onclick="buscarEmpreendimentoPorLinha(${empreendimento.idempreendimento})"
                                style="cursor:pointer;">
                                <td>${empreendimento.idempreendimento}</td>
                                <td>${empreendimento.descempreendimento}</td>
                                <td>${empreendimento.siglaempreendimento}</td>
                                <td>${empreendimento.descstatus}</td>
                                <td>${formatarData(empreendimento.data_inicio)}</td>
                                <td>${formatarData(empreendimento.data_fim)}</td>
                                <td> <button type="button" class="btn" onclick="event.stopPropagation();excluirEmpreendimento(${empreendimento.idempreendimento})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
    }
    function mostrarMensagemNaTela(mensagem) {
        const container = document.getElementById("resultado");
        if (container) {
            container.innerHTML = `<p style="color:red;">${mensagem}</p>`;
        } else {
            alert(mensagem);
        }
    }
</script>
</body>
</html>
