<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épicos - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/epico.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<script src="js/utils/mensagens.js"></script>
<div class="container">
    <h1>Épico - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'epico')">Épicos</button>
        <button class="aba-botao" onclick="alternarAba(event, 'estoria')">Estórias</button>
        <button class="aba-botao" onclick="alternarAba(event, 'tarefa')">Tarefas</button>
        <button class="aba-botao" onclick="alternarAba(event, 'equipes')">Equipes</button>
    </div>
    <div id="epico" class="conteudo-aba ativo">
        <input type="number" id="idepico" onblur="buscarPorLinha(document.getElementById('idepico').value,0,0, 'EPICOS')" name="idepico" placeholder="ID do épico (Deixe vazio para novo)">
        <div class="form-grid">
            <div>
                <label>Nome</label>
                <input type="text" id="nomeepico" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Código</label>
                <input type="text" id="codigo" oninput="converterMaiusculo(this)" maxlength="10">
            </div>
            <div>
                <label>Status</label>
                <select id="comboStatusEP">
                    <option value="">-- Selecione o status --</option>
                </select>
            </div>
            <div>
                <label>Empreendimento</label>
                <select id="comboEmpreendimentoEP">
                    <option value="">-- Selecione o empreendimento --</option>
                </select>
            </div>
            <div>
                <label>Pioridade</label>
                <select id="comboPrioridadeEP">
                    <option value="">-- Selecione prioridade --</option>
                </select>
            </div>
            <div>
                <label>Criador</label>
                <select id="comboCriadorEP">
                    <option value="">-- Selecione o gestor --</option>
                </select>
            </div>
            <div>
                <label>Data inicial</label>
                <input type="date" id="data_inicio">
            </div>
            <div>
                <label>Data final prevista</label>
                <input type="date" id="data_fim">
            </div>
            <div>
                <label for="cor">Cor de identificação do épico</label>
                <input type="color" id="cor" value="#2196F3">
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="bloqueado" value="0"> Épico bloqueado
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-add"  onclick="criarEpico()">Novo</button>
            <button type="button" class="btn btn-salvar" onclick="salvarEpico();">Salvar</button>
            <button type="button" class="btn btn-listar"  onclick="listarEpicos()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado_epico"></div>
    </div>
    <div id="estoria" class="conteudo-aba">
        <input type="number" id="idestoria" onblur="buscarPorLinha(document.getElementById('idepico').value,document.getElementById('idestoria').value, 0, 'ESTORIAS')" placeholder="ID da estoria (Deixe vazio para novo)">
        <div class="form-grid">
            <div>
                <label>Descrição</label>
                <input type="text" id="descestoria" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Status</label>
                <select id="comboStatusES">
                    <option value="">-- Selecione o status --</option>
                </select>
            </div>
            <div>
                <label>Criador</label>
                <select id="comboCriadorES">
                    <option value="">-- Selecione o criador --</option>
                </select>
            </div>
            <div>
                <label>Responsavel</label>
                <select id="comboResponsavelES">
                    <option value="">-- Selecione o responsável --</option>
                </select>
            </div>
            <div>
                <label>Data inicial</label>
                <input type="date" id="data_inicio_estoria">
            </div>
            <div>
                <label>Data final prevista</label>
                <input type="date" id="data_fim_estoria">
            </div>
            <div>
                <label>Resumo</label>
                <input type="text" id="resumo_estoria" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Pontos estimados</label>
                <input type="number" id="pontos" class="form-control text-end" disabled>
            </div>
            <div>
                <label>Horas estimadas</label>
                <input type="number"  id="horas_estimadas" class="form-control text-end" disabled>
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="bloqueada_estoria" value="0"> Estória bloqueada
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-add" onclick="criarEstoria();">Nova</button>
            <button type="button" class="btn btn-salvar" onclick="salvarEstoria(document.getElementById('idepico').value);">Salvar</button>
            <button type="button" class="btn btn-listar"  onclick="listarEstoria(document.getElementById('idepico').value)">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado_estoria"></div>
    </div>
    <div id="tarefa" class="conteudo-aba">
        <input type="number" onblur="buscarPorLinha(document.getElementById('idepico').value,
                                                    document.getElementById('idestoria').value,
                                                    document.getElementById('idtarefa').value, 'TAREFAS')" name="idtarefa" id="idetarefa" placeholder="ID da estoria (Deixe vazio para novo)">
        <div class="form-grid">
            <div>
                <label>Descrição</label>
                <input type="text" id="desctarefa" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Status</label>
                <select id="comboStatusTA">
                    <option value="">-- Selecione o status --</option>
                </select>
            </div>
            <div>
                <label>Criador</label>
                <select id="comboCriadorTA">
                    <option value="">-- Selecione o criador --</option>
                </select>
            </div>
            <div>
                <label>Responsavel</label>
                <select id="comboResponsavelTA">
                    <option value="">-- Selecione o responsável --</option>
                </select>
            </div>
            <div>
                <label>Data inicial</label>
                <input type="date" id="data_inicio_tarefa">
            </div>
            <div>
                <label>Data final prevista</label>
                <input type="date" id="data_fim_tarefa">
            </div>
            <div>
                <label>Resumo</label>
                <input type="text" id="resumo_tarefa" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Horas estimadas</label>
                <input type="number" id="horas_estimadas_tarefas" class="form-control text-end" disabled>
            </div>
            <div>
                <label>Horas realizadas</label>
                <input type="number"  id="horas_realizadas_tarefas" class="form-control text-end" disabled>
            </div>
            <div>
                <label>Tipo de tarefa</label>
                <select id="comboTipoTarefa">
                    <option value="">-- Selecione o tipo de tarefa --</option>
                </select>
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="bloqueada_tarefa" value="0"> Tarefa bloqueada
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-add" onclick="criarTarefa();">Nova</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTarefa(document.getElementById('idestoria').value);">Salvar</button>
            <button type="button" class="btn btn-listar"  onclick="listarTarefas(document.getElementById('idestoria').value)">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado_tarefa"></div>
    </div>
    <div id="equipes" class="conteudo-aba">


        <div id="cardsEquipes"></div>
    </div>
</div>
<script>
    //-----------------CARREGAR CONFIGURAÇÃO
    let configuracao = {
        idepico: 0,
        idestoria: 0,
        idtarefa: 0};


    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';
    const API_EPICO = 'http://localhost:8080/epicos';
    const API_STATUS = 'http://localhost:8080/status_entidades';
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_PRIORIDADE = 'http://localhost:8080/prioridade';
    const API_TIPO_TAREFA = 'http://localhost:8080/tipo_tarefa';
    const API_DASHBOARD = 'http://localhost:8080/dashboard';
    const API_TAREFA = 'http://localhost:8080/tarefas';

    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }

    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarGestor() {
        const comboCriadorEP = document.getElementById("comboCriadorEP");
        const comboCriadorES = document.getElementById("comboCriadorES");
        const comboResponsavelES = document.getElementById("comboResponsavelES");

        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idusuario;
                opcao.textContent = usuario.nome;
                comboCriadorEP.appendChild(opcao);
                comboCriadorES.appendChild(opcao);
                comboResponsavelES.appendChild(opcao)
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", "Erro ao carregar gestor: "+error.message,"error");
        }
    }
    async function carregarPrioridade() {
        const comboPrioridadeEP = document.getElementById("comboPrioridadeEP");
        try {
            const resposta = await fetch(`${API_PRIORIDADE}/listar`);
            const prioridades = await resposta.json();
            prioridades.forEach(prioridade => {
                const opcao = document.createElement('option');
                opcao.value = prioridade.idprioridade;
                opcao.textContent = prioridade.descprioridade;
                comboPrioridadeEP.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", MSG.erroCarregar("PRIORIDADES"), "error");
        }
    }
    async function carregarStatus() {
        const comboStatusEP = document.getElementById("comboStatusEP");
        const comboStatusES = document.getElementById("comboStatusES");
        const comboStatusTA = document.getElementById("comboStatusTA");
        try {
            const resposta = await fetch(`${API_STATUS}/listar`);
            const vetor = await resposta.json();
            vetor.forEach(i => {
                const opcao = document.createElement('option');
                opcao.value = i.idstatus;
                opcao.textContent = i.descstatus;
                comboStatusEP.appendChild(opcao);
                comboStatusES.appendChild(opcao);
                comboStatusTA.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", MSG.erroCarregar("STATUS"), "error");
        }
    }
    async function carregarEmpreendimento() {
        const comboEmpreendimentoEP = document.getElementById("comboEmpreendimentoEP");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const empreendimentos = await resposta.json();
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimentoEP.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", MSG.erroCarregar("EMPREENDIMENTO"), "error");
        }
    }
    async function carregarTipoTarefa() {
        const comboTipoTarefa = document.getElementById("comboTipoTarefa");
        try {
            const resposta = await fetch(`${API_TIPO_TAREFA}/listar`);
            const tipos = await resposta.json();
            tipos.forEach(t => {
                const opcao = document.createElement('option');
                opcao.value = t.idtipo_tarefa;
                opcao.textContent = t.desctipo_tarefa;
                comboTipoTarefa.appendChild(opcao);
            });
        } catch (error) {
           // mostrarMensagemNaTela("resultado_epico", MSG.erroCarregar("TIPO DE TAREFAS"), "error");
            mostrarMensagemNaTela("resultado_epico", error.message, "error");
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarEmpreendimento();
        carregarGestor();
        carregarStatus();
        carregarPrioridade();
        carregarTipoTarefa();
    });
    async function criarEpico() {
        limpaFormulario("EP");
    }
    async function criarTarefa() {
        limpaFormulario("TA");
    }

    async function salvarTarefa() {

    }
    async function salvarEpico() {
        const hoje = new Date();
        const descepico = document.getElementById('descepico').value;
        const obsepico = document.getElementById('obsepico').value;
        const codepico = document.getElementById('codepico').value;
        const cor = corHexValida(document.getElementById(cor).value);
        if(document.getElementById('bloqueado').checked) {
            campoBlooqueado = 0;
        }
        else {
            campoBlooqueado = 1;
        }
        const data_inicio = document.getElementById('data_inicio').value || hoje ;
        const data_fim = document.getElementById('data_fim').value || hoje ;
        const epico = {
            idepico: Number(idepico) || null,
            descepico: descepico || null,
            obsepico: obsepico || null,
            bloqueado: campoBlooqueado,
            data_inicio: data_inicio,
            data_fim: data_fim,
            codepico: codepico,
            cor: cor || "6c757d",
            criador: {
                idCriador: document.getElementById('comboCriadorEP').value || null,
            },
            responsavel: {
                idresponsavel: document.getElementById('comboResponsavelEP').value || null,
            },
            status: {
                idstatus: document.getElementById('comboStatusEP').value || null,
            },
            empempreendimento: {
                idEmpreendimento: document.getElementById('comboEmpreendimentoEP').value || null,
            }
        };
        try {
            const response = await fetch(`${API_EPICO}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(epico)
            });
            const data = await response.json();
            mostrarMensagemNaTela("resultado_epico", MSG.salvo("ÉPICO"), "error");
            setTimeout(() => {
                limparFormulario("EP");
                listarEpicos();
            }, 1000);

        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", MSG.erroSalvar("ÉPICO"), "error");
        }
    }
    async function limparFormulario(ABA) {
        if(ABA === "EP") {
            document.getElementById('idepico').value = "";
            document.getElementById('nomeepico').value = "";
            document.getElementById('codigo').value = "";
            document.getElementById('cor').value = "#6c757d";
            // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
            document.getElementById('bloqueado').checked = false;
            // CARREGANDO OS COMBOS
            document.getElementById('comboStatusEP').value  = "";
            document.getElementById('comboEmpreendimentoEP').value = "";
            document.getElementById('comboPrioridadeEP').value = "";
            document.getElementById('comboCriadorEP').value = "";
            document.getElementById('data_inicio').value = "";
            document.getElementById('data_fim').value = "";
       } else if(ABA === "ES") {
            document.getElementById('idestoria').value = "";
            document.getElementById('descestoria').value = "";
            document.getElementById('resumo_estoria').value = "";
            document.getElementById('bloqueada_estoria').checked = false;
            document.getElementById('data_inicio').value = "";
            document.getElementById('data_fim').value = "";
            document.getElementById('comboCriadorES').value = "";
            document.getElementById('comboResponsavelES').value = "";
            document.getElementById('comboStatusES').value = "";
            document.getElementById('pontos').value = 0.00;
            document.getElementById('horas_estimadas').value = 0.00;
        } else if(ABA === "TA") {
            document.getElementById('idtarefa').value = "";
            document.getElementById('desctarefa').value = "";
            document.getElementById('resumo_tarefa').value = "";
            document.getElementById('bloqueada_estoria').checked = false;
            document.getElementById('data_inicio_tarefa').value = "";
            document.getElementById('data_fim_tarefa').value = "";
            document.getElementById('comboCriadorTA').value = "";
            document.getElementById('comboResponsavelTA').value = "";
            document.getElementById('comboStatusTA').value = "";
            document.getElementById('comboTipoTarefa').value = "";
            document.getElementById('horas_estimadas_tarefa').value = 0.00;
            document.getElementById('horas_realizadas_tarefa').value = 0.00;
        }
    }
    async function listarEpicos() {
        cor = "6c757d";
        try {
            const response = await fetch(`${API_EPICO}/listar`);
            const data = await response.json();
            if(data.length <= 0) {
                mostrarMensagemNaTela("resultado_epico", MSG.naoEncontrado("ÉPICO"), "warning");
                return;
            }
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">% Concluído</th>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header">Código</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(epico => {
                cor = corHexValida(epico.cor) ? epico.cor : "#6c757d";
                tabela += `<tr onclick="buscarPorLinha(${epico.idepico},0,0, 'EPICO')"
                                style="cursor:pointer;">
                          <td>${montarProgresso(epico.percentual)}</td>
                           <td style="border-left:8px solid ${cor};">${epico.idepico}</td>
                                <td>${epico.nome}</td>
                                <td>${epico.codepico}</td>
                                <td>${epico.status.descstatus}</td>
                                <td>${formatarData(epico.data_inicio)}</td>
                                <td>${formatarData(epico.data_fim_prevista)}</td>
                                <td> <button type="button" class="btn" onclick="excluirEpico(${epico.idepico})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado_epico').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico",MSG.errolistar("ÉPICO"),"error");
        }
    }
    async function criarEstoria() {
        limpaFormulario("ES");
    }
    async function salvarEstoria(idEpico) {
        const hoje = new Date();
        const descestoria = document.getElementById('descestoria').value;
        const resumo = document.getElementById('resumo_estoria').value;
        const campoBlooqueado = document.getElementById('bloqueada_estoria').checked;
        const data_inicio = document.getElementById('data_inicio').value || hoje ;
        const data_fim = document.getElementById('data_fim').value || hoje ;
        const estoria = {
            idepico: Number(idEpico) || null,
            descEstoria: descestoria || null,
            obsepico: obsepico || null,
            bloqueada: campoBlooqueado,
            data_inicio: data_inicio || hoje,
            data_fim: data_fim || hoje,
            codepico: codepico,
            resumo: resumo,
            criador: {
                idCriador: document.getElementById('comboCriadorES').value || null,
            },
            responsavel: {
                idresponsavel: document.getElementById('comboResponsavelES').value || null,
            },
            status: {
                idstatus: document.getElementById('comboStatusES').value || null,
            },
            pontos: Number(document.getElementById('pontos').value) || 0.0,
            horas_estimadas: Number(document.getElementById('horas_estimadas').value) || 0.0,
            horas_realizadas: Number(document.getElementById('horas_realizadas').value) || 0.0,
        };
        try {
            const response = await fetch(`${API_EPICO}/adicionarEstoria`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(estoria)
            });
            const data = await response.json();
            mostrarMensagemNaTela("resultado_estoria",MSG.salvo("ESTÓRIA"),"error");
            setTimeout(() => {
                limparFormulario("ES");
                listarEstoria(idEpico);
            }, 1000);

        } catch (error) {
            mostrarMensagemNaTela("resultado_estoria",MSG.erroSalvar("ESTÓRIA"),"error");
        }
    }
    async function listarEstoria(idEpico) {
        const cor = "6c757d";
        if(idEpico == null) {
            idEpico = configuracao.idepico;
        }
        try {
            const response = await fetch(`${API_EPICO}/${idEpico}/estorias`);
            const data = await response.json();
            if(data.length <= 0) {
                mostrarMensagemNaTela("resultado_estoria",MSG.naoEncontrada("ESTÓRIA"),"warning");
                return;
            }
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Criador</th>
                        <th class="table-header">Responsável</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(estoria => {
                tabela += `<tr onclick="buscarPorLinha(document.getElementById('idepico').value,${estoria.idestoria}, 0,'ESTORIA')" style="cursor:pointer;">
                                <td>${estoria.idestoria}</td>
                                <td>${estoria.descestoria?.toUpperCase() ?? ""}</td>
                                <td>${estoria.status?.descstatus.toUpperCase() ?? ""}</td>
                                <td>${estoria.idcriador?.nome.toUpperCase() ?? ""}</td>
                                <td>${estoria.idresponsavel?.nome.toUpperCase() ?? ""}</td>
                                <td>${formatarData(estoria.data_inicio)}</td>
                                <td>${formatarData(estoria.data_fim)}</td>
                                <td><button type="button" class="btn" onclick="excluirEstoria(${estoria.idestoria}); event.stopPropagation();">Excluir</button></td>
                           </tr>`;
            });
            tabela += `</tbody></table>`;
            document.getElementById('resultado_estoria').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico",MSG.errolistar("ÉPICO"),"error");
        }
    }
    async function listarTarefas(idEpico, idEstoria) {
        const cor = "6c757d";
        if((idEpico === null) || (idEstoria === null)) {
            idEpico = configuracao.idepico;
            idEstoria = configuracao.idestoria;
        }
        try {
            const response = await fetch(`${API_TAREFA}/porEstoria/${idEstoria}`);
            const data = await response.json();
            if(data.length <= 0) {
                mostrarMensagemNaTela("resultado_estoria",MSG.naoEncontrada("TAREFA"),"warning");
                return;
            }
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">&nbsp;</th>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Horas estimadas</th>
                        <th class="table-header">Horas gastas</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(tarefa => {
                tabela += `
        <tr onclick="buscarPorLinha(${idEpico}, ${idEstoria}, ${tarefa.idtarefa}, 'TAREFA')" style="cursor:pointer;">
            <td>${obterIconeTipo(tarefa.tipotarefa)}</td>
            <td>${tarefa.idtarefa}</td>
            <td>${tarefa.desctarefa?.toUpperCase() ?? ""}</td>
            <td>${tarefa.status?.descstatus?.toUpperCase() ?? ""}</td>
            <td>${formatarData(tarefa.data_inicio)}</td>
            <td>${formatarData(tarefa.data_conclusao)}</td>
            <td>${tarefa.horas_estimadas ?? 0}</td>
            <td>${tarefa.horas_realizadas ?? 0}</td>
            <td>
                <button type="button"
                        class="btn"
                        onclick="excluirTarefa(${tarefa.idtarefa}); event.stopPropagation();">
                    Excluir
                </button>
            </td>
        </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado_tarefa').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado_tarefa",MSG.errolistar("TAREFAS"),"error");
        }
    }
    async function listarEquipes(idEmpreendimento) {
        try {
            const response = await fetch(`${API_DASHBOARD}/${idEmpreendimento}/dashboard_equipes`);
            if (!response.ok) {
                    throw new Error(`Erro ${response.status}`);
            }
            const data = await response.json();
            if (data.length === 0) {
                    mostrarMensagemNaTela("resultado_epico", MSG.naoEncontrada("EQUIPE"), "warning");
                    return;
            }
            const container = document.getElementById("cardsEquipes");
            container.innerHTML = "";
            data.forEach(equipe => {
               const percentual = equipe.horasEstimadas > 0 ? Math.min((equipe.horasRealizadas / equipe.horasEstimadas) * 100, 100) : 0;
               container.innerHTML += `<div class="col-md-4 mb-3">
                                                <div class="card shadow-sm">
                                                <div class="card-body">
                                                <h5>${equipe.nomeEquipe}</h5>
                                                <hr>
                                                <p>📖 Nº Estórias: <strong>${equipe.totalEstorias}</strong></p>
                                                <p>📋 Nº Tarefas:  <strong>${equipe.totalTarefas}</strong> </p>
                                                <p>⏱ Horas Estimadas: <strong>${equipe.horasEstimadas}</strong></p>
                                                <p>✔ Horas Realizadas: <strong>${equipe.horasRealizadas}</strong> </p>
                                                <p>💰 Custo Estimado: <strong>${equipe.custoEstimado}</strong></p>
                                                <p>💰 Custo Realizado:<strong>${equipe.custoRealizado}</strong></p>
                            <div class="mt-3">
                                <div class="progress">
                                    <div class="progress-bar bg-success" style="width:${percentual}%"></div>
                                </div>
                                <div class="progress" style="height:10px">
                                    <div class="progress-bar"
                                         style="width:${equipe.percentualProgresso}%">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", MSG.errolistar("EQUIPES"), "error");
        }
    }

    async function buscarPorLinha(idEpico, idEstoria, idTarefa, ABA) {
        configuracao.idepico = idEpico;
        configuracao.idestoria = idEpico;
        configuracao.idtarefa = idEpico;
        if(ABA === "EPICO") {
            try {
                const response = await fetch(`${API_EPICO}/${idEpico}`);
                const epico = await response.json();
                if (!response.ok) {
                    mostrarMensagemNaTela("resultado_epico",epico.mensagem, "error");
                } else {
                    document.getElementById('idepico').value = epico.idepico;
                    document.getElementById('nomeepico').value = epico.nome;
                    document.getElementById('codigo').value = epico.codepico;
                    document.getElementById('cor').value = corHexValida(epico.cor) ? epico.cor : "#6c757d";
                    // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                    document.getElementById('bloqueado').checked = epico.bloqueado || 0;
                    // CARREGANDO OS COMBOS
                    document.getElementById('comboStatusEP').value = epico.status.idstatus;
                    document.getElementById('comboEmpreendimentoEP').value = epico.empreendimento.idempreendimento;
                    document.getElementById('comboPrioridadeEP').value = epico.prioridade.idprioridade;
                    document.getElementById('comboCriadorEP').value = epico.responsavel.idusuario;
                    document.getElementById('data_inicio').value = epico.data_inicio;
                    document.getElementById('data_fim').value = epico.data_fim_prevista;
                    // Limpa mensagens e monta equipe se o usuário mudar de aba depois
                    mostrarMensagemNaTela("resultado_epico","Épico selecionado: " + epico.nome, "success");
                    await listarEstoria(epico.idepico);
                    await listarEquipes(epico.empreendimento.idempreendimento);
                }
            } catch (error) {
                mostrarMensagemNaTela("resultado_epico",MSG.erroCarregar("ÉPICO"), "error");
            }
        } else if (ABA === "ESTORIA") {
            try {
                const response = await fetch(`${API_EPICO}/${idEpico}/estorias/${idEstoria}`);
                const estoria = await response.json();
                if (!response.ok) {
                    mostrarMensagemNaTela("resultado_estoria",estoria.mensagem, "error");
                } else {
                    document.getElementById('idestoria').value = estoria.idestoria;
                    document.getElementById('descestoria').value = estoria.descestoria;
                    // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                    document.getElementById('bloqueada_estoria').checked = estoria.bloqueada || 0;
                    document.getElementById('data_inicio').value = estoria.data_inicio;
                    document.getElementById('data_fim').value = estoria.data_fim;
                    document.getElementById('resumo_estoria').value = estoria.resumo;
                    document.getElementById('pontos').value = parseFloat(estoria.pontos ?? 0);
                    document.getElementById('horas_estimadas').value = parseFloat(estoria.horas_estimadas ?? 0);
                    // CARREGANDO OS COMBOS
                    document.getElementById('comboStatusES').value = estoria.status.idstatus;
                    document.getElementById('comboCriadorES').value = estoria.idcriador.idusuario;
                    document.getElementById('comboResponsavelES').value = estoria.idresponsavel.idusuario;
                    mostrarMensagemNaTela("resultado_estoria","Estória selecionada: " + estoria.descestoria, "success");
                    await listarTarefas(idEpico, estoria.idestoria);
                }
            } catch (error) {
                mostrarMensagemNaTela("resultado_estoria",MSG.erroCarregar("ESTORIAS"), "error");
            }
        } else if (ABA === "TAREFAS") {
            try {
                const response = await fetch(`${API_TAREFA}/${idTarefa}`);
                const tarefa = await response.json();
                if (!response.ok) {
                    mostrarMensagemNaTela("resultado_tarefa",MSG.naoEncontrada("TAREFA"), "error");
                } else {
                    document.getElementById('idtarefa').value = tarefa.idtarefa;
                    document.getElementById('desctarefa').value = tarefa.desctarefa;
                    // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                    document.getElementById('bloqueada_tarefa').checked = tarefa.bloqueada || 0;
                    document.getElementById('data_inicio').value = tarefa.data_inicio;
                    document.getElementById('data_conclusao').value = tarefa.data_conclusao;
                    document.getElementById('data_fim_prevista').value = tarefa.data_fim_prevista;
                    // CARREGANDO OS COMBOS
                    document.getElementById('comboStatusTA').value = tarefa.status.idstatus;
                    document.getElementById('comboCriadorTA').value = tarefa.idcriador.idusuario;
                    document.getElementById('comboResponsavelTA').value = tarefa.idresponsavel.idusuario;
                    // HORAS
                    document.getElementById('horas_realizadas').readOnly = true;
                    document.getElementById('horas_estimadas').readOnly = true;
                    document.getElementById('horas_realizadas').value = tarefa.horas_realizadas;
                    document.getElementById('horas_estimadas').value = tarefa.horas_estimadas;
                }
            } catch (error) {
                mostrarMensagemNaTela("resultado_tarefa",MSG.erroCarregar("TAREFAS"), "error");
            }
        }
    }
    async function excluirEpico(idEpico) {
        try {
            const response = await fetch(`${API_EPICO}/excluir/${idEpico}`, {
                method: 'DELETE'
            });
            mostrarMensagemNaTela("resultado_epico",MSG.excluido("ÉPICO"), "success");
            limpaFormulario("EP");
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico",MSG.erroExcluir("ÉPICO"), "error");
        }
    }

    function montarProgresso(percentual) {
        percentual = Number(percentual) || 0;
        const largura = Math.min(percentual, 100);
        let cor = "#dc3545"; // vermelho
        if (percentual >= 100) {
            cor = "#198754";
        } else if (percentual >= 75) {
            cor = "#20c997";
        } else if (percentual >= 50) {
            cor = "#ffc107";
        } else if (percentual >= 25) {
            cor = "#fd7e14";
        }
        return `
        <div class="progresso-grid">
            <div class="barra">
                <div class="preenchimento"
                     style="width:${largura}%; background:${cor};">
                </div>
            </div>
            <span>${percentual}%</span>
        </div>
    `;
    }
    function obterIconeTipo(tipo) {
        switch (tipo) {
            case "BUG":
                return '<i class="bi bi-bug-fill text-danger"></i>';

            case "FUNCIONALIDADE":
                return '<i class="bi bi-stars text-primary"></i>';

            case "MELHORIA":
                return '<i class="bi bi-wrench text-warning"></i>';

            case "DOCUMENTACAO":
                return '<i class="bi bi-file-earmark-text text-secondary"></i>';

            case "TESTE":
                return '<i class="bi bi-check2-square text-success"></i>';

            default:
                return '<i class="bi bi-circle-fill text-secondary"></i>';
        }
    }
</script>
