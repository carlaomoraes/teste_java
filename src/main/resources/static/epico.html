<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épicos - TaskController 1.0</title>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>

<div class="container">
    <h1>Cadastro de épicos</h1>

    <input type="number" id="idepico" placeholder="ID do épico">

    <input type="text" id="descepico" placeholder="Descrição do épico">

    <input type="text" id="obsepico" placeholder="Observação">

    <label class="checkbox-group">
        <input type="checkbox" id="bloqueado" value="1">🚫 Bloquear ?
    </label>

    <div class="btn-group" data-toggle="buttons-radio">
        <button type="button" class="btn"  onclick="salvarEpico()">Salvar</button>
        <button type="button" class="btn" onclick="listarEpico()">Listar</button>
        <button type="button" class="btn" onclick="buscarEpico()">Buscar por ID</button>
        <button type="button" class="btn" onclick="history.back()">Voltar</button>
    </div>
    <div id="resultado"></div>
</div>

<script>
    const API = 'http://localhost:8080/epicos';
    async function salvarEpico() {
        const idepico = document.getElementById('idepico').value;
        const descepico = document.getElementById('descepico').value;
        const obsepico = document.getElementById('obsepico').value;
        if(document.getElementById('bloqueado').checked) {
            campoBlooqueado = 0;
        }
        else {
            campoBlooqueado = 1;
        }

        const epico = {
            idepico: idepico || null,
            descepico: descepico || null,
            obsepico: obsepico || null,
            bloqueado: campoBlooqueado
        };
        try {
            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(epico)
            });
            const data = await response.json();
            mostrarMensagemNaTela('Épico gravado com sucesso');
            limpaFormulario();
            listarEpico();
        } catch (error) {
            mostrarMensagemNaTela("Erro ao salvar: " + error.message);
        }
    }
    async function buscarEpico() {
        const idepico = document.getElementById('idepico').value;
        try {
            const response = await fetch(`${API}/${idepico}`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Observação</th>
                        <th class="table-header">Bloqueado</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(epico => {
                tabela += `<tr onclick="buscarPorLinha(${epico.idepico})"
                                style="cursor:pointer;">
                                <td>${epico.descepico}</td>
                                <td>${epico.obsepico}</td>
                                <td>${epico.bloqueado} ? '✅ Sim' : '❌ Não'}</td>
                                <td> <button type="button" class="btn" onclick="excluirEpico(${epico.idepico})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao salvar: " + error.message);
        }
    }
    async function listarEpico() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Observação</th>
                        <th class="table-header">Bloqueado</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(epico => {
                tabela += `<tr onclick="buscarPorLinha(${epico.idepico})"
                                style="cursor:pointer;">
                                <td>${epico.idepico}</td>
                                <td>${epico.descepico}</td>
                                <td>${epico.obsepico}</td>
                                <td>${epico.bloqueado ? '✅ Sim' : '❌ Não'}</td>
                                <td> <button type="button" class="btn" onclick="excluirEpico(${epico.idepico})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
                mostrarMensagemNaTela("Erro ao salvar: " + error.message);
        }
    }

    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API}/${id}`);
            const epico = await response.json();
            document.getElementById('idepico').value = epico.idepico;
            document.getElementById('descepico').value = epico.descepico;
            document.getElementById('obsepico').value = epico.obsepico;
            // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
            document.getElementById('bloqueado').checked = epico.bloqueado || 0;

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
    async function excluirEpico(idEpico) {
        try {

            const response = await fetch(`${API}/excluir/${idEpico}`, {
                method: 'DELETE'
            });

            const texto = await response.text();
            document.getElementById('resultado').innerText = texto || 'Épico excluído com sucesso';
            limpaFormulario();
        } catch (error) {
            mostrarMensagemNaTela("Erro ao excluir: " + error.message);
        }
    }
    async function limpaFormulario() {
        document.getElementById('idepico').value = "";
        document.getElementById('descepico').value = "";
        document.getElementById('obsepico').value = "";
        document.getElementById('bloqueado').value = false;
    }
    function mostrarMensagemNaTela(mensagem) {
        const container = document.getElementById("resultado");
        if (container) {
            container.innerHTML = `<p style="color:red;">${mensagem}</p>`;
        } else {
            alert(mensagem);
        }
    }
</script>
</body>
</html>
