<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épicos - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/epico.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<div class="container">
    <h1>Épico - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'geral')">Geral</button>
        <button class="aba-botao" onclick="alternarAba(event, 'estoria')">Estórias</button>
        <button class="aba-botao" onclick="alternarAba(event, 'tarefa')">Tarefas</button>
        <button class="aba-botao" onclick="alternarAba(event, 'equipes')">Equipes</button>
        <button class="aba-botao" onclick="alternarAba(event, 'anexos')">Anexos</button>
    </div>
    <div id="epicos" class="conteudo-aba ativo">
        <input type="number" onblur="buscarPorLinha(document.getElementById('idepico').value)" name="idepico" id="idepico" placeholder="ID do épico (Deixe vazio para novo)">
        <div class="form-grid">
            <div>
                <label>Nome</label>
                <input type="text" id="nomeepico" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Código</label>
                <input type="text" id="codigo" oninput="converterMaiusculo(this)" maxlength="10">
            </div>
            <div>
                <label>Status</label>
                <select id="comboStatus">
                    <option value="">-- Selecione o status --</option>
                </select>
            </div>
            <div>
                <label>Empreendimento</label>
                <select id="comboEmpreendimento">
                    <option value="">-- Selecione o empreendimento --</option>
                </select>
            </div>
            <div>
                <label>Pioridade</label>
                <select id="comboPrioridade">
                    <option value="">-- Selecione prioridade --</option>
                </select>
            </div>
            <div>
                <label>Gestor</label>
                <select id="comboGestor">
                    <option value="">-- Selecione o gestor --</option>
                </select>
            </div>
            <div>
                <label>Data inicial</label>
                <input type="date" id="data_inicio">
            </div>
            <div>
                <label>Data final prevista</label>
                <input type="date" id="data_fim">
            </div>
            <div>
                <label for="cor">Cor de identificação do épico</label>
                <input type="color" id="cor" value="#2196F3">
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="bloqueado" value="0"> Épico bloqueado
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-salvar" onclick="salvarEpico();">Salvar</button>
            <button type="button" class="btn btn-listar"  onclick="listarEpicos()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado"></div>
    </div>
    <div id="equipes" class="conteudo-aba">
        <div class="membros-container">
            <div class="membros-coluna">
                <h2>Equipes disponíveis</h2>
                <div id="equipesDisponiveis"  class="membros-lista-custom"></div>
            </div>

            <div class="membros-acoes">
                <button type="button" class="btn btn-add" onclick="adicionarMembro()">
                    Adicionar <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button type="button" class="btn btn-remove" onclick="removerMembro()">
                    <i class="fa-solid fa-arrow-left"></i> Remover
                </button>
            </div>

            <div class="membros-coluna">
                <h2>Equipes vinculadas</h2>
                <div id="equipesVinculadas" class="membros-lista-custom"></div>
            </div>
        </div>
    </div>
</div>
<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';
    const API_EPICO = 'http://localhost:8080/epicos';
    const API_STATUS = 'http://localhost:8080/status_entidades';
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_PRIORIDADE = 'http://localhost:8080/prioridade';


    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarGestor() {
        const comboGestor = document.getElementById("comboGestor");
        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idusuario;
                opcao.textContent = usuario.nome;
                comboGestor.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar gestor: "+error.message,"error");
        }
    }
    async function carregarPrioridade() {
        const comboGestor = document.getElementById("comboPrioridade");
        try {
            const resposta = await fetch(`${API_PRIORIDADE}/listar`);
            const prioridades = await resposta.json();
            prioridades.forEach(prioridade => {
                const opcao = document.createElement('option');
                opcao.value = prioridade.idprioridade;
                opcao.textContent = prioridade.descprioridade;
                comboGestor.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar prioridade: "+error.message,"error");
        }
    }
    async function carregarStatus() {
        const comboStatus = document.getElementById("comboStatus");
        try {
            const resposta = await fetch(`${API_STATUS}/listar`);
            const vetor = await resposta.json();
            vetor.forEach(i => {
                const opcao = document.createElement('option');
                opcao.value = i.idstatus;
                opcao.textContent = i.descstatus;
                comboStatus.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar status: " + error.message, "error");
        }
    }
    async function carregarEmpreendimento() {
        const comboE = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const empreendimentos = await resposta.json();
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboE.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar empreendimento: "+error.message,"error");
        }
    }
    function formatarData(data) {
        if (!data) return "";

        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
    }
    function converterMaiusculo(campo) {
        campo.value = campo.value.toUpperCase();
    }

    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarEmpreendimento();
        carregarGestor();
        carregarStatus();
        carregarPrioridade();
    });
    async function salvarEpico() {
        const idepico = document.getElementById('idepico').value;
        const descepico = document.getElementById('descepico').value;
        const obsepico = document.getElementById('obsepico').value;
        if(document.getElementById('bloqueado').checked) {
            campoBlooqueado = 0;
        }
        else {
            campoBlooqueado = 1;
        }
        const data_inicio = document.getElementById('data_inicio').value;
        const data_fim = document.getElementById('data_fim').value;
        const epico = {
            idepico: Number(idepico) || null,
            descepico: descepico || null,
            obsepico: obsepico || null,
            bloqueado: campoBlooqueado,
            data_inicio: data_inicio,
            data_fim: data_fim,
        };
        try {
            const response = await fetch(`${API_EPICO}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(epico)
            });
            const data = await response.json();
            mostrarMensagemNaTela("Épico salvo com sucesso! ","success");
            setTimeout(() => {
                limparCampos();
                listarEpicos();
            }, 1000);

        } catch (error) {
            mostrarMensagemNaTela("Erro ao salvar épico: "+error.message,"error");
        }
    }
    async function listarEpicos() {
        cor = "6c757d";
        try {
            const response = await fetch(`${API_EPICO}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">% Concluído</th>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header">Código</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(epico => {
                cor = corHexValida(epico.cor) ? epico.cor : "#6c757d";
                tabela += `<tr onclick="buscarPorLinha(${epico.idepico})"
                                style="cursor:pointer;">
                          <td>${montarProgresso(epico.percentual)}</td>
                           <td style="border-left:8px solid ${cor};">
                              ${epico.idepico}</td>
                                <td>${epico.nome}</td>
                                <td>${epico.codepico}</td>
                                <td>${epico.status.descstatus}</td>
                                <td>${formatarData(epico.data_inicio)}</td>
                                <td>${formatarData(epico.data_fim_prevista)}</td>
                                <td> <button type="button" class="btn" onclick="excluirEpico(${epico.idepico})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao listar épicos: " + error.message,"error");
        }
    }

    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API_EPICO}/${id}`);
            const epico = await response.json();
            if(!response.ok) {
                mostrarMensagemNaTela(epico.mensagem,"error");
            } else {
                document.getElementById('idepico').value = epico.idepico;
                document.getElementById('nomeepico').value = epico.nome;
                document.getElementById('codigo').value = epico.codepico;
                document.getElementById('cor').value = corHexValida(epico.cor) ? epico.cor : "#6c757d";
                // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                document.getElementById('bloqueado').checked = epico.bloqueado || 0;
                // CARREGANDO OS COMBOS
                document.getElementById('comboStatus').value = epico.status.idstatus;
                document.getElementById('comboEmpreendimento').value = epico.empreendimento.idempreendimento;
                document.getElementById('comboPrioridade').value = epico.prioridade.idprioridade;
                document.getElementById('comboPrioridade').value = epico.prioridade.idprioridade;
                document.getElementById('comboGestor').value = epico.responsavel.idusuario;
                document.getElementById('data_inicio').value = epico.data_inicio;
                document.getElementById('data_fim').value = epico.data_fim_prevista;


            }
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar épico: "+error.message,"error");
        }
    }
    async function excluirEpico(idEpico) {
        try {
            const response = await fetch(`${API_EPICO}/excluir/${idEpico}`, {
                method: 'DELETE'
            });
            mostrarMensagemNaTela("Épico excluído com sucesso", "success");
            limpaFormulario();
        } catch (error) {
            mostrarMensagemNaTela("Erro ao excluir: " + error.message, "error");
        }
    }
    async function limpaFormulario() {
        document.getElementById('idepico').value = "";
        document.getElementById('nomeepico').value = "";
        document.getElementById('codigo').value = "";
        document.getElementById('cor').value = "";
        document.getElementById('bloqueado').checked = false;
    }
    function montarProgresso(percentual) {
        percentual = Number(percentual) || 0;

        let cor = "#dc3545"; // vermelho

        if (percentual >= 100) {
            cor = "#198754";
        } else if (percentual >= 75) {
            cor = "#20c997";
        } else if (percentual >= 50) {
            cor = "#ffc107";
        } else if (percentual >= 25) {
            cor = "#fd7e14";
        }

        return `
        <div class="progresso-grid">
            <div class="barra">
                <div class="preenchimento"
                     style="width:${percentual}%; background:${cor};">
                </div>
            </div>
            <span>${percentual}%</span>
        </div>
    `;
    }
</script>
</body>
</html>
