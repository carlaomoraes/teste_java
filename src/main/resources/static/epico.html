<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Épicos</title>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>

<div class="container">
    <h1>CRUD Épico - Spring Boot</h1>

    <input type="number" id="idepico" placeholder="ID do épico">

    <input type="text" id="descepico" placeholder="Descrição do épico">

    <input type="text" id="obsepico" placeholder="Observação">

    <button class="salvar" onclick="salvarEpico()">Salvar</button>

    <button class="listar" onclick="listarEpico()">Listar</button>

    <button class="buscar" onclick="buscarEpico()">Buscar por ID</button>

    <button class="voltar" onclick="history.back()">Voltar</button>

    <div id="resultado"></div>
</div>

<script>

    const API = 'http://localhost:8080/epico';

    async function salvarEpico() {
        const idepico = document.getElementById('idepico').value;
        const descepico = document.getElementById('descepico').value;
        const obsepico = document.getElementById('obsepico').value;
        
        const epico = {
            idepico: idepico || null,
            descepico: descepico,
            obsepico: obsepico
        };

        try {

            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(epico)
            });

            const data = await response.json();

            document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);
            limpaFormulario();
            listarUsuarios();

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
    async function buscarEpico() {

        const idepico = document.getElementById('idepico').value;

        try {
            const response = await fetch(`${API}/${idepico}`);
            const data = await response.json();

            let tabela = `
            <table border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Observação</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;

            data.forEach(epico => {

                tabela += `<tr onclick="buscarPorLinha(${epico.idepico})"
                                style="cursor:pointer;">
                                <td>${epico.descepico}</td>
                                <td>${epico.obsepico}</td>
                                <td> <button class="excluir" onclick="excluirUsuario(${epico.idepico})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;

            document.getElementById('resultado').innerHTML = tabela;

        } catch (error) {
            document.getElementById('resultado').innerHTML =
                `<p style="color:red;">Erro ao buscar épico</p>`;
        }

    }
    async function listarEpico() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();
            let tabela = `
            <table border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição do épico</th>
                        <th>Observação do épico</th>
                         <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(epico => {
                tabela += `<tr onclick="buscarPorLinha(${epico.idepico})"
                                style="cursor:pointer;">
                                <td>${epico.idepico}</td>
                                <td>${epico.descepico}</td>
                                <td>${epico.obsepico}</td>
                                <td> <button class="excluir" onclick="excluirEpico(${epico.idepico})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            document.getElementById('resultado').innerHTML =
                `<p style="color:red;">Erro ao listar épicos</p>`;
        }
    }

    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API}/${id}`);
            const epico = await response.json();
            document.getElementById('idepico').value = epico.idepico;
            document.getElementById('descepico').value = epico.descepico;
            document.getElementById('obsepico').value = epico.obsepico;
        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
    async function excluirEpico(idEpico) {
        try {

            const response = await fetch(`${API}/excluir/${idEpico}`, {
                method: 'DELETE'
            });

            const texto = await response.text();

            document.getElementById('resultado').innerText = texto || 'Épico excluído com sucesso';
            limpaFormulario();
        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
    async function limpaFormulario() {
        document.getElementById('idepico').value = "";
        document.getElementById('descepico').value = "";
        document.getElementById('obsepico').value = "";

    }

</script>

</body>
</html>
