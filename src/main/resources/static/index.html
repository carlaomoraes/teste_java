<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskController 1.0</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/configuracao.css">
</head>

<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow p-4 login-container" style="max-width:420px;width:100%;">

        <div class="text-center mb-4">
            <h2>TaskController 1.0</h2>
            <p class="text-muted">
                Insira suas credenciais para acessar o sistema
            </p>
        </div>

        <form id="formLogin" onsubmit="realizarLogin(event)">

            <div class="mb-3">
                <label for="login" class="form-label">
                    Usuário / Login
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                            type="text"
                            class="form-control"
                            id="login"
                            name="login"
                            placeholder="Digite seu login"
                            autocomplete="username"
                            required>
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">
                    Senha
                </label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i>
                Entrar no Sistema
            </button>

        </form>

        <div id="mensagem"
             class="text-center mt-3"
             role="alert">
        </div>

    </div>

</div>

<script>

    const API_AUTH = "http://localhost:8080/taskboard/login";

    async function realizarLogin(event){

        event.preventDefault();

        const login = document.getElementById("login").value.trim();
        const senha = document.getElementById("senha").value;

        const mensagem = document.getElementById("mensagem");

        mensagem.className = "text-secondary mt-3";
        mensagem.innerHTML = "Autenticando...";

        const dadosLogin = {
            idusuario: 0,
            nome: "",
            login,
            senha
        };

        try{

            const response = await fetch(API_AUTH,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(dadosLogin)
            });

            if(response.ok){

                const usuario = await response.json();

                sessionStorage.setItem("usuarioNome", usuario.nome);
                sessionStorage.setItem("usuarioIdUsuario", usuario.idUsuario);
                sessionStorage.setItem("usuarioLogin", usuario.login);

                // Não grave a senha no navegador
                // sessionStorage.setItem("usuarioSenha", usuario.senha);

                if(usuario.alterasenha == 1){

                    mensagem.className = "text-warning mt-3";
                    mensagem.innerHTML = "Redirecionando para alteração de senha...";

                    setTimeout(()=>{
                        window.location.href="trocasenha.html";
                    },1500);

                }else{

                    mensagem.className = "text-success mt-3";
                    mensagem.innerHTML = `Bem-vindo, ${usuario.nome}!`;

                    setTimeout(()=>{
                        window.location.href="home.html";
                    },1500);
                }

            }else{

                const erro = await response.text();

                mensagem.className = "text-danger mt-3";
                mensagem.innerHTML = erro || "Usuário ou senha inválidos.";

            }

        }catch(e){

            mensagem.className = "text-danger mt-3";
            mensagem.innerHTML = "Erro ao conectar com o servidor.";

        }

    }

</script>

</body>
</html>
