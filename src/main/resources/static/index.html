<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskController 1.0</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="login-container">
    <h1>TaskController 1.0</h1>
    <p class="subtitle">Insira suas credenciais para acessar o sistema</p>

    <form id="formLogin" onsubmit="realizarLogin(event)">
        <label for="login">Usuário / Login:</label>
        <input type="text" id="login" placeholder="Digite seu login" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="btn-entrar">Entrar no Sistema</button>
    </form>

    <div id="mensagem"></div>
</div>

<script>
    const API_AUTH = 'http://localhost:8080/taskboard/login';

    async function realizarLogin(event) {
        // Evita que a página recarregue ao submeter o formulário
        event.preventDefault();

        const loginVal = document.getElementById("login").value;
        const senhaVal = document.getElementById("senha").value;
        const idusuarioVal = 0;
        const nomeVal = "";

        const msgContainer = document.getElementById("mensagem");

        msgContainer.style.color = "#64748b";
        msgContainer.innerText = "Autenticando...";

        // Monta os dados para validação

        const dadosLogin = {
            login: loginVal,
            senha: senhaVal,
            nome: nomeVal,
            idusuario: idusuarioVal
        };
        try {
            const response = await fetch(API_AUTH, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosLogin)
            });
            if (response.ok) {
                const usuarioLogado = await response.json();
                sessionStorage.setItem("usuarioNome", usuarioLogado.nome);
                sessionStorage.setItem("usuarioIdUsuario", usuarioLogado.idUsuario);
                sessionStorage.setItem("usuarioLogin", usuarioLogado.login);
                sessionStorage.setItem("usuarioSenha", usuarioLogado.senha);
                if (usuarioLogado.alterasenha == 1) {
                    // abre formulario de alterar senha
                    msgContainer.style.color = "#64748b";
                    msgContainer.innerText = "Abrindo formulário para alterar a senha...";
                    setTimeout(() => {
                        window.location.href = "trocasenha.html";
                    }, 1500);
                }
                else {
                    msgContainer.style.color = "green";
                    msgContainer.innerText = `Sucesso! Bem-vindo, ${usuarioLogado.nome}.`;

                    // Guarda temporariamente o nome do usuário para usar no sistema se quiser
                    sessionStorage.setItem("usuarioNome", usuarioLogado.nome);

                    // Redireciona para a tela do Menu Principal (index.html) após 1.5 segundos
                    setTimeout(() => {
                        window.location.href = "home.html";
                    }, 1500);
                }
            } else {
                const textoErro = await response.text();
                msgContainer.style.color = "red";
                msgContainer.innerText = "⚠️ " + (textoErro || "Usuário ou senha inválidos.");
            }

        } catch (error) {
            msgContainer.style.color = "red";
            msgContainer.innerText = "⚠️ Erro ao conectar com o servidor.";
        }
    }
</script>
</body>
</html>
