<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Estórias</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="container">
    <h1>CRUD Épico - Spring Boot</h1>

    <input type="number" id="idestoria" placeholder="ID da estória">

    <input type="text" id="descestoria" placeholder="Descrição da estória">

    <select name="comboepico" id="comboepico">
        <option value="">Selecione um Épico</option>
    </select>
    <script>
        async function carregarEpicos() {
            const comboEpico = document.querySelector("#comboepico")
            try {
                const resposta = await fetch(`${API_EPICOS}/listar`);
                const epicos = await resposta.json();
                epicos.forEach(epico => {
                    const opcao = document.createElement('option');
                    opcao.value = epico.idEpico;
                    opcao.textContent = epico.descepico;
                    comboEpico.appendChild(opcao);
                });
            } catch (error) {
                document.getElementById('resultado').innerText = error;
            }
        }
        //Executa a função quando carrega a página
        document.addEventListener('DOMContentLoaded', carregarEpicos)
    </script>
    <select name="comboCriador" id="comboCriador">
        <option value="">Selecione um usuário criador</option>
    </select>
    <script>
        async function carregarUsuario() {
            const comboCriador = document.querySelector("#comboCriador");
            try {
                const resposta = await fetch(`${API_USUARIOS}/listar`);
                const criador = await resposta.json();
                criador.forEach(criador => {
                    const opcao = document.createElement('option');
                    opcao.value = criador.idusuario;
                    opcao.textContent = criador.nome;
                    comboCriador.appendChild(opcao);
                });
            } catch (error) {
                document.getElementById('resultado').innerText = error;
            }
        }
        //Executa a função quando carrega a página
        document.addEventListener('DOMContentLoaded', carregarUsuario)
    </script>
    <select name="comboResponsavel" id="comboResponsavel">
        <option value="">Selecione um usuário responsavel</option>
    </select>
    <script>
        async function carregarUsuario() {
            const comboResponsavel = document.querySelector("#comboResponsavel");
            try {
                const resposta = await fetch(`${API_USUARIOS}/listar`);
                const criador = await resposta.json();
                criador.forEach(criador => {
                    const opcao = document.createElement('option');
                    opcao.value = criador.idusuario;
                    opcao.textContent = criador.nome;
                    comboResponsavel.appendChild(opcao);
                });
            } catch (error) {
                document.getElementById('resultado').innerText = error;
            }
        }
        //Executa a função quando carrega a página
        document.addEventListener('DOMContentLoaded', carregarUsuario)
    </script>

    <button class="salvar" onclick="salvarEstoria()">Salvar</button>

    <button class="listar" onclick="listarEstoria()">Listar</button>

    <button class="buscar" onclick="buscarEstoria()">Buscar por ID</button>

    <button class="excluir" onclick="excluirEstoria()">Excluir</button>

    <button class="voltar" onclick="history.back()">Voltar</button>

    <div id="resultado"></div>
</div>

<script>

    const API = 'http://localhost:8080/estoria';
    const API_EPICOS = 'http://localhost:8080/epico';
    const API_USUARIOS = 'http://localhost:8080/usuarios';

    async function salvarEstoria() {
        const idEstoria = document.getElementById('iduEstoria').value;
        const descEstoria = document.getElementById('descEstoria').value;
        const idEpico = document.getElementById('idepico').value;
        const idResponsavel = document.getElementById('responsavel').value;
        const idCriador = document.getElementById('criador').value;
        const Estoria = {
            idEstoria: idEstoria || null,
            descEstoria: descEstoria,
            idEpico: idEpico,
            idResponsavel: idResponsavel,
            idCriador: idCriador
        };

        try {
            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(Estoria)
            });
            const data = await response.json();
            document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
    async function buscarEstoria() {
        const idEstoria = document.getElementById('idEstoria').value;
        try {
            const response = await fetch(`${API}/${idEstoria}`);
            const data = await response.json();
            let tabela = `
            <table border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição da estoria</th>
                        <th>Épico</th>
                        <th>Criador</th>
                        <th>Responsável</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(estoria => {
                tabela += `<tr onclick="buscarPorLinha(${estoria.idEstoria})" style="cursor:pointer;">
                                <th>${estoria.idEstoria}</th>
                                <td>${estoria.descEstoria}</td>
                                <td>&nbsp;</td>
                                <td>&nbsp;</td>
                                <td>&nbsp;</td>
                                <td> <button class="excluir" onclick="excluirEstoria(${estoria.idEstoria})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            document.getElementById('resultado').innerHTML =
                `<p style="color:red;">Erro ao buscar estória</p>`;
        }
    }
    async function listarEstoria() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();
            let tabela = `
            <table border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição da estoria</th>
                        <th>Épico</th>
                        <th>Criador</th>
                        <th>Responsável</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(estoria => {
                tabela += `<tr onclick="buscarPorLinha(${estoria.idEstoria})" style="cursor:pointer;">
                                <th>${estoria.idEstoria}</th>
                                <td>${estoria.descEstoria}</td>
                                <td>&nbsp;</td>
                                <td>&nbsp;</td>
                                <td>&nbsp;</td>
                                <td> <button class="excluir" onclick="excluirEstoria(${estoria.idEstoria})">Excluir</button></td>
            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            document.getElementById('resultado').innerHTML =
                `<p style="color:red;">Erro ao listar estórias</p>`;
        }
    }
    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API}/${id}`);
            const Estoria = await response.json();
            document.getElementById('idEstoria').value = Estoria.idEstoria;
            document.getElementById('descEstoria').value = Estoria.descEstoria;
            document.getElementById('idepico').value = Estoria.idEpico;
            document.getElementById('idcriador').value = Estoria.idCriador;
            document.getElementById('idrespnsavel').value = Estoria.idResponsavel;
        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
    async function excluirEstoria() {
        const idEstoria = document.getElementById('idEstoria').value;
        try {
            const response = await fetch(`${API}/excluir/${idEstoria}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            document.getElementById('resultado').innerText = texto || 'Estória excluída com sucesso';

        } catch (error) {
            document.getElementById('resultado').innerText = error;
        }
    }
</script>

</body>
</html>
