<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/sprintatual.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<script src="js/utils/mensagens.js"></script>
<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Cadastro de Item do Backlog</h5>
        </div>

        <div class="card-body">

            <form id="frmBacklog">

                <input type="hidden" id="idestoria">

                <div class="row">

                    <div class="col-md-8 mb-3">
                        <label class="form-label">Título *</label>
                        <input type="text"
                               id="descestoria"
                               class="form-control"
                               maxlength="200"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Épico *</label>
                        <select id="comboEpico"
                                class="form-select"
                                required>
                        </select>
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea id="descricao"
                              class="form-control"
                              rows="5"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Critérios de Aceite</label>
                    <textarea id="criteriosAceite"
                              class="form-control"
                              rows="4"></textarea>
                </div>

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Prioridade *</label>
                        <select id="comboPrioridade"
                                class="form-select">

                            <option value="1">Muito Alta</option>
                            <option value="2">Alta</option>
                            <option value="3">Média</option>
                            <option value="4">Baixa</option>

                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Story Points *</label>
                        <select id="storypoints"
                                class="form-select">

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>5</option>
                            <option>8</option>
                            <option>13</option>
                            <option>21</option>

                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Responsável</label>
                        <select id="comboResponsavel"
                                class="form-select">
                        </select>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tags</label>
                        <input type="text"
                               id="tags"
                               class="form-control"
                               placeholder="Ex.: API, Login, Financeiro">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Observações</label>
                        <input type="text"
                               id="observacao"
                               class="form-control">
                    </div>

                </div>

            </form>

        </div>

        <div class="card-footer text-end">

            <button class="btn btn-secondary">
                Cancelar
            </button>

            <button class="btn btn-success"
                    onclick="salvarBacklog()">
                Salvar
            </button>

        </div>

    </div>

</div>
<script>

</script>
</body>
</html>
