<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/backlog.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>

<body>
<script src="js/funcoes.js"></script>
<script src="js/mensagens.js"></script>

<div class="container mt-4">

    <h1>Backlog - TaskController 1.0</h1>

    <!-- ABAS -->
    <div class="abas-container">
        <button class="aba-botao ativa"
                onclick="alternarAba(event, 'backlog')">
            Backlog
        </button>

        <button class="aba-botao"
                onclick="alternarAba(event, 'roadmap')">
            Roadmap
        </button>
    </div>


    <!-- EMPREENDIMENTO -->
    <div class="row mb-4">
        <div class="col-md-4">
            <label class="form-label">
                Empreendimento *
            </label>

            <select id="comboEmpreendimento"
                    class="form-select"
                    required>
            </select>
        </div>
    </div>


    <!-- ========================================================= -->
    <!-- ABA BACKLOG                                               -->
    <!-- ========================================================= -->

    <div id="backlog" class="conteudo-aba ativo">

        <form id="frmBacklog">
            <!-- DESCRIÇÃO -->
            <div class="mb-3">
                <label for="descestoria" class="form-label">
                    Estória
                </label>

                <input type="text"
                       id="descestoria"
                       class="form-control"
                       oninput="converterMaiusculo(this)">
            </div>


            <!-- RESPONSÁVEL -->
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="comboResponsavel" class="form-label"> Responsável  </label>
                    <select id="comboResponsavel" class="form-select"></select>
                </div>
                <!-- PRIORIDADE -->
                <div class="col-md-3 mb-3">
                    <label for="comboPrioridades" class="form-label">Prioridade *</label>
                    <select id="comboPrioridades" class="form-select"></select>
                </div>
                <!-- STORY POINTS -->
                <div class="col-md-3 mb-3">
                    <label for="combostorypoints" class="form-label">Story Points * </label>
                    <select id="combostorypoints" class="form-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="5">5</option>
                        <option value="8">8</option>
                        <option value="13">13</option>
                        <option value="21">21</option>
                    </select>
                </div>
            </div>
            <!-- HORAS + RESUMO -->
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="horas_estimadas"  class="form-label">Horas estimadas </label>
                    <input type="number"id="horas_estimadas" class="form-control text-end" min="0" step="1.0">
                    <label class="form-label">Sprint</label>
                    <select id="comboSprint" class="form-select">  </select>
                </div>

                <div class="col-md-9 mb-3">

                    <label for="resumo"
                           class="form-label">
                        Resumo
                    </label>

                    <input type="text"
                           id="resumo"
                           class="form-control">

                </div>

            </div>

        </form>


        <!-- BOTÕES -->
        <div class="btn-group">

            <button type="button"
                    class="btn btn-salvar"
                    onclick="salvarBacklog()">
                Salvar
            </button>
            <button type="button" class="btn btn-listar" onclick="cancelarEdicao(document.getElementById('comboEmpreendimento').value);">Cancelar</button>

            <button type="button"
                    class="btn btn-voltar"
                    onclick="history.back()">
                Voltar
            </button>

        </div>
        <!-- RESULTADO -->
        <div class="card-footer text-end mt-3">

            <div id="resultado"></div>

        </div>


    </div>


    <!-- ========================================================= -->
    <!-- ABA ROADMAP                                               -->
    <!-- ========================================================= -->

    <div id="roadmap"
         class="conteudo-aba">

        <div id="resultadoRoadmap">

            <div class="text-center text-muted py-5">
                Selecione um empreendimento para visualizar o roadmap.
            </div>

        </div>
    </div>
</div>
</body>
</html>
<script>
    const API = 'http://localhost:8080/backlog';
    const API_EMPREENDIMENTO ='http://localhost:8080/empreendimento';
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_EPICO = 'http://localhost:8080/epicos';
    const API_PRIORIDADE = 'http://localhost:8080/prioridade';
    const API_SPRINT = 'http://localhost:8080/sprints';

    let configuracao = {
        idepico: 0,
        idestoria: 0,
        idtarefa: 0
    };

    // ==============================================================
    // CARREGAR COMBOS
    // ==============================================================
    async function carregarEmpreendimento() {
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/montaComboEmpreendimento`);
            const empreendimentos = await resposta.json();
            comboEmpreendimento.innerHTML = '<option value="">Selecione...</option>';
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimento.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela( "resultado",MSG.erroCarregar("EMPREENDIMENTO"), "error");
        }
    }
    async function carregarGestor() {
        const comboResponsavel = document.getElementById("comboResponsavel");
        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idusuario;
                opcao.textContent = usuario.nome;
                comboResponsavel.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado", "Erro ao carregar gestor: "+error.message,"error");
        }
    }
    async function carregarPrioridade() {
        const comboPrioridades = document.getElementById("comboPrioridades");
        try {
            const resposta = await fetch(`${API_PRIORIDADE}/listar`);
            const prioridades = await resposta.json();
            prioridades.forEach(prioridade => {
                const opcao = document.createElement('option');
                opcao.value = prioridade.idprioridade;
                opcao.textContent = prioridade.descprioridade;
                comboPrioridades.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado", MSG.erroCarregar("PRIORIDADES"), "error");
        }
    }
    async function carregarSprint(idempreendimento) {
        const comboSprint = document.getElementById("comboSprint");
        try {
            const Caminho = `${API_SPRINT}/carregaSprint/DTO/${idempreendimento}`;
            console.log(Caminho);
            const resposta = await fetch(Caminho);
            const sprint = await resposta.json();
            comboSprint.innerHTML = '<option value="">Selecione...</option>';
            sprint.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idsprint;
                opcao.textContent = e.descsprint;
                comboSprint.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela( "resultado",MSG.erroCarregar("SPRINT"), "error");
        }
    }
    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }

    // ==============================================================
    // INICIALIZAÇÃO
    // ==============================================================
    document.addEventListener('DOMContentLoaded',() => {
            carregarEmpreendimento();
            carregarGestor();
            carregarPrioridade();
        }
    );
    // 2. Attach the 'change' event listener
    comboEmpreendimento.addEventListener('change', (event) => {
        // Get the selected option's value
        const selectedValue = event.target.value;
        cancelarEdicao(selectedValue);
    });

    async function cancelarEdicao(idEmpreendimento) {
        await montaBacklog(idEmpreendimento);
        await montarRoadmap(idEmpreendimento);
        await carregarSprint(idEmpreendimento);
        await limparFormulario();
    }
    async function limparFormulario() {
        configuracao.idepico = 0;
        configuracao.idestoria = 0;
        configuracao.idtarefa = 0;
        document.getElementById('descestoria').value = "";
        // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
        document.getElementById('resumo').value = "";
        document.getElementById('combostorypoints').value = "";
        document.getElementById('horas_estimadas').value = 0;
        //CARREGANDO OS COMBOS
        document.getElementById('comboResponsavel').value = 0;
        document.getElementById('comboSprint').value = 0;
        document.getElementById('comboPrioridades').value = 0;

    }
    async function montarRoadmap(idEmpreendimento) {
        if (Number(idEmpreendimento) === 0) {
            mostrarMensagemNaTela("resultado","Selecione o empreendimento!","warning");
            return;
        }
        try {
            const response = await fetch(`${API}/${idEmpreendimento}/roadmap`);
            const data = await response.json();
            let tabela = `
            <table class="table roadmap-table">
                <thead>
                    <tr>
                        <th class="ordem-header"</th>
                        <th>Sprint</th>
                        <th>Período</th>
                        <th>Épico</th>
                        <th>Estória</th>
                        <th>Prioridade</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="tbodyRoadmap">
        `;

            data.forEach(roadmap => {

                const cor = corHexValida(roadmap.corepico)
                    ? roadmap.corepico
                    : "#6c757d";

                tabela += `
                <tr>
                     <td class="ordem-coluna">
                        <i class="bi bi-grip-vertical ordem-icon"></i>
                    </td>
                    <td>
                        <div class="sprint-info">
                            <strong>Sprint ${roadmap.idsprint}</strong>
                            <span>${roadmap.descsprint}</span>
                        </div>
                    </td>

                    <td>
                        <div class="periodo-sprint">
                            <span>${formatarData(roadmap.dtiniciosprint)}</span>
                            <i class="bi bi-arrow-right"></i>
                            <span>${formatarData(roadmap.dtfinalsprint)}</span>
                        </div>
                    </td>

                    <td>
                        <span class="epico-roadmap"
                              style="background-color: ${cor};">
                            ${roadmap.nome}
                        </span>
                    </td>

                    <td>
                        <div class="estoria-roadmap">
                            ${roadmap.descestoria}
                        </div>
                    </td>
                    <td> <span class="badge" style="background-color:${roadmap.corprioridade}; color:white;">
                            ${roadmap.descprioridade}</span></td>
                    <td>
                          <button type="button" class="btn btn-remove" onclick="excluirRoadmap(${roadmap.idsprint}, ${roadmap.idestoria})">
                             Voltar ao backlog</button>
                    </td>

                </tr>
            `;
            });
            tabela += `</tbody></table>`;
         document.getElementById("resultadoRoadmap").innerHTML = tabela;
         ativarDragDropRoadmap();
        } catch (error) {
            console.error(error);
            mostrarMensagemNaTela("resultadoRoadmap",MSG.errolistar("ROADMAP"),"error");
        }
    }
    function ativarDragDropRoadmap() {
        const linhas = document.querySelectorAll(".roadmap-row");
        let linhaArrastada = null;
        linhas.forEach(linha => {
            linha.addEventListener("dragstart", function (event) {
                linhaArrastada = this;
                this.classList.add("arrastando");
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData(
                    "text/plain",
                    this.dataset.idestoria
                );
            });
            linha.addEventListener("dragend", function () {
                this.classList.remove("arrastando");
                document.querySelectorAll(".roadmap-row").forEach(row => {
                        row.classList.remove("drag-over");
                    });
                linhaArrastada = null;
            });
            linha.addEventListener("dragover", function (event) {
                event.preventDefault();
                if (!linhaArrastada) {
                    return;
                }
                // Não permite trocar entre Sprints
                if(this.dataset.idsprint !== linhaArrastada.dataset.idsprint) {
                    return;
                }
                this.classList.add("drag-over");
                const tbody = this.parentNode;
                const rect = this.getBoundingClientRect();
                const posicao = event.clientY - rect.top;
                if (posicao > rect.height / 2) {
                    tbody.insertBefore(linhaArrastada, this.nextSibling);
                } else {
                    tbody.insertBefore(linhaArrastada,this);
                }
                this.classList.remove("drag-over");
            });
            linha.addEventListener("drop", function (event) {
                event.preventDefault();
                if (!linhaArrastada) {
                    return;
                }
                if (this.dataset.idsprint !==  linhaArrastada.dataset.idsprint) {
                    return;
                }
                salvarOrdemSprint(linhaArrastada.dataset.idsprint);
            });
        });
    }
    function ativarDragDropBacklog() {
        const linhas = document.querySelectorAll(".backlog-row");
        let linhaArrastada = null;
        linhas.forEach(linha => {
            linha.addEventListener("dragstart", function (event) {
                linhaArrastada = this;
                this.classList.add("arrastando");
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData(
                    "text/plain",
                    this.dataset.idestoria
                );
            });
            linha.addEventListener("dragend", function () {
                this.classList.remove("arrastando");
                document.querySelectorAll(".backlog-row").forEach(row => {
                    row.classList.remove("drag-over");
                });
                linhaArrastada = null;
            });
            linha.addEventListener("dragover", function (event) {
                event.preventDefault();
                if (!linhaArrastada) {
                    return;
                }
                // Não permite trocar entre Sprints
                if(this.dataset.idsprint !== linhaArrastada.dataset.idsprint) {
                    return;
                }
                this.classList.add("drag-over");
                const tbody = this.parentNode;
                const rect = this.getBoundingClientRect();
                const posicao = event.clientY - rect.top;
                if (posicao > rect.height / 2) {
                    tbody.insertBefore(linhaArrastada, this.nextSibling);
                } else {
                    tbody.insertBefore(linhaArrastada,this);
                }
                this.classList.remove("drag-over");
            });
            linha.addEventListener("drop", function (event) {
                event.preventDefault();
                if (!linhaArrastada) {
                    return;
                }
                if (this.dataset.idsprint !==  linhaArrastada.dataset.idsprint) {
                    return;
                }
                salvarOrdemSprint(linhaArrastada.dataset.idsprint);
            });
        });
    }
    async function salvarOrdemSprint(idSprint) {
        const linhas = document.querySelectorAll(`.roadmap-row[data-idsprint="${idSprint}"]`);
        const lista = [];
        linhas.forEach((linha, index) => {
            lista.push({
                idestoria: Number(linha.dataset.idestoria),
                ordem: index + 1
            });
        });
        try {
            const response = await fetch(`${API}/reordenar`,{
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(lista)
                }
            );
            if (!response.ok) {
                throw new Error("Erro ao salvar a ordem.");
            }
        } catch (error) {
            console.error(error);
            mostrarMensagemNaTela("resultadoRoadmap","Erro ao salvar a ordem das estórias.","error");
        }
    }
    async function montaBacklog(idEmpreendimento) {
        if(Number(idEmpreendimento) === 0){
            mostrarMensagemNaTela("resultado", "Selecione o empreendimento!", "warning");
            return;
        }
        let tabela = ``;
        try {
            const response = await fetch(`${API}/${idEmpreendimento}`);
            const data = await response.json();
            tabela = ` <table class="table roadmap-table" border="1" width="100%" cellspacing="0" cellpadding="10">
             <thead>
                    <tr>
                        <th class="ordem-header"</th>
                        <th>Estória</th>
                        <th>Status</th>
                        <th>Criador</th>
                        <th>Responsável</th>
                        <th>Nome do Épico</th>
                        <th>Prioridade</th>
                    </tr>
                </thead>
            <tbody id="tbodyBacklog">`;
            data.forEach(backlog => {
                const cor = corHexValida(backlog.corepico) ? backlog.corepico : "#6c757d";
                tabela += `<tr onclick="buscarPorLinha(${backlog.idepico},${backlog.idestoria})"
                                style="cursor:pointer;">
                                <td class="ordem-coluna">
                                    <i class="bi bi-grip-vertical ordem-icon"></i>
                                </td>
                                <td><div class="sprint-info">
                                    <strong>${backlog.descestoria}</strong>
                                    </div>
                                </td>
                                <td><div class="estoria-roadmap">${backlog.descstatus}</div></td>
                                <td><div class="estoria-roadmap">${backlog.nomecriador}</div></td>
                                <td><div class="estoria-roadmap">${backlog.nomeresponsavel}</div></td>
                                <td><span class="epico-roadmap" style="background-color: ${cor};">${backlog.nome}</span></td>
                                <td> <span class="badge" style="background-color:${backlog.corprioridade}; color:white;">${backlog.descprioridade}</span></td>
                            </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
            ativarDragDropBacklog();
    } catch (error) {
        mostrarMensagemNaTela("resultado", MSG.errolistar("BACKLOG"), "error");
    }
    }
    async function buscarPorLinha(idEpico, idEstoria) {
        try {
            const response = await fetch(`${API_EPICO}/${idEpico}/estorias/${idEstoria}`);
            const estoria = await response.json();
            if (!response.ok) {
                mostrarMensagemNaTela("resultado",estoria.mensagem, "error");
            } else {
                configuracao.idepico = estoria.idepico;
                configuracao.idestoria = estoria.idestoria;
                configuracao.idtarefa = 0;
                document.getElementById('descestoria').value = estoria.descestoria;
                // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                document.getElementById('resumo').value = estoria.resumo;
                document.getElementById('combostorypoints').value = estoria.pontos;
                document.getElementById('horas_estimadas').value = estoria.horas_estimadas;
                //CARREGANDO OS COMBOS
                document.getElementById('comboResponsavel').value = estoria.idresponsavel;
                mostrarMensagemNaTela("resultado","Estória selecionada: " + estoria.descestoria, "success");
            }
        } catch (error) {
            mostrarMensagemNaTela("resultado",MSG.erroCarregar("ESTORIAS"), "error");
        }
    }
    async function salvarBacklog() {
        if(validaEntrada()) {
            const hoje = new Date();
            const estoria = {
                idsprint: Number(document.getElementById('comboSprint').value) || null,
                idestoria: configuracao.idestoria || null,
                idresponsavel: Number(document.getElementById('comboResponsavel').value) || null,
                idepico: configuracao.idepico || null,
                idprioridade: Number(document.getElementById('comboPrioridades').value) || null,
                dataplanejamento: hoje.toISOString().split("T")[0],
                pontos: Number(document.getElementById('combostorypoints').value) || 0,
                horasestimadas: Number(document.getElementById('horas_estimadas').value) || 0
            };
            try {
                const caminho = `${API_SPRINT}/atualiza_backlog`;
                console.log("POST:", caminho);
                const response = await fetch(caminho, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(estoria)
                });
                setTimeout(() => {
                    mostrarMensagemNaTela("resultado", MSG.salvo("BACKLOG"),"success");
                    const idEmpreendimento = document.getElementById('comboEmpreendimento').value;
                    montaBacklog(idEmpreendimento);
                    montarRoadmap(idEmpreendimento);
                    limparFormulario();
                }, 1000);
            } catch (error) {
                mostrarMensagemNaTela("resultado", MSG.erroSalvar("BACKLOG"),"error");
            }
        }
    }
    async function excluirRoadmap(idSprint, idEstoria) {
        try {
            const response = await fetch(`${API_SPRINT}/${idSprint}/${idEstoria}`, {
                method: 'DELETE'
            });
            setTimeout(() => {
                mostrarMensagemNaTela("resultado", MSG.excluido("ROADMAP"),"success");
                montaBacklog(document.getElementById('comboEmpreendimento').value);
                montarRoadmap(document.getElementById('comboEmpreendimento').value);
            }, 1000);
        } catch (error) {
            mostrarMensagemNaTela("resultado", MSG.erroExcluir("ROADMAP"), "error");
        }
    }
    function validaEntrada() {
        if(document.getElementById('descestoria').value === "") {
            mostrarMensagemNaTela("resultado", "Selecione uma estória", "warning");
            return false;
        }
        if(document.getElementById('combostorypoints').value === "") {
            mostrarMensagemNaTela("resultado", "Selecione story point", "warning");
            return false;
        }
        if(document.getElementById('comboPrioridades').value === "") {
            mostrarMensagemNaTela("resultado", "Selecione uma prioridade", "warning");
            return false;
        }
        if(document.getElementById('comboResponsavel').value === "") {
            mostrarMensagemNaTela("resultado", "Selecione um responsável", "warning");
            return false;
        }
        return true;
    }
</script>
