<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/equipe.css">
</head>
<body>

<div class="container">
    <h1>Cadastro de equipe - TaskController 1.0</h1>

    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'dados-gerais')">
            <i class="fa-solid fa-gear"></i> Dados gerais
        </button>
        <button class="aba-botao" onclick="alternarAba(event, 'equipe')">
            <i class="fa-solid fa-users"></i> Membros
        </button>
    </div>

    <div id="dados-gerais" class="conteudo-aba ativo">
        <div class="form-group">
            <input type="number" name="idequipe" id="idequipe" placeholder="ID da equipe (Deixe vazio para novo)">
            <input type="text" id="nomeequipe" placeholder="Nome da equipe" oninput="converterMaiusculo(this)">
            <input type="text" id="descequipe" placeholder="Descrição da equipe" oninput="converterMaiusculo(this)">
            <label class="checkbox-group">
                <input type="checkbox" id="ativa"> Ativa?
            </label>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-salvar" onclick="salvarEquipes()">Salvar</button>
            <button type="button" class="btn btn-listar" onclick="listarEquipes()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
    </div>

    <div id="equipe" class="conteudo-aba">
        <div class="membros-container">
            <div class="membros-coluna">
                <h2>Usuários disponíveis</h2>
                <div id="usuariosDisponiveis" class="membros-lista-custom"></div>
            </div>

            <div class="membros-acoes">
                <button type="button" class="btn btn-add" onclick="adicionarMembro()">
                    Adicionar <i class="fa-solid fa-arrow-right"></i>
                </button>
                <button type="button" class="btn btn-remove" onclick="removerMembro()">
                    <i class="fa-solid fa-arrow-left"></i> Remover
                </button>
            </div>

            <div class="membros-coluna">
                <h2>Membros da equipe</h2>
                <div id="usuariosEquipe" class="membros-lista-custom"></div>
            </div>
        </div>
    </div>

    <div id="resultado"></div>
</div>

<script>
    // Variáveis globais para rastreamento dos itens selecionados nos seletores customizados
    let usuarioDisponivelSelecionado = null;
    let usuarioEquipeSelecionado = null;

    const API_EQUIPES = 'http://localhost:8080/equipes';

    function converterMaiusculo(campo) {
        campo.value = campo.value.toUpperCase();
    }

    document.addEventListener('visibilitychange', () => {
        const containerTabela = document.getElementById('resultado');
        if (!containerTabela) return;

        if (document.hidden) {
            containerTabela.classList.add('tabela-travada');
        } else {
            containerTabela.classList.remove('tabela-travada');
        }
    });

    async function limpaFormulario() {
        document.getElementById('idequipe').value = "";
        document.getElementById('nomeequipe').value = "";
        document.getElementById('descequipe').value = "";
        document.getElementById('ativa').checked = false;
        usuarioDisponivelSelecionado = null;
        usuarioEquipeSelecionado = null;
    }

    // Renderiza a lista customizada mapeando os eventos de clique
    function renderizarListaCustom(containerId, listaUsuarios, tipo) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        if (listaUsuarios.length === 0) {
            container.innerHTML = `<div style="padding: 20px; color: #94a3b8; text-align:center; font-size:14px;">Nenhum usuário encontrado</div>`;
            return;
        }

        listaUsuarios.forEach(usuario => {
            const item = document.createElement('div');
            item.className = 'membro-item';
            item.dataset.id = usuario.idusuario;

            item.innerHTML = `
                <div class="membro-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="membro-login">${usuario.nome.split(' ')[0].toLowerCase()}</div>
                <div class="membro-name">${usuario.nome}</div>
            `;

            item.addEventListener('click', () => {
                // Remove seleção anterior do escopo específico
                container.querySelectorAll('.membro-item').forEach(el => el.classList.remove('selecionado'));
                item.classList.add('selecionado');

                if (tipo === 'disponivel') {
                    usuarioDisponivelSelecionado = usuario.idusuario;
                } else {
                    usuarioEquipeSelecionado = usuario.idusuario;
                }
            });

            container.appendChild(item);
        });
    }

    async function montaEquipes(idEquipe) {
        try {
            const disponiveis = await fetch(`${API_EQUIPES}/${idEquipe}/usuarios/disponiveis`).then(r => r.json());
            const membros = await fetch(`${API_EQUIPES}/${idEquipe}/usuarios`).then(r => r.json());

            renderizarListaCustom("usuariosDisponiveis", disponiveis, 'disponivel');
            renderizarListaCustom("usuariosEquipe", membros, 'equipe');

            usuarioDisponivelSelecionado = null;
            usuarioEquipeSelecionado = null;
        } catch(e) {
            mostrarMensagemNaTela("Erro ao montar colunas de membros: " + e.message);
        }
    }

    async function adicionarMembro(){
        const idEquipe = document.getElementById("idequipe").value;
        if(!idEquipe || !usuarioDisponivelSelecionado) {
            mostrarMensagemNaTela("Selecione um usuário disponível e garanta que a equipe possua um ID válido.");
            return;
        }
        await fetch(`http://localhost:8080/equipes/${idEquipe}/membros/${usuarioDisponivelSelecionado}`, { method:"POST" });
        montaEquipes(idEquipe);
    }

    async function removerMembro(){
        const idEquipe = document.getElementById("idequipe").value;
        if(!idEquipe || !usuarioEquipeSelecionado) {
            return;
        }
        await fetch(`http://localhost:8080/equipes/${idEquipe}/membros/${usuarioEquipeSelecionado}`, { method:"DELETE" });
        montaEquipes(idEquipe);
    }

    function alternarAba(event, idAbaDestino) {
        document.querySelectorAll('.conteudo-aba').forEach(conteudo => conteudo.classList.remove('ativo'));
        document.querySelectorAll('.aba-botao').forEach(botao => botao.classList.remove('ativa'));

        document.getElementById(idAbaDestino).classList.add('ativo');
        event.currentTarget.classList.add('ativa');

        if (idAbaDestino === 'equipe') {
            const idEquipe = document.getElementById("idequipe").value;
            if (idEquipe) {
                montaEquipes(idEquipe);
            } else {
                document.getElementById("usuariosDisponiveis").innerHTML = `<div style="padding: 20px; color: #ef4444; text-align:center; font-size:14px;">Selecione ou salve uma equipe primeiro para gerenciar os membros.</div>`;
                document.getElementById("usuariosEquipe").innerHTML = "";
            }
        }
    }

    async function salvarEquipes() {
        if(validaEntrada()) {
            const idequipe = document.getElementById("idequipe").value;
            const descequipe = document.getElementById('descequipe').value;
            const nomeequipe = document.getElementById('nomeequipe').value;
            const campoAtiva = document.getElementById('ativa').checked ? 1 : 0;

            const equipe = {
                idequipe: Number(idequipe) || null,
                nomeequipe: nomeequipe || null,
                descequipe: descequipe || null,
                ativa: campoAtiva
            };

            try {
                const response = await fetch(`${API_EQUIPES}/salvar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(equipe)
                });
                mostrarMensagemNaTela("Gravado com sucesso!", "green");
                setTimeout(() => {
                    limpaFormulario();
                    listarEquipes();
                }, 1000);
            } catch (error) {
                mostrarMensagemNaTela("Erro ao salvar: " + error.message);
            }
        }
    }

    async function listarEquipes() {
        if (document.hidden) return;
        try {
            const response = await fetch(`${API_EQUIPES}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Ativa</th>
                        <th style="text-align:center;">Ação</th>
                    </tr>
                </thead>
                <tbody>`;
            data.forEach(equipe => {
                tabela += `<tr onclick="buscarPorLinha(${equipe.idequipe})" style="cursor:pointer;">
                                <td>${equipe.idequipe}</td>
                                <td>${equipe.nomeequipe}</td>
                                <td>${equipe.descequipe}</td>
                                <td>${equipe.ativa ? '✅ Sim' : '❌ Não'}</td>
                                <td style="text-align:center;">
                                    <button type="button" class="btn btn-excluir" onclick="event.stopPropagation();excluirEquipes(${equipe.idequipe})">
                                        <i class="fa-solid fa-trash-can"></i> Excluir
                                    </button>
                                </td>
                           </tr>`;
            });
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao listar: " + error.message);
        }
    }

    async function excluirEquipes(idequipe) {
        try {
            const response = await fetch(`${API_EQUIPES}/excluir/${idequipe}`, { method: 'DELETE' });
            const texto = await response.text();
            mostrarMensagemNaTela(texto || 'Equipe excluída com sucesso', "green");
            limpaFormulario();
            listarEquipes();
        } catch (error) {
            mostrarMensagemNaTela(error.message);
        }
    }

    function mostrarMensagemNaTela(mensagem, cor = "red") {
        const container = document.getElementById("resultado");
        if (container) {
            container.textContent = mensagem;
            container.style.color = cor === "green" ? "#10b981" : "#ef4444";
        } else {
            alert(mensagem);
        }
    }

    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API_EQUIPES}/${id}`);
            const equipe = await response.json();
            document.getElementById('idequipe').value = equipe.idequipe;
            document.getElementById('nomeequipe').value = equipe.nomeequipe;
            document.getElementById('descequipe').value = equipe.descequipe;
            document.getElementById('ativa').checked = !!equipe.ativa;

            // Limpa mensagens e monta equipe se o usuário mudar de aba depois
            mostrarMensagemNaTela("Equipe selecionada: " + equipe.nomeequipe, "green");
            montaEquipes(equipe.idequipe);
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar: " + error.message);
        }
    }

    function validaEntrada() {
        if(document.getElementById('nomeequipe').value.trim() === "" ) {
            mostrarMensagemNaTela("O nome da equipe não deve estar vazio");
            return false;
        }
        if(document.getElementById('descequipe').value.trim() === "" ) {
            mostrarMensagemNaTela("A descrição da equipe não deve estar vazia");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
