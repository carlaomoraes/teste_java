<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - TaskController 1.0</title>
    <style>
        /* Reset básico e tipografia */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
    min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
        }

        /* ==========================================================================
           ESTRUTURA DAS ABAS (CSS)
           ========================================================================== */

        /* Container dos botões das abas */
        .abas-container {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }

        /* Estilo de cada botão de aba */
        .aba-botao {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 2px solid transparent; /* Reserva o espaço para a borda ativa */
            margin-bottom: -2px; /* Joga a borda por cima da linha do container */
            transition: all 0.2s ease-in-out;
        }

        .aba-botao:hover {
            color: #1e293b;
            background-color: #f8fafc;
        }

        /* Estado da Aba Ativa (Selecionada) */
        .aba-botao.ativa {
            color: #2563eb; /* Azul padrão do sistema */
            border-bottom: 2px solid #2563eb;
        }

        /* Container do conteúdo */
        .conteudo-aba {
            display: none; /* 🌟 ESCONDE TODAS AS ABAS POR PADRÃO */
            padding: 10px 5px;
            animation: surgir 0.3s ease-in-out; /* Efeito visual suave */
        }

        /* Estado do Conteúdo Ativo */
        .conteudo-aba.ativo {
            display: block; /* 🌟 MOSTRA APENAS A ABA ATIVA */
        }

        /* Pequena animação para o conteúdo aparecer suavemente */
        @keyframes surgir {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           Botões (Grupo)
           ========================================================================== */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap; /* Ajusta em telas menores */
        }

        .btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* Botão Principal (Salvar) */
        .btn-group .btn:nth-child(1) {
            background-color: #2563eb;
            color: white;
        }
        .btn-group .btn:nth-child(1):hover { background-color: #1d4ed8; }

        /* Botão Secundário (Listar) */
        .btn-group .btn:nth-child(2) {
            background-color: #10b981;
            color: white;
        }
        .btn-group .btn:nth-child(2):hover { background-color: #059669; }

        /* Botão Buscar */
        .btn-group .btn:nth-child(3) {
            background-color: #64748b;
            color: white;
        }
        .btn-group .btn:nth-child(3):hover { background-color: #475569; }

        /* Botão Voltar */
        .btn-group .btn:nth-child(4) {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-group .btn:nth-child(4):hover { background-color: #cbd5e1; }

        .btn:active { transform: scale(0.98); }
        /* ==========================================================================
           Tabela de Resultados Dinâmica
           ========================================================================== */
        table.table {
            width: 100%;
            border-collapse: collapse; /* Remove aquelas bordas duplas antigas */
            margin-top: 15px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden; /* Garante o arredondamento dos cantos */
            border: 1px solid #e2e8f0;
        }

        table.table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-align: left;
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 2px solid #e2e8f0;
        }

        table.table td {
            padding: 14px 16px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Efeito Zebrado nas linhas da tabela */
        table.table tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        /* Efeito de Hover ao passar o mouse na linha */
        table.table tbody tr:hover {
            background-color: #f1f5f9 !important;
        }

        /* Botão de Excluir específico dentro da tabela */
        table.table .btn {
            padding: 6px 12px;
            font-size: 12px;
            background-color: #ef4444;
            color: white;
        }
        table.table .btn:hover { background-color: #dc2626; }
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            transition: all 0.2s ease-in-out;
            margin-bottom: 4px;
        }
        .membros-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            align-items: center;
        }

        .membros-coluna {
            flex: 1;
        }

        .membros-coluna select {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cadastro de equipe - TaskController 1.0</h1>

    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'dados-gerais')">Dados gerais</button>
        <button class="aba-botao" onclick="alternarAba(event, 'equipe')">Membros</button>
    </div>

    <div id="dados-gerais" class="conteudo-aba ativo">
        <div class="form-group">
            <input type="number" name="idequipe" id="idequipe" placeholder="ID da equipe (Deixe vazio para novo)">
            <input type="text" id="nomeequipe" placeholder="Nome da equipe">
            <input type="text" id="descequipe" placeholder="Descrição da equipe"> <br>
            <label class="checkbox-group">
                <input type="checkbox" id="ativa" value="0"> Ativa ?
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn"  onclick="salvarEquipes()">Salvar</button>
            <button type="button" class="btn" onclick="listarEquipes()">Listar</button>
            <button type="button" class="btn" onclick="history.back()">Voltar</button>
        </div>

    </div>
    <div id="equipe" class="conteudo-aba">
        <div class="membros-container">
            <div class="membros-coluna">
                <h1>Usuários disponíveis</h1>
                <select id="usuariosDisponiveis" size="12" multiple></select>
            </div>
            <div class="membros-acoes">
                <button type="button" class="btn btn-add" onclick="adicionarMembro()">
                    Adicionar →
                </button>
                <button type="button" class="btn btn-remove" onclick="removerMembro()">
                    ← Remover
                </button></div>
             <div class="membros-coluna">
                <h1>Membros da equipe</h1>
                <select id="usuariosEquipe" size="12" multiple>  </select>
            </div>
        </div>
    </div>
    <div id="resultado"></div>
</div>
<script>
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_EQUIPES = 'http://localhost:8080/equipes';

    async function limpaFormulario() {
        document.getElementById('idequipe').value = "";
        document.getElementById('descequipe').value = "";
        document.getElementById('observacao').value = "";
        document.getElementById('ativa').value = false;
    }

    async function montaEquipes(idEquipe) {
        const disponiveis = await fetch(`${API_EQUIPES}/listar/disponiveis/${idEquipe}`)
            .then(r => r.json());

        const membros = await fetch(`${API_EQUIPES}/${idEquipe}/membros/`)
            .then(r => r.json());

        const comboDisponiveis = document.getElementById("usuariosDisponiveis");
        const comboMembros = document.getElementById("usuariosEquipe");

        comboDisponiveis.innerHTML = "";
        comboMembros.innerHTML = "";

        disponiveis.forEach(usuario => {
            comboDisponiveis.innerHTML += `
            <option value="${usuario.idusuario}">${usuario.nome}</option>
        `;
        });

        membros.forEach(usuario => {
            comboMembros.innerHTML += `
            <option value="${usuario.idusuario}">${usuario.nome}</option>
        `;
        });
    }

    async function adicionarMembro(){

        const idEquipe =
            document.getElementById("idequipe").value;

        const usuario =
            document.getElementById("usuariosDisponiveis");

        if(!usuario.value) return;
            await fetch(
            `http://localhost:8080/equipes/${idEquipe}/membros/${usuario.value}`,
            {
                method:"POST"
            }
        );

        montaEquipes(idEquipe);
    }
    async function removerMembro(){

        const idEquipe =
            document.getElementById("idequipe").value;

        const usuario =
            document.getElementById("usuariosEquipe");

        if(!usuario.value) return;

        await fetch(
            `http://localhost:8080/equipes/${idEquipe}/membros/${usuario.value}`,
            {
                method:"DELETE"
            }
        );

        montaEquipes(idEquipe);
    }
    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');

        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_EQUPES = 'http://localhost:8080/equipes'
    async function salvarEquipes() {
        const idequipe = document.getElementById('idequipe').value;
        const descequipe = document.getElementById('descequipe').value;
        const campoAtiva = document.getElementById('ativa').checked ? 1 : 0;
        const equipe = {
            idequipe: idequipe || null,
            descequipe: descequipe || null,
            ativa: campoAtiva
        };
        try {
            const response = await fetch(`${API_EQUPES}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(equipe)
            });
            const data = await response.json();
            mostrarMensagemNaTela('Equipe gravada com sucesso',1);
            limpaFormulario();
            listarEquipes();
        } catch (error) {
            mostrarMensagemNaTela("Erro ao salvar: " + error.message);
        }
    }

    async function listarEquipes() {
        try {
            const response = await fetch(`${API_EQUPES}/listar`);
            const data = await response.json();
            let tabela = `
            <table class="table">
                <thead>
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Ativa</th>
                        <th class="table-header">Ação</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(equipe => {
                tabela += `<tr onclick="buscarPorLinha(${equipe.idequipe})"
                                style="cursor:pointer;">
                                <th>${equipe.idequipe}</th>
                                <th>${equipe.nomeequipe}</th>
                                <th>${equipe.descequipe}</th>
                                <th>${equipe.ativa ? '✅ Sim' : '❌ Não'}</th>
                                <th> <button type="button" class="btn" id="btnExcluirEquipe" onclick="event.stopPropagation();excluirEquipes(${equipe.idequipe})">Excluir</button></th>
                           </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("Erro ao listar: " + error.message);
        }
    }
    async function excluirEquipes(idequipe) {
        try {
            const response = await fetch(`${API_EQUPES}/excluir/${idequipe}`, {
                method: 'DELETE'
            });
            const texto = await response.text();
            mostrarMensagemNaTela(texto || 'Equipe excluída com sucesso',1);
        } catch (error) {
            mostrarMensagemNaTela(error,1);
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
    });

    // Função para injetar a mensagem no HTML
    function mostrarMensagemNaTela(mensagem, aba) {
       container = document.getElementById("resultado");
       if (container) {
            container.textContent = mensagem;
            container.style.color = "red"; // Deixa o texto vermelho
        } else {
            alert(mensagem); // Feedback visual simples caso não tenha o container
        }
    }
    async function buscarPorLinha(id) {
        try {
            const response = await fetch(`${API_EQUPES}/${id}`);
            const equipe = await response.json();
            document.getElementById('idequipe').value = equipe.idequipe;
            document.getElementById('nomeequipe').value = equipe.nomeequipe;
            document.getElementById('descequipe').value = equipe.descequipe;
            // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
            document.getElementById('ativa').checked = equipe.ativa || 0;
            montaEquipes(equipe.idequipe);
        } catch (error) {
            mostrarMensagemNaTela("Erro ao carregar: " + error.message);
        }
    }
</script>
</body>
</html>
