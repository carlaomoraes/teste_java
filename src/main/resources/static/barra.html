<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/barra.css">
</head>
<body>
<div class="toolbar" id="toolbar">
    <button id="btnNovo" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Novo
    </button>

    <button id="btnSalvar" class="btn btn-success">
        <i class="bi bi-check-circle"></i> Salvar
    </button>

    <button id="btnCancelar" class="btn btn-secondary">
        <i class="bi bi-x-circle"></i> Cancelar
    </button>

    <button id="btnEditar" class="btn btn-warning">
        <i class="bi bi-pencil"></i> Editar
    </button>

    <button id="btnExcluir" class="btn btn-danger">
        <i class="bi bi-trash"></i> Excluir
    </button>

    <button id="btnPesquisar" class="btn btn-info">
        <i class="bi bi-search"></i> Pesquisar
    </button>
</div>
</body>
</html>
