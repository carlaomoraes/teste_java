<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/sprintatual.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>

<script src="js/funcoes.js"></script>
<script src="js/mensagens.js"></script>
<div class="container-fluid">

    <!-- Cabeçalho -->
    <div class="card shadow-sm mb-4">
        <label class="form-label"> Empreendimento *</label>
             <select id="comboEmpreendimento" class="form-select" required></select>
        <label class="form-label">Sprint *</label>
             <select id="comboSprint" class="form-select" required></select>
    </div>
    <div class="text-end" id="saude"></div>

    <!-- Cards -->
    <div class="row mb-3">

        <div class="col-md-3">
            <div class="card text-bg-success">
                <div class="card-body">
                    <h3>0</h3>
                    Concluídas
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h3>0</h3>
                    Em andamento
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-danger">
                <div class="card-body">
                    <h3>0</h3>
                    Atrasadas
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-secondary">
                <div class="card-body">
                    <h3>0 h</h3>
                    Capacidade
                </div>
            </div>
        </div>

    </div>
    <div class="row mb-3" id="ausencia"></div>
    <!-- Roadmap -->
    <div class="card">
        <div class="card-body" ></div>
        <div class="card-body p-0">
            <table class="table table-bordered align-middle mb-0">
                <thead>
                <tr>
                    <div id="roadmap"></div>
                    <div id="estorias_tarefas"></div>

                </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>
    <div id="resultado"></div>
</div>
<!-- BOTÕES -->
<div class="btn-group">
    <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
</div>
<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API = 'http://localhost:8080/sprints';
    const API_EMPREENDIMENTO ='http://localhost:8080/empreendimento';
    const API_TRANSICAO = 'http://localhost:8080/status_transicao';


    let dataInicioSprint = null;
    let dataFimSprint = null;

    const TIPO_ENTIDADE = {
        EPICO: 1,
        ESTORIA: 2,
        TAREFA: 3,
        SPRINT: 4,
        EMPREENDIMENTO: 5,
    };

    async function carregaCabecalho(idEmpreendimento) {
        const comboSprint= document.getElementById("comboSprint");
        comboSprint.innerHTML=`SEM SPRINT CADASTRADA!!!`;
        try {
            const response = await fetch(`${API}/carregaSprint/DTO/${idEmpreendimento}`);
            const data = await response.json();
            data.forEach(a => {
                const opcao = document.createElement('option');
                opcao.value = a.idsprint;
                opcao.textContent = a.idsprint + " - "+ a.descsprint+" - Período: "+formatarData(a.dtiniciosprint) + " - "+formatarData(a.dtfinalsprint);
                comboSprint.appendChild(opcao);
                document.getElementById("comboSprint");
                listarAusenciasSprint(a.idsprint);
                montaRoadmap(a.idsprint);
                montarKAMBAM(a.idsprint);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado", error.message, "error");
        }
    }
    async function carregarEmpreendimento() {
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const empreendimentos = await resposta.json();
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimento.appendChild(opcao);
            });
        } catch (error) {
              mostrarMensagemNaTela("resultado", MSG.erroCarregar("EMPREENDIMENTO"), "error");
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarEmpreendimento();
    });
    // 2. Attach the 'change' event listener
    comboEmpreendimento.addEventListener('change', (event) => {
        // Get the selected option's value
        const selectedValue = event.target.value;
        carregaCabecalho(selectedValue);
    });
    comboSprint.addEventListener('change', (event) => {
        listarAusenciasSprint(event.target.value);
        montaRoadmap(event.target.value);
        montarKAMBAM(event.target.value);
    })

    // =============================================================
    // MONTAR QUADRO DE AUSÊNCIAS DA SPRINT
    // =============================================================
    async function listarAusenciasSprint(idSprint)    {
        const url = `${API}/DTO/${idSprint}`;
        const response = await fetch(url);
        const data = await response.json();
        if(!data) {
            return;
        }
        dataInicioSprint = data.dtiniciosprint;
        dataFimSprint = data.dtfinalsprint;
        //---------
        const container = document.getElementById("ausencia");
        // Limpa o quadro
        container.innerHTML = "";
        // Se a sprint ainda não possui período definido
        try {
            const url = `${API}/listar_ausencias?data_inicio=${dataInicioSprint}`+`&data_fim=${dataFimSprint}`;
            const response = await fetch(url);
            if (!response.ok) {
                mostrarMensagemNaTela("resultado",MSG.erroCarregar("AUSÊNCIAS"),"error");
                return;
            }
            const data = await response.json();
            if(!data) {
                return;
            }
            // ---------------------------------------------------------
            // MONTA TABELA
            // ---------------------------------------------------------
            let tabela = `
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Data inicial</th>
                        <th>Data final</th>
                        <th>Tipo ausência</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody>`;
            data.forEach(a => {
                const cor = a.cor_tipo_ausencia || "#6c757d";
                tabela += `
                <tr><td>${a.nome ?? ""}</td><td>${formatarData(a.data_inicio)}</td><td>${formatarData(a.data_fim)}</td>
                    <td> <span class="badge" style="background-color:${cor}; color:white;">${a.tipoausencia ?? ""}</span></td>
                    <td> ${a.observacao ?? ""} </td>
                </tr>`;
            });
            tabela += `</tbody>  </table>`;
            container.innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado",MSG.erroCarregar("AUSÊNCIAS"),"error");
        }
    }
    async function montaRoadmap(idSprint) {
        const nomesDias = ["DOM", "SEG", "TER", "QUA", "QUI", "SEX", "SÁB"];

        const url = `${API}/DTO/${idSprint}`;
        const response = await fetch(url);
        const data_sp = await response.json();
        if(!data_sp) {
            return;
        }
        var dataInicioSprint = data_sp.dtiniciosprint;
        var dataFimSprint = data_sp.dtfinalsprint;

        const container = document.getElementById("roadmap");
        if (!dataInicioSprint || !dataFimSprint) {
            container.innerHTML = "";
            return;
        }

        // Datas da Sprint
        const inicio = new Date(dataInicioSprint + "T00:00:00");
        const fim = new Date(dataFimSprint + "T00:00:00");

        // Data de hoje
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);

        // =========================================================
        // MONTA VETOR COM OS DIAS DA SPRINT
        // =========================================================
        const dias = [];

        let data = new Date(inicio);

        while (data <= fim) {
            dias.push(new Date(data));
            data.setDate(data.getDate() + 1);
        }

        // =========================================================
        // MONTA ROADMAP
        // =========================================================
        let html = `<table class="table table-bordered text-center"> <tr>`;
        for (let i = 0; i < dias.length; i++) {
            const dataDia = dias[i];
            const dia = String(dataDia.getDate()).padStart(2, "0");
            // Verifica se é hoje
            const ehHoje = dataDia.getFullYear() === hoje.getFullYear() && dataDia.getMonth() === hoje.getMonth() && dataDia.getDate() === hoje.getDate();
            const ehFinaldeSemana = dataDia.getDay() === 0 || dataDia.getDay() === 6;

            let classe = "";
            if(ehHoje) {
                classe = "bg-warning"
            } else if (ehFinaldeSemana) {
                classe = "fim-semana";
            }

            html += `<th class="${classe}"><div>${dia}</div><small>${nomesDias[dataDia.getDay()]}</small></th>`;

        }
        html += `</tr></table>`;
        container.innerHTML = html;
    }
    async function montarKAMBAM(idSprint) {
        const container = document.getElementById("estorias_tarefas");
        container.innerHTML = "";
        try {

            // =====================================================
            // 1. BUSCA AS TAREFAS DA SPRINT
            // =====================================================

            const responseQuadro = await fetch(`${API}/${idSprint}/quadro`);

            if (!responseQuadro.ok) {
                throw new Error("Erro ao carregar tarefas");
            }

            const tarefas = await responseQuadro.json();
            // =====================================================
            // 2. BUSCA O WORKFLOW DE TAREFA
            // =====================================================
            const responseWorkflow = await fetch(`${API_TRANSICAO}/listar/${TIPO_ENTIDADE.TAREFA}`);
            if (!responseWorkflow.ok) {
                throw new Error("Erro ao carregar workflow");
            }
            const workflow = await responseWorkflow.json();
            // =====================================================
            // 3. EXTRAI OS STATUS DO WORKFLOW
            // =====================================================
            const statusTarefa = montarStatusDoWorkflow(workflow);
            // =====================================================
            // 4. MONTA O KANBAN
            // =====================================================
            let html = `<div class="d-flex gap-3 overflow-auto w-100">`;
            statusTarefa.forEach(status => {
                // Tarefas que pertencem ao status atual
                const tarefasDaColuna = tarefas.filter(tarefa => Number(tarefa.idstatus) === Number(status.idstatus));
                html += `<div class="kanban-coluna">
                    <!-- CABEÇALHO -->
                    <div class="kanban-header" style="border-top:4px solid ${status.cor}">
                        <span class="badge" style="background-color:${status.cor}; color:white;">${status.descstatus}</span>
                        <span class="badge bg-secondary"> ${tarefasDaColuna.length} </span>
                    </div>
                    <!-- CORPO DA COLUNA -->
                    <div class="kanban-body"
                         data-status="${status.idstatus}">`;
                // =================================================
                // CARDS
                // =================================================
                tarefasDaColuna.forEach(tarefa => {
                    html += montarCardTarefa(tarefa);
                });
                html += `</div></div> `;
            });
            html += `</div>`;
            container.innerHTML = html;
        } catch (error) {
            console.error(error);
            //mostrarMensagemNaTela("resultado", MSG.erroCarregar("ESTÓRIAS/TAREFAS"),"error");
            mostrarMensagemNaTela("resultado", error.message,"error");
        }
    }
    function montarStatusDoWorkflow(workflow) {
        const mapa = new Map();
        workflow.forEach(item => {
            // STATUS ORIGEM
            if (!mapa.has(item.idStatusOrigem)) {
                mapa.set(item.idStatusOrigem, {
                    idstatus: item.idStatusOrigem,
                    descstatus: item.statusOrigem,
                    cor: item.corOrigem
                });

            }
            // STATUS DESTINO
            if (!mapa.has(item.idStatusDestino)) {
                mapa.set(item.idStatusDestino, {
                    idstatus: item.idStatusDestino,
                    descstatus: item.statusDestino,
                    cor: item.corDestino
                });

            }
        });

        return Array.from(mapa.values());
    }
    function montarCardTarefa(tarefa) {
        var html;
        html += ``;
        html += `<div class="kanban-coluna">`;
        html += `<div class="kanban-header">`;
        html += `<div class="kanban-body">`;
        html += tarefa.idtarefa + ` - `+ tarefa.desctarefa;
        html += `<div class="small mt-1">`;
        html += `<i class="bi bi-person-check"></i>`;
        html += tarefa.nomecriador;
        html += `</div>`;
        html += `<div class="small mt-1">`;
        html += `<i class="bi bi-person-check"></i>`;
        html += tarefa.nomeresponsavel;
        html += `</div>`;
        html += `</div>`;
        html += `</div>`;
        html += `</div>`;
        return html;
    }
</script>
</body>
</html>
