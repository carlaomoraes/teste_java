<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/relatorios.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>

<body>
<script src="js/funcoes.js"></script>
<script src="js/mensagens.js"></script>


<div class="card shadow-sm mb-3">
    <div class="card-header bg-secondary text-white">
        <strong>Relatórios Gerenciais - Por Sprint</strong>
    </div>

    <div class="card-body">
        <div class="row g-3 align-items-end">
            <h1>Sprints</h1>

            <div id="listaSprints"></div>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-salvar" onclick="await filtrarSprints()">Filtrar</button>
            <button type="button" class="btn btn-listar" onclick="imprimirSprints()">Imprimir</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>

    </div>
</div>

<div id="resultadoRelatorio"></div>
</body>
</html>
<script>
    const API_SPRINT = 'http://localhost:8080/sprints';

    // ==============================================================
    // INICIALIZAÇÃO
    // ==============================================================
    document.addEventListener("DOMContentLoaded", () => {
        carregarSprintsRelatorio();
    });
    // 2. Attach the 'change' event listener
    async function filtrarSprints() {
        const ids = obterSprintsSelecionadas();

        if (ids.length === 0) {
            alert("Selecione pelo menos uma Sprint.");
            return;
        }

        const params = new URLSearchParams();
        ids.forEach(id => params.append("idSprint", id));

        const response = await fetch(
            `${API_SPRINT}/sprints/id?${params}`
        );

        if (!response.ok) {
            throw new Error("Erro ao consultar Sprints.");
        }

        const dados = await response.json();

        await montarTabelaRelatorio(dados);
    }
    async function montarTabelaRelatorio(dados) {
        try {
                let tabela = `<table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                          <thead> <tr style="cursor:pointer;">
                                <th>ID</th>
                                <th>Descrição</th>
                                <th>Data Início</th>
                                <th>Data Fim</th>
                                <th>Quantidade de estórias</th>
                                <th>Quantidade de tarefas</th>
                                <th>Status</th>
                                <th>Horas estimadas</th>
                                <th>Horas realizadas</th>
                                <th>Progresso</th>
                        </tr>
                    </thead>
                    <tbody>`;
                dados.forEach(sprint => {
                    tabela += `<tr style="cursor:pointer;">
                        <td>${sprint.idsprint}</td>
                        <td>${sprint.descsprint || ''}</td>
                        <td>${formatarDataBR(sprint.dtiniciosprint)}</td>
                        <td>${formatarDataBR(sprint.dtfinalsprint)}</td>
                        <td>${sprint.contEstorias}</td>
                        <td>${sprint.contTarefas}</td>
                        <td> <span class="badge" style="background-color:${sprint.corstatus}; color:white;">${sprint.descstatus}</span></td>
                        <td align="right">${sprint.totalHorasEstimadas60}</td>
                        <td align="right">${sprint.totalHorasRealizadas60}</td>
                        <td>${sprint.progresso} %</td>
                  </tr>
                `;
                });
                tabela += `</tbody></table>`;
                document.getElementById('resultadoRelatorio').innerHTML = tabela;
            } catch (error) {
                mostrarMensagemNaTela("resultadoRelatorio", MSG.erroCarregar("SPRINT"), "error");
            }
    }

    async function carregarSprintsRelatorio() {
        const lista = document.getElementById("listaSprints");
        lista.innerHTML = "";
        try {
            const response = await fetch(`${API_SPRINT}/listar/DTO/`);
            if (!response.ok) {
                throw new Error("Erro ao carregar Sprints");
            }

            const sprints = await response.json();

            sprints.forEach(sprint => {
                const div = document.createElement("div");
                div.className = "form-check mb-2";

                div.innerHTML = `
                <input class="form-check-input sprint-check"
                       type="checkbox"
                       id="sprint_${sprint.idsprint}"
                       value="${sprint.idsprint}"
                       onchange="atualizarSelecaoSprints()">

                <label class="form-check-label"
                       for="sprint_${sprint.idsprint}">
                    <strong>${sprint.descsprint}</strong>
                    (${formatarData(sprint.dtiniciosprint)}
                     a ${formatarData(sprint.dtfinalsprint)})
                </label>
            `;

                lista.appendChild(div);
            });

        } catch (error) {
            console.error(error);
        }
    }

    function formatarData(data) {
        if (!data) return "";
        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
    }

    function atualizarSelecaoSprints() {
        const selecionadas = document.querySelectorAll(
            ".sprint-check:checked"
        );

        const quantidade = selecionadas.length;

        botao.textContent = quantidade === 0
            ? "Selecione as Sprints..."
            : `${quantidade} Sprint${quantidade > 1 ? "s" : ""} selecionada${quantidade > 1 ? "s" : ""}`;
    }

    function imprimirSprints() {
        const ids = obterSprintsSelecionadas();

        if (ids.length === 0) {
            alert("Selecione pelo menos uma Sprint.");
            return;
        }

        const params = new URLSearchParams();
        ids.forEach(id => params.append("idSprint", id));

        window.open(
            `${API_SPRINT}/sprints/id/pdf?${params}`,
            "_blank"
        );
    }
    function obterSprintsSelecionadas() {
        return Array.from(
            document.querySelectorAll(".sprint-check:checked")
        ).map(item => Number(item.value));
    }
</script>
