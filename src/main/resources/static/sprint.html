<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/sprint.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<script src="js/utils/mensagens.js"></script>

<div class="container">
    <h1>Sprint - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'geral')">Geral</button>
        <button class="aba-botao" onclick="alternarAba(event, 'ausencias')">Ausências programadas</button>
    </div>
    <div id="geral" class="conteudo-aba ativo">
        <input type="number" id="idsprint"  placeholder="ID da sprint (Deixe vazio para novo)" readonly>
        <label for="descsprint">Descrição da sprint:</label>
        <input type="text" id="descsprint" oninput="converterMaiusculo(this)">
        <label class="form-label" for="comboEmpreendimento">Empreendimento:</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-buildings"></i>
            </span>
            <select class="form-select" id="comboEmpreendimento">
                    <option value="">Selecione...</option>
            </select>
        </div>
        <label for="dtiniciosprint">Data de Início:</label>
        <input type="date" id="dtiniciosprint">
        <label for="dtfinalsprint">Data de Término:</label>
        <input type="date" id="dtfinalsprint">
        <label class="checkbox-group">
            <input type="checkbox" id="visivel" value="0">Sprint vísivel no quadro
            <input type="checkbox" id="ativa" value="1"> Sprint ativa
        </label>
        <div class="btn-group" data-toggle="buttons-radio">
          <button type="button" class="btn btn-add"  onclick="criarSprint()">Novo</button>
          <button type="button" class="btn btn-salvar" onclick="salvarSprint()">Salvar</button>
          <button type="button" class="btn btn-listar" onclick="listarSprints()">Listar</button>
          <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
    </div>
    <div id="ausencias" class="conteudo-aba">
        <div id="resultadoausencia"></div>
    </div>

    <div id="resultadogeral"></div>
</div>

<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API = 'http://localhost:8080/sprints';
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';

    let configuracaoSprint = {
        idconfiguracao: 0,
        idempreendimento: 0,
        duracao_min_sprint: 0,
        duracao_max_sprint: 0,
        horas_trabalho_dia: 0,
        considerarFeriados: false,
        permitir_sprint_sobreposta: false,
        permitir_multiplas_sprint_ativas: false,
        considerar_feriados: false
    };

    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }
    async function carregarConfiguracao() {
        const idEmpreendimento = document.getElementById('comboEmpreendimento').value;
        if (!idEmpreendimento) {
            return;
        }
        try {
            const response = await fetch(`${API_EMPREENDIMENTO}/${idEmpreendimento}`);
            if (!response.ok) {
               mostrarMensagemNaTela("resultadogeral","Configuração não encontrada","error");
               return;
            }
            const data = await response.json();
            configuracaoSprint.idempreendimento = data.idempreendimento;
            configuracaoSprint.idconfiguracao = data.idconfiguracao;
            configuracaoSprint.idempreendimento = data.idempreendimento;
            configuracaoSprint.duracao_min_sprint = data.duracao_min_sprint;
            configuracaoSprint.duracao_max_sprint = data.duracao_max_sprint;
            configuracaoSprint.horas_Trabalho_Dia = data.horas_trabalho_dia;
            configuracaoSprint.permitir_sprint_sobreposta =  data.permitir_sprint_sobreposta;
            configuracaoSprint.permitir_multiplas_sprint_ativas = data.permitir_multiplas_sprint_ativas;
            configuracaoSprint.considerar_feriados = data.considerar_feriados;
            montaDatasSprint();
            await listarAusencias(document.getElementById('dtiniciosprint').value, document.getElementById('dtfinalsprint').value);
        } catch (error) {
            //mostrarMensagemNaTela("resultadogeral", MSG.erroCarregar("CONFIGURAÇÕES"), "error");
            mostrarMensagemNaTela("resultadogeral", error.message, "error");
        }
    }
    function montaDatasSprint() {
        const dataHoje = new Date();

        // Criamos uma nova data baseada na atual para evitar alterar 'dataHoje'
        const dataFutura = new Date(dataHoje);

        // Adicionamos os dias da sprint à data futura
        // (Ajuste o fuso local ajustando com getDate() / setDate())
        dataFutura.setDate(dataHoje.getDate() + configuracaoSprint.duracao_max_sprint);

        // Função auxiliar para formatar como YYYY-MM-DD respeitando o fuso local
        const formatarData = (data) => {
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        };

        document.getElementById('dtiniciosprint').value = formatarData(dataHoje);
        document.getElementById('dtfinalsprint').value = formatarData(dataFutura);

    }
    async function carregarEmpreendimento() {
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const empreendimentos = await resposta.json();
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimento.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral", MSG.erroCarregar("EMPREENDIMENTO"), "error");
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarEmpreendimento();
    });
    document.getElementById('comboEmpreendimento').addEventListener('change', (event) => {
        const idEmpreendimento = event.target.value;
        carregarConfiguracao(idEmpreendimento);
    });

    async function criarSprint() {
        document.getElementById('descsprint').value = '';
        document.getElementById('dtiniciosprint').value = '';
        document.getElementById('dtfinalsprint').value = '';
        document.getElementById('visivel').checked = false;
        document.getElementById('ativa').checked = false;
        document.getElementById('comboEmpreendimento').value = "";
    }

    async function salvarSprint() {
        if (validaEntrada()) {
            const descricao = document.getElementById('descsprint').value;
            const datainicio = document.getElementById('dtiniciosprint').value;
            const datafinal  = document.getElementById('dtfinalsprint').value;

            // CAPTURANDO O CHECKBOX: Retorna true se estiver marcado, ou false se estiver desmarcado
            const visivel = document.getElementById('visivel').checked;
            const ativa = document.getElementById('ativa').checked;
            const sprint = {
                descsprint: descricao,
                dtiniciosprint: datainicio,
                dtfinalsprint: datafinal,
                visivel: visivel || true, // Envia true/false para o atributo booleano do Spring
                ativa: ativa || true,
                empreendimento: {
                    idEmpreendimento: configuracaoSprint.idempreendimento,
                }
            };
            alert(JSON.stringify(sprint));
            console.log(JSON.stringify(sprint));
            try {
                const response = await fetch(`${API}/salvar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sprint)
                });

                if (!response.ok) throw new Error(await response.text());

                const data = await response.json();
                mostrarMensagemNaTela("resultado", MSG.salvo("SPRINT"), "success");
                limpaFormulario();
                listarSprints();
            } catch (error) {
                mostrarMensagemNaTela("resultadogeral", "Erro ao salvar: " + error.message, "error");
            }
        }
    }
    async function listarSprints() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();

            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Data Início</th>
                        <th>Data Fim</th>
                        <th>Visivel no quadro?</th>
                        <th>Ativa?</th>
                        <th>Ações</th>
                        <th>&nbsp;</th>
                    </tr>
                </thead>
                <tbody>`;

            data.forEach(sprint => {
                tabela += `
                    <tr>
                        <td>${sprint.idsprint}</td>
                        <td>${sprint.descsprint || ''}</td>
                        <td>${formatarDataBR(sprint.dtiniciosprint)}</td>
                        <td>${formatarDataBR(sprint.dtfinalsprint)}</td>
                        <td>${sprint.visivel ? '✅ Sim' : '❌ Não'}</td>
                        <td>${sprint.ativa ? '✅ Sim' : '❌ Não'}</td>
                        <td style="text-align:center;">
                           <button type="button" class="btn btn-excluir" onclick="event.stopPropagation();encerrarSprint(${sprint.idsprint})">
                                         Encerrar Sprint
                            </button>
                        </td>
                        <td style="text-align:center;">
                              <button type="button" class="btn btn-add" onclick="event.stopPropagation();duplicarSprint(${sprint.idsprint})">
                                        Duplicar Sprint
                              </button>
                        </td>
                    </tr>`;
            });

            tabela += `</tbody></table>`;
            document.getElementById('resultadogeral').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral", MSG.erroCarregar("SPRINT"), "error");

        }
    }
    async function duplicarSprint(idsprint) {
        return true;
    }

    async function encerrarSprint(idsprint) {
        if (!confirm("Tem certeza que deseja encerrar esta Sprint?")) return;
        try {
            const response = await fetch(`${API}/encerrar/${idsprint}`, { method: 'POST' });
            mostrarMensagemNaTela("resultadogeral", MSG.alterado("SPRINT"), "sucess");
            limpaFormulario();
            listarSprints();
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral",MSG.erroSalvar("SPRINT"),"error");
        }
    }

    function limpaFormulario() {
        document.getElementById('idsprint').value = "";
        document.getElementById('descsprint').value = "";
        document.getElementById('dtiniciosprint').value = "";
        document.getElementById('dtfinalsprint').value = "";
        document.getElementById('visivel').checked = false; // Reseta o checkbox desmarcado
    }

    function formatarDataBR(dataString) {
        if (!dataString) return '';

        // O input do HTML retorna "AAAA-MM-DD"
        const partes = dataString.split('-');
        if (partes.length !== 3) return dataString;

        // Remonta no formato "DD/MM/AAAA"
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    async function listarAusencias(data_inicio, data_fim) {
        const container = document.getElementById("resultadoausencia");
        try {
            const response = await fetch(`${API}/listar_ausencias?data_inicio=${data_inicio}&data_fim=${data_fim}`);
            if (!response.ok) {
                const msg = await response.text();
                mostrarMensagemNaTela("resultadoausencias", MSG.erroCarregar("AUSÊNCIAS"), "error");
                return;
            }
            const data = await response.json();
            // Se não houver registros
            if (!data || data.length === 0) {
                container.innerHTML = `<table class="table">
                    <thead>
                        <tr>
                            <th>Data inicial</th>
                            <th>Data final</th>
                            <th>Tipo ausência</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align:center;">
                                <p style="color:red">Nenhuma ausência cadastrada para esta sprint!</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            `;
                return;
            }

            // Monta tabela com dados
            let tabela = `
            <table class="table">
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Data inicial</th>
                        <th>Data final</th>
                        <th>Tipo ausência</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody>
        `;

            data.forEach(a => {
                tabela += `
                <tr style="cursor:pointer;">
                    <td>${a.idusuario.nome}</td>
                    <td>${formatarDataBR(a.data_inicio)}</td>
                    <td>${formatarDataBR(a.data_fim)}</td>
                    <td>${a.tipoausencia?.desc_tipo_ausencia ?? ''}</td>
                    <td>${a.observacao ?? ''}</td>
                </tr>
            `;
            });

            tabela += `
                </tbody>
            </table>
        `;
            container.innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultadoausencias", MSG.erroCarregar("AUSÊNCIAS"), "error");
        }
    }
    function validaEntrada() {
        return validarDuracaoSprint() && validaParametros();
    }
    function validarDuracaoSprint() {
        const inicio = new Date(document.getElementById("dtiniciosprint").value);
        const fim = new Date(document.getElementById("dtfinalsprint").value);
        if (!inicio || !fim) {
            return true;
        }
        const dias = Math.ceil((fim - inicio) / (1000 * 60 * 60 * 24)) + 1;
        if (dias < configuracaoSprint.duracao_min_sprint) {
            mostrarMensagemNaTela("resultadogeral","A sprint deve ter no mínimo "+configuracaoSprint.duracaoMinima+" dias.", "warning");
            return false;
        }
        if (dias > configuracaoSprint.duracao_max_sprint) {
            mostrarMensagemNaTela("resultadogeral","A sprint deve ter no máximo de "+configuracaoSprint.duracaoMaxima+" dias.","warning");
            return false;
        }
    }
    async function validaParametros() {
        const data_inicio = document.getElementById("dtiniciosprint").value
        const data_fim = document.getElementById("dtfinalsprint").value;
        const idempreendimento = configuracaoSprint.idempreendimento;
        try {
            const url = `${API}/sprint_sobreposta?data_inicio=${data_inicio}&data_fim=${data_fim}&idempreendimento=${idempreendimento}`;
            const response = await fetch(url);
            if (!response.ok) {
                const msg = await response.text();
                mostrarMensagemNaTela(resultado, msg || "Erro ao buscar sprint!", "error");
                return false;
            }
            const data = await response.json();
            // Se não houver registros
            if (data) {
                if(configuracaoSprint.permitir_sprint_sobreposta) {
                    mostrarMensagemNaTela("resultadogeral","Já existem sprints abertas nesse período", "warning");
                    return false;
                }
            }
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral", "Erro ao buscar sprints", "error");
            return false;
        }
    }
</script>
</body>
</html>
