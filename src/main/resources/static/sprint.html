<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/sprint.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>

<div class="container">
    <h1>Sprint - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao ativa" onclick="alternarAba(event, 'geral')">Geral</button>
        <button class="aba-botao" onclick="alternarAba(event, 'ausencias')">Ausências programadas</button>
    </div>
    <div id="geral" class="conteudo-aba ativo">
        <input type="number" id="idsprint" onblur="buscarPorLinha(document.getElementById('idsprint').value)" placeholder="ID da sprint (Deixe vazio para novo)">
        <label for="descsprint">Descrição da sprint:</label>
        <input type="text" id="descsprint">
        <label>Empreendimento</label>
        <select id="comboEmpreendimento">
            <option value="">-- Selecione o empreendimento --</option>
        </select><br>
        <label for="dtiniciosprint">Data de Início:</label>
        <input type="date" id="dtiniciosprint">
        <label for="dtfinalsprint">Data de Término:</label>
        <input type="date" id="dtfinalsprint">
        <div class="checkbox-container">
            <div class="checkbox-group">
                <input type="checkbox" id="visivel" name="visivel">
                <label for="visivel">Sprint visível no quadro</label>
            </div>
            <div class="checkbox-group">
            <input type="checkbox" id="ativa" name="ativa">
            <label for="ativa">Sprint ativa</label>
        </div>
            <div class="btn-group">
                <button type="button" class="btn btn-salvar" onclick="salvarSprint()">Salvar</button>
                <button type="button" class="btn btn-listar" onclick="listarSprints()">Listar Todas</button>
                <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
            </div>
        </div>
    </div>
    <div id="ausencias" class="conteudo-aba">
        <h3>Ausências programadas</h3>
        <div id="resultadoausencia"></div>
    </div>

    <div id="resultadogeral"></div>
</div>

<script>
    //--------------------- MANIPULAÇÃO DOS DADOS
    const API = 'http://localhost:8080/sprints';
    const API_EMPREENDIMENTO = 'http://localhost:8080/empreendimento';

    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }

    async function carregarEmpreendimento() {
        const comboEmpreendimento = document.getElementById("comboEmpreendimento");
        try {
            const resposta = await fetch(`${API_EMPREENDIMENTO}/listar`);
            const empreendimentos = await resposta.json();
            empreendimentos.forEach(e => {
                const opcao = document.createElement('option');
                opcao.value = e.idempreendimento;
                opcao.textContent = e.descempreendimento;
                comboEmpreendimento.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral","Erro ao carregar empreendimento: "+error.message,"error");
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregarEmpreendimento();
    });

    async function salvarSprint() {
        const { value: descsprint } = document.getElementById('descsprint');
        const { value: dataInicio } = document.getElementById('dtiniciosprint');
        const { value: dataFim } = document.getElementById('dtfinalsprint');

        // CAPTURANDO O CHECKBOX: Retorna true se estiver marcado, ou false se estiver desmarcado
        const visivel = document.getElementById('visivel').checked;

        const sprint = {
            descsprint: descsprint || null,
            dataInicio: dataInicio || null,
            dataFim: dataFim || null,
            visivel: visivel, // Envia true/false para o atributo booleano do Spring
            empreendimento: {
                idEmpreendimento: document.getElementById('comboEmpreendimento').value || null
            }
        };
        try {
            const response = await fetch(`${API}/salvar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sprint)
            });

            if (!response.ok) throw new Error(await response.text());

            const data = await response.json();
            mostrarMensagemNaTela("resultadogeral", "Sprint gravada com sucesso", "sucesso");
            limpaFormulario();
            listarSprints();
        } catch (error) {
            mostrarMensagemNaTela("resultadigeral", "Erro ao salvar: " + error.message, "error");
        }
    }

    async function buscarPorLinha(id) {
        const hoje = new Date().toISOString().split("T")[0];
        var data_final;
        var data_inicio;
        try {
            const response = await fetch(`${API}/${id}`);
            if (!response.ok)
                mostrarMensagemNaTela("resultadogeral", "Sprint não encontrada", "warnning");

            const sprint = await response.json();
            data_inicio = sprint.dtiniciosprint || hoje;
            data_final = sprint.dtfinalsprint || hoje;

            document.getElementById('idsprint').value = sprint.idsprint;
            document.getElementById('descsprint').value = sprint.descsprint || null;
            document.getElementById('dtiniciosprint').value = data_inicio;
            document.getElementById('dtfinalsprint').value = data_final;
            document.getElementById('comboEmpreendimento').value = sprint.empreendimento.idempreendimento;

            // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
            document.getElementById('visivel').checked = sprint.visivel || false;

            // CARREGA AS AUSENCIAS PROGRAMADAS
            if(sprint.idsprint != null) {
                // Limpa mensagens e monta equipe se o usuário mudar de aba depois
                mostrarMensagemNaTela("resultadogeral", "Sprint selecionada: " + sprint.descsprint, "green");
                await listarAusencias(data_inicio, data_final);

            }
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral", "Erro ao carregar Sprint: " + error.message, "error");
        }
    }

    async function listarSprints() {
        try {
            const response = await fetch(`${API}/listar`);
            const data = await response.json();

            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Data Início</th>
                        <th>Data Fim</th>
                        <th>Visivel no quadro?</th>
                        <th>Ativa?</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>`;

            data.forEach(sprint => {
                tabela += `
                    <tr onclick="buscarPorLinha(${sprint.idsprint})" style="cursor:pointer;">
                        <td>${sprint.idsprint}</td>
                        <td>${sprint.descsprint || ''}</td>
                        <td>${formatarDataBR(sprint.dtiniciosprint)}</td>
                        <td>${formatarDataBR(sprint.dtfinalsprint)}</td>
                        <td>${sprint.visivel ? '✅ Sim' : '❌ Não'}</td>
                        <td>${sprint.ativa ? '✅ Sim' : '❌ Não'}</td>
                        <td style="text-align:center;">
                           <button type="button" class="btn btn-excluir" onclick="event.stopPropagation();excluirSprint(${sprint.idsprint})">
                                        <i class="fa-solid fa-trash-can"></i> Encerrar Sprint
                                    </button>
                        </td>
                    </tr>`;
            });

            tabela += `</tbody></table>`;
            document.getElementById('resultadogeral').innerHTML = tabela;

        } catch (error) {
            mostrarMensagemNaTela("resultadogeral","Erro ao listar sprint: " + error.message,"error");
        }
    }

    async function excluirSprint(idsprint) {
        if (!confirm("Tem certeza que deseja excluir esta Sprint?")) return;
        try {
            const response = await fetch(`${API}/excluir/${idsprint}`, { method: 'DELETE' });
            const texto = await response.text();
            mostrarMensagemNaTela("resultadigeral", "Excluída com sucesso ", "success");
            limpaFormulario();
            listarSprints();
        } catch (error) {
            mostrarMensagemNaTela("resultadogeral","Erro ao excluir sprint: " + error.message,"error");
        }
    }

    function limpaFormulario() {
        document.getElementById('idsprint').value = "";
        document.getElementById('descsprint').value = "";
        document.getElementById('dtiniciosprint').value = "";
        document.getElementById('dtfinalsprint').value = "";
        document.getElementById('visivel').checked = false; // Reseta o checkbox desmarcado
    }

    function formatarDataBR(dataString) {
        if (!dataString) return '';

        // O input do HTML retorna "AAAA-MM-DD"
        const partes = dataString.split('-');
        if (partes.length !== 3) return dataString;

        // Remonta no formato "DD/MM/AAAA"
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    async function listarAusencias(data_inicio, data_fim) {
        const container = document.getElementById("resultadoausencia");
        try {
            const response = await fetch(`${API}/listar_ausencias?data_inicio=${data_inicio}&data_fim=${data_fim}`);
            if (!response.ok) {
                const msg = await response.text();
                mostrarMensagemNaTela(msg || "Erro ao listar ausências!", 2);
                return;
            }
            const data = await response.json();
            // Se não houver registros
            if (!data || data.length === 0) {
                container.innerHTML = `<table class="table">
                    <thead>
                        <tr>
                            <th>Data inicial</th>
                            <th>Data final</th>
                            <th>Tipo ausência</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align:center;">
                                Nenhuma ausência cadastrada
                            </td>
                        </tr>
                    </tbody>
                </table>
            `;
                return;
            }

            // Monta tabela com dados
            let tabela = `
            <table class="table">
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Data inicial</th>
                        <th>Data final</th>
                        <th>Tipo ausência</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody>
        `;

            data.forEach(a => {
                tabela += `
                <tr style="cursor:pointer;">
                    <td>${a.idusuario.nome}</td>
                    <td>${formatarDataBR(a.data_inicio)}</td>
                    <td>${formatarDataBR(a.data_fim)}</td>
                    <td>${a.tipoausencia?.desc_tipo_ausencia ?? ''}</td>
                    <td>${a.observacao ?? ''}</td>
                </tr>
            `;
            });

            tabela += `
                </tbody>
            </table>
        `;
            container.innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela(error.message || ". Erro ao listar ausências","error");
        }
    }
</script>
</body>
</html>
