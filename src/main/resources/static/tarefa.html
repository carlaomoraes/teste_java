<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épicos - TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/epico.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/funcoes.js"></script>
<script src="js/mensagens.js"></script>
<div class="container">
    <h1>Tarefa - TaskController 1.0</h1>
    <div class="abas-container">
        <button class="aba-botao" onclick="alternarAba(event, 'tarefa')">Tarefas</button>
        <button class="aba-botao" onclick="alternarAba(event, 'apontamentos')">Apontamentos</button>
    </div>
    <div id="tarefa" class="conteudo-aba ativo">
        <!-- ESTÓRIA -->
        <div class="row mb-4">
            <div class="col-md-4">
                <label class="form-label"> Estória * </label>
                <select id="comboEstoria"  class="form-select"  required>  </select>
            </div>
        </div>
        <input type="number" onblur="buscarPorLinha(document.getElementById('idtarefa').value)" id="idtarefa" placeholder="ID da estoria (Deixe vazio para novo)">
        <div class="form-grid">
            <div>
                <label>Descrição</label>
                <input type="text" id="desctarefa" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Status</label>
                <select id="comboStatusTA">
                    <option value="">-- Selecione o status --</option>
                </select>
            </div>
            <div>
                <label>Criador</label>
                <select id="comboCriadorTA">
                    <option value="">-- Selecione o criador --</option>
                </select>
            </div>
            <div>
                <label>Responsável</label>
                <select id="comboResponsavelTA">
                    <option value="">-- Selecione o responsável --</option>
                </select>
            </div>
            <div>
                <label>Data inicial</label>
                <input type="date" id="data_inicio_TA">
            </div>
            <div>
                <label>Data final prevista</label>
                <input type="date" id="data_fim_TA">
            </div>
            <div>
                <label>Resumo</label>
                <input type="text" id="resumo_tarefa" oninput="converterMaiusculo(this)">
            </div>
            <div>
                <label>Horas estimadas</label>
                <input type="number" id="horas_estimadas_TA" class="form-control text-end" disabled>
            </div>
            <div>
                <label>Horas realizadas</label>
                <input type="number"  id="horas_realizadas_TA" class="form-control text-end" disabled>
            </div>
            <div>
                <label>Tipo de tarefa</label>
                <select id="comboTipoTarefa">
                    <option value="">-- Selecione o tipo de tarefa --</option>
                </select>
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="bloqueada_tarefa" value="0"> Tarefa bloqueada
            </label>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn btn-add" onclick="criarTarefa();">Nova</button>
            <button type="button" class="btn btn-salvar" onclick="salvarTarefa();">Salvar</button>
            <button type="button" class="btn btn-listar"  onclick="listarTarefas()">Listar</button>
            <button type="button" class="btn btn-voltar" onclick="history.back()">Voltar</button>
        </div>
        <div id="resultado_tarefa"></div>
    </div>
    <div id="apontamentos" class="conteudo-aba">
        <div class="form-grid">
            <div>
                <label for="dataapontamento">Data apontamento:</label>
                <input type="date" id="dataapontamento" name="dataapontamento">
            </div>
            <div>
                <label for="horaapontamento">Hora apontamento:</label>
                <input type="time" id="horaapontamento" name="horaapontamento">
            </div>
        </div>
        <div class="form-grid">
            <div>
                <label for="resumo">Descrição:</label>
                <input type="text" id="resumo" name="resumo">
            </div>
        </div>
        <div class="btn-group" data-toggle="buttons-radio">
            <button type="button" class="btn"  onclick="salvarApontamentos();">Salvar</button>
            <button type="button" class="btn" onclick="cancelarApontamentos();">Cancelar</button>
        </div>
        <div id="resultadoapontamento"></div>

    </div>
</div>
<script>
    //-----------------CARREGAR CONFIGURAÇÃO
    let configuracao = {
        idepico: 0,
        idestoria: 0,
        idtarefa: 0
    };
    let statusAtualTarefa = 1;

    const TIPO_ENTIDADE = {
        EPICO: 1,
        ESTORIA: 2,
        TAREFA: 3,
        SPRINT: 4,
        EMPREENDIMENTO: 5,
    };

    //--------------------- MANIPULAÇÃO DOS DADOS
    const API_ESTORIA = 'http://localhost:8080/estorias';
    const API_STATUS = 'http://localhost:8080/status_entidades';
    const API_USUARIOS = 'http://localhost:8080/usuarios';
    const API_TIPO_TAREFA = 'http://localhost:8080/tipo_tarefa';
    const API_TAREFA = 'http://localhost:8080/tarefas';
    const API_TEMPOGASTO = 'http://localhost:8080/tempogasto';

    function alternarAba(event, idAbaDestino) {
        // 1. Pega todos os blocos de conteúdo e esconde tirando a classe 'ativo'
        const conteudos = document.querySelectorAll('.conteudo-aba');
        conteudos.forEach(conteudo => {
            conteudo.classList.remove('ativo');
        });

        // 2. Pega todos os botões e remove a classe 'ativa'
        const botoes = document.querySelectorAll('.aba-botao');
        botoes.forEach(botao => {
            botao.classList.remove('ativa');
        });

        // 3. Mostra o bloco de conteúdo que o usuário clicou adicionando 'ativo'
        document.getElementById(idAbaDestino).classList.add('ativo');

        // 4. Adiciona a classe 'ativa' no botão específico que sofreu o clique
        event.currentTarget.classList.add('ativa');
    }

    // --- CARREGAMENTO ASSÍNCRONO DOS COMBOS ---
    async function carregarGestor() {
        const comboCriadorTA = document.getElementById("comboCriadorTA");
        const comboResponsavelTA = document.getElementById("comboResponsavelTA");
        try {
            const resposta = await fetch(`${API_USUARIOS}/listar`);
            const usuarios = await resposta.json();
            usuarios.forEach(usuario => {
                const opcao = document.createElement('option');
                opcao.value = usuario.idusuario;
                opcao.textContent = usuario.nome;
                comboCriadorTA.add(opcao.cloneNode(true));
                comboResponsavelTA.add(opcao.cloneNode(true));
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_estoria", "Erro ao carregar gestor: "+error.message,"error");
        }
    }
    //------------------
    async function carregarEstoria() {
        const comboEstoria = document.getElementById("comboEstoria");
        try {
            const resposta = await fetch(`${API_ESTORIA}/listar`);
            const estorias = await resposta.json();
            estorias.forEach(estoria => {
                const opcao = document.createElement('option');
                opcao.value = estoria.idestoria;
                opcao.textContent = estoria.descestoria;
                comboEstoria.add(opcao.cloneNode(true));
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_estoria", "Erro ao carregar gestor: "+error.message,"error");
        }
    }
    //------------------
    async function acharOrdem(ENTIDADE) {
        try {
            const linha = `${API_STATUS}/acharOrigem?idTipoEntidade=${ENTIDADE}`;
            console.log(linha);
            const resposta = await fetch(linha);
            if (!resposta.ok) {
                throw new Error(`Erro ${resposta.status}`);
            }
            const vetor = await resposta.json();
            console.log(vetor);
            return vetor;
        } catch (error) {
            mostrarMensagemNaTela("resultado","Erro ao carregar status: " + error.message, "error");
        }
    }

    async function carregarStatus(idStatusAtual, ENTIDADE) {
        const comboStatusES = document.getElementById("comboStatusES");
        const comboStatusTA = document.getElementById("comboStatusTA");
        switch (ENTIDADE) {
            case TIPO_ENTIDADE.ESTORIA:
                comboStatusES.innerHTML = '<option value="">Selecione...</option>';
                break;
            case TIPO_ENTIDADE.TAREFA:
                comboStatusTA.innerHTML = '<option value="">Selecione...</option>';
                break;
        }
        try {
            const linha = `${API_STATUS}/${encodeURIComponent(idStatusAtual)}/proximo/${ENTIDADE}`;
            const resposta = await fetch(linha);
            if (!resposta.ok) {
                throw new Error(`Erro ${resposta.status}`);
            }
            const vetor = await resposta.json();
            const opcaoPadrao = document.createElement("option");
            opcaoPadrao.value = "";
            opcaoPadrao.textContent = "Selecione...";
            vetor.forEach(status => {
                const opcao = document.createElement("option");
                opcao.value = status.idstatus;
                opcao.textContent = status.descstatus;
                switch (ENTIDADE) {
                    case TIPO_ENTIDADE.ESTORIA:
                        comboStatusES.appendChild(opcao);
                        break;
                    case TIPO_ENTIDADE.TAREFA:
                        comboStatusTA.appendChild(opcao);
                        break;
                }
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_estoria","Erro ao carregar status: " + error.message, "error");
        }
    }

    async function carregarTipoTarefa() {
        const comboTipoTarefa = document.getElementById("comboTipoTarefa");
        try {
            const resposta = await fetch(`${API_TIPO_TAREFA}/listar`);
            const tipos = await resposta.json();
            tipos.forEach(t => {
                const opcao = document.createElement('option');
                opcao.value = t.idtipo_tarefa;
                opcao.textContent = t.desctipo_tarefa;
                comboTipoTarefa.appendChild(opcao);
            });
        } catch (error) {
            mostrarMensagemNaTela("resultado_epico", MSG.erroCarregar("TIPO DE TAREFAS"), "error");
        }
    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', async () => {
        await carregarGestor();
        await carregarTipoTarefa();
        await carregarEstoria();

        await listarTarefas(document.getElementById("comboEstoria").value);
        /*
        statusAtualEpico -> Aponta para o próximo status
        idTipoEntidade -> Pega a referencia da tabela tipo_entidade
        1 - ÉPICO
        2 - ESTÓRIA
        3 - TAREFA
        4 - SPRINT
        5 - EMPREENDIMENTO
         */
        let ordem = await acharOrdem(TIPO_ENTIDADE.ESTORIA);
        await carregarStatus(ordem, TIPO_ENTIDADE.ESTORIA);
        ordem = await acharOrdem(TIPO_ENTIDADE.TAREFA);
        await carregarStatus(ordem, TIPO_ENTIDADE.TAREFA);
    });

    async function criarTarefa() {
        const hoje = new Date();
        await limparFormulario("TA");
        await limparFormulario("ES");
        let ordem = await acharOrdem(TIPO_ENTIDADE.TAREFA);
        await carregarStatus(ordem, TIPO_ENTIDADE.TAREFA);
        document.getElementById("data_inicio_TA").value = hoje;
        document.getElementById("data_fim_TA").value = hoje;
        document.getElementById('comboCriadorTA').value = sessionStorage.getItem("usuarioIdUsuario");
        document.getElementById('comboResponsavelTA').value = sessionStorage.getItem("usuarioIdUsuario");
    }

    async function salvarApontamentos(IDTAREFA) {
          const id_tipo_ausencia = parseInt(document.getElementById("combotipo").value);
          const datainicial = document.getElementById('datainicial').value;
          const datafinal = document.getElementById('datafinal').value;
          const observacao = document.getElementById('observacao').value;
          const apontamento =  {
               data_inicio: datainicial || dataAtual.toISOString().split("T")[0],
               data_fim: datafinal || dataAtual.toISOString().split("T")[0],
               observacao: observacao || "N/A",
               idusuario: parseInt(document.getElementById('idusuario').value),
               id_tipo_ausencia: id_tipo_ausencia
          };
          try {
              const response = await fetch(`${API_TEMPOGASTO}/salvar`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(apontamento)
                    });
                    const data = await response.json();
                    mostrarMensagemNaTela("resultadoapontamento", MSG.salvo("APONTAMENTO"), "success");
                    setTimeout(() => {
                        cancelarAusencia();
                        listarApontamentos(IDTAREFA);
                    }, 1000);
                } catch (error) {
                    mostrarMensagemNaTela("resultadoapontamento", MSG.erroSalvar("AUSÊNCIA"), "error");
                }
            }
        }

    }

    async function salvarTarefa() {
        const hoje = new Date();
        const bloqueada = document.getElementById("bloqueada_tarefa").checked || 0;
        const descTarefa = document.getElementById("desctarefa").value;
        const data_inicio = document.getElementById("data_inicio_TA").value || hoje;
        const data_fim_prevista = document.getElementById("data_fim_TA").value || hoje;
        const tarefa = {
            idtarefa: Number(document.getElementById("idtarefa").value) || null,
            idestoria: Number(configuracao.idestoria) || null,
            desctarefa: descTarefa || null,
            bloqueada: bloqueada || false,
            idcriador: document.getElementById('comboCriadorTA').value || null,
            idresponsavel: document.getElementById('comboResponsavelTA').value || null,
            idstatus: document.getElementById('comboStatusTA').value || null,
            data_inicio: data_inicio,
            data_fim_prevista: data_fim_prevista,
            data_conclusao: null,
            idtipotarefa: document.getElementById('comboTipoTarefa').value
        };
        try {
            const response = await fetch(`${API_TAREFA}/salvar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(tarefa)
            });
            const data = await response.json();
            mostrarMensagemNaTela("resultado_tarefa", MSG.salvo("TAREFA"), "success");
            setTimeout(() => {
                limparFormulario("TA");
                listarTarefas(idEpico, idEstoria);
            }, 1000);
        } catch (error) {
            mostrarMensagemNaTela("resultado_tarefa", MSG.erroSalvar("TAREFA"), "error");
        }
    }
    async function limparFormulario(ABA) {
        if(ABA === "ES") {
            document.getElementById('idestoria').value = "";
            document.getElementById('descestoria').value = "";
            document.getElementById('resumo_estoria').value = "";
            document.getElementById('bloqueada_estoria').checked = false;
            document.getElementById('data_inicialES').value = "";
            document.getElementById('data_fim_previstaES').value = "";
            document.getElementById('comboCriadorES').value = "";
            document.getElementById('comboResponsavelES').value = "";
            document.getElementById('comboStatusES').value = "";
            document.getElementById('combostorypoints').value = -1;
            document.getElementById('horas_estimadas').value = 0.00;
        } else if(ABA === "TA") {
            document.getElementById('idtarefa').value = "";
            document.getElementById('desctarefa').value = "";
            document.getElementById('resumo_tarefa').value = "";
            document.getElementById('bloqueada_estoria').checked = false;
            document.getElementById('data_inicio_TA').value = "";
            document.getElementById('data_fim_TA').value = "";
            document.getElementById('comboCriadorTA').value = "";
            document.getElementById('comboResponsavelTA').value = "";
            document.getElementById('comboStatusTA').value = "";
            document.getElementById('comboTipoTarefa').value = "";

        }
    }
    async function listarTarefas(idEstoria) {
        const cor = "6c757d";
        if(idEstoria === null) {
            mostrarMensagemNaTela("resultado_tarefa", "Selecione uma estória", "warning");
            return;
        }
        try {
            const response = await fetch(`${API_TAREFA}/${idEstoria}/tarefas`);
            const data = await response.json();
            if(data.length <= 0) {
                mostrarMensagemNaTela("resultado_estoria",MSG.naoEncontrada("TAREFA"),"warning");
                return;
            }
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">&nbsp;</th>
                        <th class="table-header">ID</th>
                        <th class="table-header">Descrição</th>
                        <th class="table-header">Status</th>
                        <th class="table-header">Data inicial</th>
                        <th class="table-header">Data final</th>
                        <th class="table-header">Horas estimadas</th>
                        <th class="table-header">Horas gastas</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(tarefa => {
                tabela += `
        <tr onclick="buscarPorLinha(${tarefa.idtarefa}, 'TAREFA')" style="cursor:pointer;">
            <td>${obterIconeTipo(tarefa.tipotarefa)}</td>
            <td>${tarefa.idtarefa}</td>
            <td>${tarefa.desctarefa}</td>
            <td> <span class="badge" style="background-color:${tarefa.corstatus}; color:white;">${tarefa.descstatus}</span></td>
            <td>${formatarData(tarefa.data_inicio)}</td>
            <td>${formatarData(tarefa.data_conclusao)}</td>
            <td>${tarefa.horas_estimadas ?? 0}</td>
            <td>${tarefa.horas_realizadas ?? 0}</td>
            <td>
                <button type="button"
                        class="btn"
                        onclick="excluirTarefa(${tarefa.idtarefa}); event.stopPropagation();">
                    Excluir
                </button>
            </td>
        </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultado_tarefa').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado_tarefa",MSG.errolistar("TAREFAS"),"error");
        }
    }
    async function listarApontamentos(idTarefa){
        try {
            const response = await fetch(`${API_TEMPOGASTO}/listar/${idTarefa}`);
            const data = await response.json();
            if(data.length <= 0) {
                return;
            }
            let tabela = `
            <table class="table" border="1" width="100%" cellspacing="0" cellpadding="10">
                <thead>
                    <tr>
                        <th class="table-header">ID Tarefa</th>
                        <th class="table-header">Descrição Tarefa</th>
                        <th class="table-header">ID Usuário</th>
                        <th class="table-header">Nome Usuário</th>
                        <th class="table-header">Data apontamento</th>
                        <th class="table-header">Horas gastas</th>
                        <th class="table-header">Excluir</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(tarefa => {
                tabela += `
        <tr>
            <td>${tarefa.idtarefa}</td>
            <td>${tarefa.desctarefa}</td>
            <td>${tarefa.idusuario}</td>
            <td>${tarefa.nomeusuario}</td>
            <td>${formatarData(tarefa.data_execucao)}</td>
            <td>${tarefa.hora_execucao}</td>
            <td>
                <button type="button"
                        class="btn"
                        onclick="excluirApontamento(${tarefa.idtempogasto}, ${idTarefa}); event.stopPropagation();">
                    Excluir
                </button>
            </td>
        </tr>`;});
            tabela += `</tbody></table>`;
            document.getElementById('resultadoapontamento').innerHTML = tabela;
        } catch (error) {
            mostrarMensagemNaTela("resultado_tarefa",MSG.errolistar("TAREFAS"),"error");
        }
    }

    async function buscarPorLinha(idTarefa) {
         configuracao.idtarefa = idTarefa;
         try {
            const linha = `${API_TAREFA}/DTO/${idTarefa}`;
            const response = await fetch(linha);
            const tarefa = await response.json();
            if (!response.ok) {
                mostrarMensagemNaTela("resultado_tarefa",MSG.naoEncontrada("TAREFA"), "error");
            } else {
                document.getElementById('idtarefa').value = tarefa.idtarefa;
                document.getElementById('desctarefa').value = tarefa.desctarefa;
                // PREENCHENDO O CHECKBOX: Define como marcado (true) ou desmarcado (false) vindo do banco
                document.getElementById('bloqueada_tarefa').checked = tarefa.bloqueada || 0;
                document.getElementById('data_inicio_TA').value = tarefa.data_inicio;
                document.getElementById('data_fim_TA').value = tarefa.data_conclusao;
               // CARREGANDO OS COMBOS
                document.getElementById('comboStatusTA').value = tarefa.idstatus;
                document.getElementById('comboCriadorTA').value = tarefa.idcriador;
                document.getElementById('comboResponsavelTA').value = tarefa.idresponsavel;

                // MONTA O COMBO PARA PROXIMO STATUS
                statusAtualTarefa = tarefa.idstatus;
                await carregarStatus(statusAtualTarefa, TIPO_ENTIDADE.TAREFA);
                await listarApontamentos(tarefa.idtarefa);
                 mostrarMensagemNaTela("resultado_tarefa","Tarefa selecionada: " + tarefa.idtarefa, "success");
                }
            } catch (error) {
                mostrarMensagemNaTela("resultado_tarefa",MSG.erroCarregar("TAREFAS"), "error");
            }
    }
    async function excluirApontamento(idTempoGasto, idTarefa) {
        const linha = `${API_TEMPOGASTO}/${idTempoGasto}`;
        try {
            const response = await fetch(linha, {
                method: 'DELETE'
            });
            const texto = await response.text();
            mostrarMensagemNaTela("resultadoapontamento",MSG.excluido("APONTAMENTO"), "success");
            await listarApontamentos(idTarefa)
        } catch (error) {
            mostrarMensagemNaTela("resultadoapontamento",MSG.erroExcluir("APONTAMENTO"), "error");
        }
    }
</script>
</body>
</html>
