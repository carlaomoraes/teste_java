<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskController 1.0</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS Global -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS específico da tela -->
    <link rel="stylesheet" href="css/pages/sprintatual.css">
    <link rel="stylesheet" href="css/pages/funcoes.css">
</head>
<body>
<script src="js/utils/funcoes.js"></script>
<script src="js/utils/mensagens.js"></script>
<div class="container-fluid">

    <!-- Cabeçalho -->
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div class="d-flex justify-content-between align-items-center" id="cabecalho" >

            </div>
            <div class="text-end">
                <h5 class="text-warning">Saúde: 82%</h5>
                <small>Dia 9 de 15</small>
            </div>
        </div>
    </div>

    <!-- Cards -->
    <div class="row mb-3">

        <div class="col-md-3">
            <div class="card text-bg-success">
                <div class="card-body">
                    <h3>18</h3>
                    Concluídas
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h3>7</h3>
                    Em andamento
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-danger">
                <div class="card-body">
                    <h3>3</h3>
                    Atrasadas
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-bg-secondary">
                <div class="card-body">
                    <h3>272 h</h3>
                    Capacidade
                </div>
            </div>
        </div>

    </div>

    <!-- Roadmap -->
    <div class="card">

        <div class="card-header">
            Roadmap da Sprint
        </div>

        <div class="card-body p-0">

            <table class="table table-bordered align-middle mb-0">

                <thead>

                <tr>

                    <th style="width:250px">
                        Equipe / Estórias
                    </th>

                    <th>24</th>
                    <th>25</th>
                    <th>26</th>
                    <th>27</th>
                    <th>28</th>
                    <th class="bg-warning">29</th>
                    <th>30</th>
                    <th>31</th>
                    <th>01</th>
                    <th>02</th>

                </tr>

                </thead>

                <tbody>

                <!-- Ausências -->

                <tr class="table-light">
                    <td colspan="11">
                        <b>Ausências Programadas</b>
                    </td>
                </tr>

                <tr>

                    <td>Carlos</td>

                    <td></td>
                    <td></td>
                    <td class="bg-danger text-white" colspan="2">
                        Férias
                    </td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>

                </tr>

                <tr>

                    <td>João</td>

                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="bg-warning" colspan="2">
                        Curso
                    </td>
                    <td></td>
                    <td></td>
                    <td></td>

                </tr>

                <!-- Tarefas -->

                <tr class="table-light">
                    <td colspan="11">
                        <b>Estórias</b>
                    </td>
                </tr>

                <tr>

                    <td>Login</td>

                    <td colspan="3" class="bg-success"></td>

                    <td colspan="2"></td>

                    <td colspan="5"></td>

                </tr>

                <tr>

                    <td>Dashboard</td>

                    <td></td>
                    <td></td>

                    <td colspan="5" class="bg-primary"></td>

                    <td></td>
                    <td></td>

                </tr>

                <tr>

                    <td>Integração PIX</td>

                    <td></td>

                    <td colspan="4" class="bg-danger"></td>

                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>
    function carregaCabecalho(){
        let cabecalho = ` <div> `;
            cabecalho += `<h4>Sprint 08 - Módulo Financeiro</h4>`;
            cabecalho += `<small>20/07/2026 até 31/08/2026</small>`;
            cabecalho += `</div>`;
        document.getElementById('cabecalho').innerHTML = cabecalho;

    }
    // Inicializa os seletores assim que o HTML carregar completamente
    document.addEventListener('DOMContentLoaded', () => {
        carregaCabecalho();
    });
</script>
</body>
</html>
